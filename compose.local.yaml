name: basic-platform-local

# 统一本地编排：一个 frontend 容器承载基础平台、合同管理、客户与商机管理、
# 客户自助门户、项目管理系统五个前端模块；api、contract-api、customer-api、
# portal-api、project-api 分别承载五个彼此隔离的后端进程和运行配置。
# MySQL、Temporal、迁移任务和隔离部署助手属于基础设施/一次性任务，不对宿主机发布业务端口。
# LAN 临时访问使用单独的覆盖文件，不修改本地或生产环境的常规环境文件。
# 默认加载空占位文件；scripts/lan-access.sh enable 时才会替换为临时覆盖文件。
x-platform-runtime-env: &platform-runtime-env
  - ${BASIC_PLATFORM_RUNTIME_ENV_FILE:-./docker/.env.local}
  - ${BASIC_PLATFORM_LAN_OVERRIDE_ENV_FILE:-./docker/.env.lan.disabled}

x-contract-runtime-env: &contract-runtime-env
  - ${CONTRACT_RUNTIME_ENV_FILE:-../contract_management/.env.local}
  - ${CONTRACT_LAN_OVERRIDE_ENV_FILE:-./docker/.env.lan.disabled}

x-customer-runtime-env: &customer-runtime-env
  - ${CUSTOMER_RUNTIME_ENV_FILE:-./docker/.env.customer.local}
  - ${CUSTOMER_LAN_OVERRIDE_ENV_FILE:-./docker/.env.lan.disabled}

x-portal-runtime-env: &portal-runtime-env
  - ${PORTAL_RUNTIME_ENV_FILE:-./docker/.env.portal.local}
  - ${PORTAL_LAN_OVERRIDE_ENV_FILE:-./docker/.env.lan.disabled}

x-project-runtime-env: &project-runtime-env
  - ${PROJECT_RUNTIME_ENV_FILE:-../project_management/.env.local}
  - ${PROJECT_LAN_OVERRIDE_ENV_FILE:-./docker/.env.lan.disabled}

x-settlement-runtime-env: &settlement-runtime-env
  - ${SETTLEMENT_RUNTIME_ENV_FILE:-../Settlement/.env.local}

# 数据库与一次性迁移/初始化任务不需要 LAN 覆盖环境，固定使用常规运行时环境，
# 避免"对外访问"配置应用时把 MySQL、迁移或 Worker 容器一并重建。
x-platform-db-env: &platform-db-env
  - ${BASIC_PLATFORM_RUNTIME_ENV_FILE:-./docker/.env.local}

x-contract-db-env: &contract-db-env
  - ${CONTRACT_RUNTIME_ENV_FILE:-../contract_management/.env.local}

x-customer-db-env: &customer-db-env
  - ${CUSTOMER_RUNTIME_ENV_FILE:-./docker/.env.customer.local}

x-project-db-env: &project-db-env
  - ${PROJECT_RUNTIME_ENV_FILE:-../project_management/.env.local}

x-settlement-db-env: &settlement-db-env
  - ${SETTLEMENT_RUNTIME_ENV_FILE:-../Settlement/.env.local}

x-data-analysis-runtime-env: &data-analysis-runtime-env
  - ${DATA_ANALYSIS_RUNTIME_ENV_FILE:-../data_analysis/.env.local}
  - ${DATA_ANALYSIS_LAN_OVERRIDE_ENV_FILE:-./docker/.env.lan.disabled}

x-data-analysis-db-env: &data-analysis-db-env
  - ${DATA_ANALYSIS_RUNTIME_ENV_FILE:-../data_analysis/.env.local}

# 基础平台迁移、初始化和受控部署助手复用同一个后端镜像，但只有 api 服务拥有构建定义。
# 这样 Compose 每次部署只构建一次基础平台后端镜像，不会把辅助任务误认为独立业务镜像。
x-platform-backend-runtime: &platform-backend-runtime
  image: basic-platform/backend:local

# 合同管理 API 与 Temporal Worker 位于同一个后端运行镜像中。
x-contract-backend-runtime: &contract-backend-runtime
  image: contract-management/backend:local

# 客户与商机管理 API 与 CRM 本地迁移任务复用同一个后端镜像。
x-customer-backend-runtime: &customer-backend-runtime
  image: customer-opportunity/backend:local

# 客户自助门户使用独立镜像和容器。虽然源码与 CRM 位于同一仓库，但镜像只包含
# portal-server，不把两个 HTTP 进程打包进同一业务容器。
x-portal-backend-runtime: &portal-backend-runtime
  image: customer-portal/backend:local

# 项目管理系统使用独立仓库、独立镜像和容器；API 与 Temporal Worker 位于同一后端运行镜像中。
x-project-backend-runtime: &project-backend-runtime
  image: project-management/backend:local

x-settlement-backend-runtime: &settlement-backend-runtime
  image: settlement/backend:local

services:
  # 独立 Keycloak 认证层，由 scripts/docker-local.sh 通过 keycloak profile 启动。
  # Keycloak 使用独立 MySQL 数据卷，绝不复用任何业务数据库。
  keycloak-db:
    image: mysql:8.4
    profiles: ["keycloak"]
    environment:
      MYSQL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      MYSQL_USER: ${KEYCLOAK_DB_USER:-keycloak}
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-REPLACE_WITH_LOCAL_KEYCLOAK_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD:-REPLACE_WITH_LOCAL_KEYCLOAK_DB_ROOT_PASSWORD}
    volumes:
      - keycloak_mysql_local_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [default]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    profiles: ["keycloak"]
    command: ["start-dev", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-db:3306/${KEYCLOAK_DB_NAME:-keycloak}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-REPLACE_WITH_LOCAL_KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-REPLACE_WITH_LOCAL_KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      # Discovery must retain the browser-visible issuer even when Go services
      # access Keycloak through its private Compose-network endpoint.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:18090}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-18090}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      default:
        aliases: [keycloak]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    env_file: *platform-db-env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_local_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *platform-backend-runtime
    env_file: *platform-db-env
    command: ["./migrate"]
    volumes:
      - ./data/keys:/app/data/keys
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # 该服务不由普通 `up` 自动启动，由 scripts/docker-local.sh 在迁移成功后按需 run。
  # bootstrap-admin 本身会检查数据库状态，已初始化时直接成功退出，因此可重复执行。
  bootstrap-admin:
    <<: *platform-backend-runtime
    env_file: *platform-db-env
    command: ["./bootstrap-admin"]
    volumes:
      - ./data/keys:/app/data/keys
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["bootstrap"]
    restart: "no"

  # 基础平台后端容器：API 与后台 Worker 运行在同一容器中。
  api:
    <<: *platform-backend-runtime
    build:
      context: .
      dockerfile: Dockerfile
    env_file: *platform-runtime-env
    environment:
      BASIC_PLATFORM_RUN_WORKER_WITH_API: "true"
      SUBSYSTEM_ONBOARDING_AUTOMATION_ENABLED: "true"
      SUBSYSTEM_PROJECTS_ROOT: ${SUBSYSTEM_HOST_PROJECTS_ROOT}
      SUBSYSTEM_GATEWAY_SCRIPT_PATH: ${BASIC_PLATFORM_HOST_PROJECT_ROOT}/scripts/portal-gateway.sh
      SUBSYSTEM_GATEWAY_INCLUDE_PATH: ${BASIC_PLATFORM_HOST_PROJECT_ROOT}/docker/portal-apps-locations.conf
      SUBSYSTEM_PROVISIONING_SOCKET_PATH: /run/basic-platform-provisioner/provisioner.sock
      SUBSYSTEM_PLATFORM_COMPOSE_PROJECT: basic-platform-local
      SUBSYSTEM_PLATFORM_FRONTEND_SERVICE: frontend
      SUBSYSTEM_PLATFORM_DOCKER_NETWORK: basic-platform-local_default
      SUBSYSTEM_DOCKER_BINARY: docker
      SUBSYSTEM_ONBOARDING_TIMEOUT: 15m
      # catalog-publisher 长期凭据，供 subsystem-update 触发的 post-rebuild sync 使用。
      CONTRACT_CATALOG_PUBLISHER_CLIENT_ID: ${CONTRACT_CATALOG_PUBLISHER_CLIENT_ID}
      CONTRACT_CATALOG_PUBLISHER_CLIENT_SECRET: ${CONTRACT_CATALOG_PUBLISHER_CLIENT_SECRET}
    command: ["./api"]
    volumes:
      - ./data/keys:/app/data/keys:ro
      - ./data/logs:/app/data/logs
      - ./data/uploads:/app/data/uploads
      - subsystem_provisioner_socket:/run/basic-platform-provisioner
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      subsystem-provisioner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      default:
        aliases:
          - platform-api
    restart: unless-stopped

  # 隔离部署助手不承载业务接口。它是唯一挂载 Docker Socket 和子系统父目录的容器，
  # 仅通过共享 Unix Socket 接收基础平台 API 发出的严格白名单动作。
  subsystem-provisioner:
    <<: *platform-backend-runtime
    environment:
      SUBSYSTEM_PROJECTS_ROOT: ${SUBSYSTEM_HOST_PROJECTS_ROOT}
      SUBSYSTEM_GATEWAY_SCRIPT_PATH: ${BASIC_PLATFORM_HOST_PROJECT_ROOT}/scripts/portal-gateway.sh
      SUBSYSTEM_GATEWAY_INCLUDE_PATH: ${BASIC_PLATFORM_HOST_PROJECT_ROOT}/docker/portal-apps-locations.conf
      SUBSYSTEM_PROVISIONING_SOCKET_PATH: /run/basic-platform-provisioner/provisioner.sock
      SUBSYSTEM_PLATFORM_COMPOSE_PROJECT: basic-platform-local
      SUBSYSTEM_PLATFORM_FRONTEND_SERVICE: frontend
      SUBSYSTEM_PLATFORM_DOCKER_NETWORK: basic-platform-local_default
      SUBSYSTEM_DOCKER_BINARY: docker
      SUBSYSTEM_ONBOARDING_TIMEOUT: 15m
      # 部署助手在子系统容器起来后，自动调 sync-contract-catalog.sh 把子系统
      # 角色/权限目录推给平台；仅对 contract_management 触发。
      SUBSYSTEM_CATALOG_SYNC_ENABLED: ${SUBSYSTEM_CATALOG_SYNC_ENABLED:-true}
      SUBSYSTEM_CATALOG_SYNC_IMAGE: ${SUBSYSTEM_CATALOG_SYNC_IMAGE:-basic-platform/backend:local}
      SUBSYSTEM_CATALOG_SYNC_MYSQL_CONTAINER: ${SUBSYSTEM_CATALOG_SYNC_MYSQL_CONTAINER:-basic-platform-local-mysql-1}
      SUBSYSTEM_CATALOG_SYNC_MYSQL_USER: ${SUBSYSTEM_CATALOG_SYNC_MYSQL_USER:-basic_platform}
      SUBSYSTEM_CATALOG_SYNC_MYSQL_PASSWORD: ${SUBSYSTEM_CATALOG_SYNC_MYSQL_PASSWORD:-${MYSQL_PASSWORD}}
      SUBSYSTEM_CATALOG_SYNC_MYSQL_DATABASE: ${SUBSYSTEM_CATALOG_SYNC_MYSQL_DATABASE:-basic_platform}
      SUBSYSTEM_CATALOG_SYNC_TARGET_APP_CODE: ${SUBSYSTEM_CATALOG_SYNC_TARGET_APP_CODE:-contract_management}
      # The Agent writes this only for a Keycloak-selected subsystem. It keeps
      # the public issuer in OIDC_ISSUER and routes go-oidc's backchannel calls
      # to the private endpoint, so issuer validation remains standards-compliant.
      SUBSYSTEM_KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:18090}
      SUBSYSTEM_KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      SUBSYSTEM_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-basic-platform}
    command: ["./subsystem-provisioner"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SUBSYSTEM_HOST_PROJECTS_ROOT}:${SUBSYSTEM_HOST_PROJECTS_ROOT}
      - subsystem_provisioner_socket:/run/basic-platform-provisioner
    network_mode: none
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/basic-platform-provisioner/provisioner.sock"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  worker:
    profiles: ["split-runtime"]
    <<: *platform-backend-runtime
    env_file: *platform-db-env
    command: ["./worker"]
    volumes:
      - ./data/keys:/app/data/keys:ro
      - ./data/logs:/app/data/logs
      - ./data/uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Settlement keeps an isolated schema and credential pair, while sharing the
  # platform Compose network so the unified frontend resolves settlement-api.
  settlement-mysql:
    image: mysql:8.4
    env_file: *settlement-db-env
    environment:
      MYSQL_DATABASE: settlement
      MYSQL_USER: settlement
      MYSQL_PASSWORD: ${SETTLEMENT_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SETTLEMENT_MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - settlement_mysql_local_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      default:
        aliases: [settlement-mysql]
    restart: unless-stopped

  settlement-migrate:
    <<: *settlement-backend-runtime
    build:
      context: ../Settlement
    env_file: *settlement-db-env
    entrypoint: ["/usr/local/bin/settlement-migrate"]
    depends_on:
      settlement-mysql:
        condition: service_healthy
    restart: "no"

  settlement-api:
    <<: *settlement-backend-runtime
    build:
      context: ../Settlement
    env_file: *settlement-runtime-env
    environment:
      SETTLEMENT_MYSQL_DSN: settlement:${SETTLEMENT_MYSQL_PASSWORD}@tcp(settlement-mysql:3306)/settlement?parseTime=true&charset=utf8mb4&loc=UTC
      SETTLEMENT_HTTP_ADDR: :8085
      SETTLEMENT_PUBLIC_ORIGIN: ${APP_PUBLIC_BASE_URL:-http://localhost:8081}
      PLATFORM_BASE_URL: http://platform-api:8080
    depends_on:
      settlement-mysql:
        condition: service_healthy
      settlement-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    expose: ["8085"]
    labels:
      com.basic-platform.discovery: "v1"
      com.basic-platform.application_code: settlement
      com.basic-platform.application_name: 结算与开票管理系统
      com.basic-platform.environment: dev
      com.basic-platform.service_name: settlement-api
      com.basic-platform.service_role: business
      com.basic-platform.internal_host: settlement-api
      com.basic-platform.internal_port: "8085"
      com.basic-platform.protocol: http
      com.basic-platform.health_endpoint: /healthz
      com.basic-platform.path_prefix: /settlement
      com.basic-platform.oidc_callback_path: /settlement/auth/callback
      com.basic-platform.oidc_callback_supported: "true"
      com.basic-platform.version: ${APP_VERSION:-local}
    networks:
      default:
        aliases: [settlement-api]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  settlement-worker:
    <<: *settlement-backend-runtime
    env_file: *settlement-runtime-env
    entrypoint: ["/usr/local/bin/settlement-worker"]
    environment:
      SETTLEMENT_MYSQL_DSN: settlement:${SETTLEMENT_MYSQL_PASSWORD}@tcp(settlement-mysql:3306)/settlement?parseTime=true&charset=utf8mb4&loc=UTC
      PLATFORM_BASE_URL: http://platform-api:8080
      PLATFORM_ENVIRONMENT_CODE: dev
    depends_on:
      settlement-mysql:
        condition: service_healthy
      settlement-migrate:
        condition: service_completed_successfully
      settlement-api:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      default:
        aliases: [settlement-worker]
    restart: unless-stopped

  contract-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: contract_management
      MYSQL_USER: contract
      MYSQL_PASSWORD: ${CONTRACT_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CONTRACT_MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - contract_mysql_local_data:/var/lib/mysql
      - ../contract_management/docker/mysql-init/000_databases.sql:/docker-entrypoint-initdb.d/000_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      default:
        aliases:
          - contract-mysql
    restart: unless-stopped

  # 使用合同后端内置迁移器按版本执行完整迁移，禁止绕过 con_schema_migration
  # 手工挑选 SQL，以免新增迁移在已有数据卷中漏执行。
  contract-migrate:
    <<: *contract-backend-runtime
    env_file: *contract-db-env
    environment:
      MYSQL_DSN: contract:${CONTRACT_MYSQL_PASSWORD}@tcp(contract-mysql:3306)/contract_management?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
    depends_on:
      contract-mysql:
        condition: service_healthy
    command: ["./migrate"]
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      contract-mysql:
        condition: service_healthy
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_SEEDS: contract-mysql
      MYSQL_USER: contract
      MYSQL_PWD: ${CONTRACT_MYSQL_PASSWORD}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # 合同管理后端容器：API 与 Temporal Worker 运行在同一容器中。
  contract-api:
    <<: *contract-backend-runtime
    build:
      context: ../contract_management
    env_file: *contract-runtime-env
    environment:
      HTTP_ADDRESS: :8081
      MYSQL_DSN: contract:${CONTRACT_MYSQL_PASSWORD}@tcp(contract-mysql:3306)/contract_management?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
      PLATFORM_BASE_URL: http://platform-api:8080
      CRM_API_BASE_URL: http://customer-api:8090
      PLATFORM_AUTHORIZATION_CONTEXT_URL: http://platform-api:8080/oauth2/authorization-context
      TEMPORAL_ADDRESS: temporal:7233
      CONTRACT_RUN_WORKER_WITH_API: "true"
      GIN_MODE: release
      CONTRACT_MACHINE_TOKEN_ISSUER: basic-platform
      CONTRACT_MACHINE_TOKEN_AUDIENCE: basic-platform-application
      DASHBOARD_MACHINE_ENABLED: "true"
      DASHBOARD_MACHINE_REQUIRE_BEARER: "true"
      DASHBOARD_MACHINE_CLIENT_ID: data_analysis-dev-machine
      DASHBOARD_MACHINE_AUDIENCE: basic-platform-application
      CONTRACT_MACHINE_TOKEN_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
    volumes:
      - ./data/keys:/app/data/keys:ro
    depends_on:
      contract-mysql:
        condition: service_healthy
      contract-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      api:
        condition: service_healthy
    expose:
      - "8081"
    labels:
      com.basic-platform.discovery: "v1"
      com.basic-platform.application_code: contract_management
      com.basic-platform.application_name: 合同管理系统
      com.basic-platform.environment: dev
      com.basic-platform.service_name: contract-api
      com.basic-platform.service_role: business
      com.basic-platform.internal_host: contract-api
      com.basic-platform.internal_port: "8081"
      com.basic-platform.protocol: http
      com.basic-platform.health_endpoint: /healthz
      com.basic-platform.path_prefix: /contract_management
      com.basic-platform.oidc_callback_path: /contract_management/auth/callback
      com.basic-platform.oidc_callback_supported: "true"
      com.basic-platform.version: ${APP_VERSION:-local}
    networks:
      default:
        aliases:
          - contract-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  project-mysql:
    image: mysql:8.4
    profiles: ["project"]
    environment:
      MYSQL_DATABASE: project_management
      MYSQL_USER: project
      MYSQL_PASSWORD: ${PROJECT_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PROJECT_MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - project_mysql_local_data:/var/lib/mysql
      - ../project_management/docker/mysql-init/000_databases.sql:/docker-entrypoint-initdb.d/000_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" -Nse 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      default:
        aliases:
          - project-mysql
    restart: unless-stopped

  # 使用项目后端内置迁移器按版本执行完整迁移，禁止绕过 schema 迁移表手工挑选 SQL。
  project-migrate:
    <<: *project-backend-runtime
    profiles: ["project"]
    env_file: *project-db-env
    environment:
      MYSQL_DSN: project:${PROJECT_MYSQL_PASSWORD}@tcp(project-mysql:3306)/project_management?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
    entrypoint: ["/usr/local/bin/project-migrate"]
    depends_on:
      project-mysql:
        condition: service_healthy
    restart: "no"

  # 项目管理系统后端容器：API 与 Temporal Worker 运行在同一容器中。
  project-api:
    <<: *project-backend-runtime
    profiles: ["project"]
    build:
      context: ../project_management
    env_file: *project-runtime-env
    environment:
      PM_HTTP_ADDR: :8082
      MYSQL_DSN: project:${PROJECT_MYSQL_PASSWORD}@tcp(project-mysql:3306)/project_management?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
      PLATFORM_BASE_URL: http://platform-api:8080
      PLATFORM_AUTHORIZATION_CONTEXT_URL: http://platform-api:8080/oauth2/authorization-context
      DASHBOARD_MACHINE_ENABLED: "true"
      DASHBOARD_MACHINE_REQUIRE_BEARER: "true"
      DASHBOARD_MACHINE_CLIENT_ID: data_analysis-dev-machine
      DASHBOARD_MACHINE_AUDIENCE: basic-platform-application
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: project-management
      PROJECT_RUN_WORKER_WITH_API: "true"
      GIN_MODE: release
    depends_on:
      project-mysql:
        condition: service_healthy
      project-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      api:
        condition: service_healthy
    expose:
      - "8082"
    labels:
      com.basic-platform.discovery: "v1"
      com.basic-platform.application_code: project_management
      com.basic-platform.application_name: 项目服务内容管理系统
      com.basic-platform.environment: dev
      com.basic-platform.service_name: project-api
      com.basic-platform.service_role: business
      com.basic-platform.internal_host: project-api
      com.basic-platform.internal_port: "8082"
      com.basic-platform.protocol: http
      com.basic-platform.health_endpoint: /healthz
      com.basic-platform.path_prefix: /project_management
      com.basic-platform.oidc_callback_path: /project_management/auth/callback
      com.basic-platform.oidc_callback_supported: "true"
      com.basic-platform.version: ${APP_VERSION:-local}
    networks:
      default:
        aliases:
          - project-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  # 数据看板与统计分析：独立仓库、独立镜像。dashboard-api（嵌入桥+业务 API）+
  # 聚合库 dashboard-mysql + Metabase（内网第三方，仅经 dashboard-api 代理访问）+ 两个 Worker。
  # 未完成 data_analysis/dev 应用接入前不纳入默认启动（data-analysis profile 控制）。
  dashboard-mysql:
    image: mysql:8.4
    profiles: ["data-analysis"]
    environment:
      MYSQL_DATABASE: dashboard_aggregation
      MYSQL_USER: dashboard
      MYSQL_PASSWORD: ${DASHBOARD_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DASHBOARD_MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dashboard_mysql_local_data:/var/lib/mysql
      - ../data_analysis/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" -Nse 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30

  dashboard-migrate:
    build:
      context: ../data_analysis
      target: local-migrate
    profiles: ["data-analysis"]
    env_file: *data-analysis-runtime-env
    environment:
      DASHBOARD_MYSQL_DSN: dashboard:${DASHBOARD_MYSQL_PASSWORD}@tcp(dashboard-mysql:3306)/dashboard_aggregation?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
    depends_on:
      dashboard-mysql:
        condition: service_healthy
    restart: "no"

  dashboard-api:
    build:
      context: ../data_analysis
      target: dashboard-api
    profiles: ["data-analysis"]
    env_file: *data-analysis-runtime-env
    environment:
      LISTEN_ADDR: :8080
      DASHBOARD_MYSQL_DSN: dashboard:${DASHBOARD_MYSQL_PASSWORD}@tcp(dashboard-mysql:3306)/dashboard_aggregation?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
      PLATFORM_BASE_URL: http://platform-api:8080
      APP_PUBLIC_ORIGIN: http://localhost:8081
      OIDC_ISSUER: http://localhost:18090/realms/basic-platform
      OIDC_BACKCHANNEL_BASE_URL: http://keycloak:8080
      OIDC_REDIRECT_URI: http://localhost:8081/data_analysis/auth/callback
      METABASE_INTERNAL_URL: http://metabase:3000
      # Metabase 容器以根路径提供页面；代理只在浏览器侧挂载 /data_analysis 前缀。
      METABASE_BASE_PATH: ${METABASE_BASE_PATH:-/}
      METABASE_EMBEDDING_SECRET: ${METABASE_EMBEDDING_SECRET}
      MB_DASHBOARD_ID_OVERVIEW: ${MB_DASHBOARD_ID_OVERVIEW:-2}
      MB_DASHBOARD_ID_CONTRACT: ${MB_DASHBOARD_ID_CONTRACT:-2}
      MB_DASHBOARD_ID_PROJECT: ${MB_DASHBOARD_ID_PROJECT:-3}
      APP_PATH_PREFIX: /data_analysis
      COOKIE_SECURE: "false"
    depends_on:
      dashboard-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    expose:
      - "8080"
    labels:
      com.basic-platform.discovery: "v1"
      com.basic-platform.application_code: data_analysis
      com.basic-platform.application_name: 数据看板与统计分析
      com.basic-platform.environment: dev
      com.basic-platform.service_name: dashboard-api
      com.basic-platform.service_role: business
      com.basic-platform.internal_host: dashboard-api
      com.basic-platform.internal_port: "8080"
      com.basic-platform.protocol: http
      com.basic-platform.health_endpoint: /data_analysis/healthz
      com.basic-platform.path_prefix: /data_analysis
      com.basic-platform.oidc_callback_path: /data_analysis/auth/callback
      com.basic-platform.oidc_callback_supported: "true"
      com.basic-platform.version: ${APP_VERSION:-local}
    networks:
      default:
        aliases:
          - dashboard-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/data_analysis/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  aggregation-worker:
    build:
      context: ../data_analysis
      target: aggregation-worker
    profiles: ["data-analysis"]
    env_file: *data-analysis-runtime-env
    environment:
      DASHBOARD_MYSQL_DSN: dashboard:${DASHBOARD_MYSQL_PASSWORD}@tcp(dashboard-mysql:3306)/dashboard_aggregation?parseTime=true&charset=utf8mb4
      AGGREGATION_ONCE: "false"
      MACHINE_TOKEN_URL: http://keycloak:8080/realms/basic-platform/protocol/openid-connect/token
      MACHINE_CLIENT_ID: ${MACHINE_CLIENT_ID}
      MACHINE_CLIENT_SECRET: ${MACHINE_CLIENT_SECRET}
      CONTRACT_INTERNAL_URL: http://contract-api:8081/internal/v1/dashboard
      PROJECT_INTERNAL_URL: http://project-api:8082/internal/v1/dashboard
      OIDC_TENANT_ID: ${OIDC_TENANT_ID}
    depends_on:
      dashboard-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  alert-worker:
    build:
      context: ../data_analysis
      target: alert-worker
    profiles: ["data-analysis"]
    env_file: *data-analysis-runtime-env
    environment:
      DASHBOARD_MYSQL_DSN: dashboard:${DASHBOARD_MYSQL_PASSWORD}@tcp(dashboard-mysql:3306)/dashboard_aggregation?parseTime=true&charset=utf8mb4
    depends_on:
      dashboard-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.53.7
    profiles: ["data-analysis"]
    environment:
      MB_DB_TYPE: mysql
      MB_DB_DBNAME: dashboard_metabase
      MB_DB_HOST: dashboard-mysql
      MB_DB_PORT: "3306"
      MB_DB_USER: dashboard
      MB_DB_PASS: ${DASHBOARD_MYSQL_PASSWORD}
      MB_JAVA_TIMEZONE: Asia/Shanghai
      MB_ENABLE_ASYNC_QUERY_EXECUTION: "false"
      # 由本地环境文件配置；嵌入代理以根路径提供 Metabase 页面。
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:8081/data_analysis}
    depends_on:
      dashboard-mysql:
        condition: service_healthy
    ports:
      - "3000:3000"  # PoC 临时：Metabase 管理界面（启用 dashboard 嵌入后移除）
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  customer-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: customer_opportunity
      MYSQL_USER: customer
      MYSQL_PASSWORD: ${CUSTOMER_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CUSTOMER_MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - customer_mysql_local_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # 客户与商机管理本地迁移严格使用 CRM 清单，不会把客户 Portal 的 SQL
  # 混入同一个 schema；生产仍使用发布平台的语句级迁移控制。
  customer-migrate:
    <<: *customer-backend-runtime
    env_file: *customer-db-env
    environment:
      MYSQL_DSN: customer:${CUSTOMER_MYSQL_PASSWORD}@tcp(customer-mysql:3306)/customer_opportunity?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    depends_on:
      customer-mysql:
        condition: service_healthy
    command: ["./local-migrate", "--schema", "crm"]
    restart: "no"

  # 客户与商机管理后端为独立业务容器，不与基础平台或合同后端共享进程。
  customer-api:
    <<: *customer-backend-runtime
    build:
      context: ../customer_and_opportunity
      target: crm-runtime
    env_file: *customer-runtime-env
    environment:
      HTTP_ADDRESS: :8090
      MYSQL_DSN: customer:${CUSTOMER_MYSQL_PASSWORD}@tcp(customer-mysql:3306)/customer_opportunity?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      PLATFORM_BASE_URL: http://platform-api:8080
      PLATFORM_AUTHORIZATION_CONTEXT_URL: http://platform-api:8080/oauth2/authorization-context
      # refresh-customer-api 从本次构建镜像自动读取并注入，避免角色目录哈希过期。
      MACHINE_TOKEN_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
      ATTACHMENT_LOCAL_ENABLED: "true"
      ATTACHMENT_LOCAL_ROOT: /app/data/attachments
      GIN_MODE: release
    volumes:
      - ./data/keys:/app/data/keys:ro
      - customer_attachment_local_data:/app/data/attachments
    depends_on:
      customer-mysql:
        condition: service_healthy
      customer-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      api:
        condition: service_healthy
    expose:
      - "8090"
    # npm run dev 在宿主机上运行时不能访问 Compose 内网的 customer-api；
    # 发布一个仅本机可访问的端口，供 Vite 代理使用。统一 frontend 容器仍
    # 通过 Docker 服务名访问，不改变 8081 生产式本地入口。
    ports:
      - "127.0.0.1:${CUSTOMER_HTTP_PORT:-18083}:8090"
    labels:
      com.basic-platform.discovery: "v1"
      com.basic-platform.application_code: customer_and_opportunity
      com.basic-platform.application_name: 客户与商机管理系统
      com.basic-platform.environment: dev
      com.basic-platform.service_name: customer-api
      com.basic-platform.service_role: business
      com.basic-platform.internal_host: customer-api
      com.basic-platform.internal_port: "8090"
      com.basic-platform.protocol: http
      com.basic-platform.health_endpoint: /customer-opportunity/healthz
      com.basic-platform.path_prefix: /customer-opportunity
      com.basic-platform.oidc_callback_path: /customer-opportunity/auth/callback
      com.basic-platform.oidc_callback_supported: "true"
      com.basic-platform.version: ${APP_VERSION:-local}
    networks:
      default:
        aliases:
          - customer-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/customer-opportunity/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  # 售前预警扫描 Worker 与 CRM API 使用同一数据库和运行时目录；它按启用的
  # crm_presale_alert_rules 扫描超时状态，并把结果投递到个人预警列表。
  customer-presale-alert-worker:
    image: customer-opportunity/presale-alert-worker:local
    build:
      context: ../customer_and_opportunity
      target: presale-alert-worker-runtime
    env_file: *customer-runtime-env
    environment:
      MYSQL_DSN: customer:${CUSTOMER_MYSQL_PASSWORD}@tcp(customer-mysql:3306)/customer_opportunity?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      PRESALE_ALERT_WORKER_ID: crm-presale-alert-worker-local-1
      PRESALE_ALERT_POLL_INTERVAL: ${PRESALE_ALERT_POLL_INTERVAL:-10m}
      PRESALE_ALERT_LEASE_DURATION: ${PRESALE_ALERT_LEASE_DURATION:-1m}
      PRESALE_ALERT_BATCH_SIZE: ${PRESALE_ALERT_BATCH_SIZE:-200}
      MACHINE_TOKEN_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
    volumes:
      - ./data/keys:/app/data/keys:ro
    depends_on:
      customer-mysql:
        condition: service_healthy
      customer-migrate:
        condition: service_completed_successfully
    profiles: ["customer"]
    restart: unless-stopped

  # CRM 站内通知生成链路。各 Worker 复用 customer-api 构建出的 crm-runtime
  # 镜像和同一份 dev 运行时配置，不在 Compose 中复制或硬编码任何机器密钥。
  customer-opportunity-alert-worker:
    <<: *customer-backend-runtime
    env_file: *customer-runtime-env
    environment:
      MYSQL_DSN: customer:${CUSTOMER_MYSQL_PASSWORD}@tcp(customer-mysql:3306)/customer_opportunity?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    command: ["./opportunity-alert-worker"]
    depends_on:
      customer-mysql:
        condition: service_healthy
      customer-migrate:
        condition: service_completed_successfully
    profiles: ["customer"]
    restart: unless-stopped

  customer-owner-notification-worker:
    <<: *customer-backend-runtime
    env_file: *customer-runtime-env
    environment:
      MYSQL_DSN: customer:${CUSTOMER_MYSQL_PASSWORD}@tcp(customer-mysql:3306)/customer_opportunity?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      OWNER_NOTIFICATION_WORKER_ID: crm-owner-notification-local-1
    command: ["./opportunity-owner-notification-worker"]
    depends_on:
      customer-mysql:
        condition: service_healthy
      customer-migrate:
        condition: service_completed_successfully
    profiles: ["customer"]
    restart: unless-stopped

  customer-presale-assignment-notification-worker:
    <<: *customer-backend-runtime
    env_file: *customer-runtime-env
    environment:
      MYSQL_DSN: customer:${CUSTOMER_MYSQL_PASSWORD}@tcp(customer-mysql:3306)/customer_opportunity?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      PRESALE_ASSIGNMENT_NOTIFICATION_WORKER_ID: crm-presale-assignment-notification-local-1
    command: ["./presale-assignment-notification-worker"]
    depends_on:
      customer-mysql:
        condition: service_healthy
      customer-migrate:
        condition: service_completed_successfully
    profiles: ["customer"]
    restart: unless-stopped

  customer-presale-progress-notification-worker:
    <<: *customer-backend-runtime
    env_file: *customer-runtime-env
    environment:
      MYSQL_DSN: customer:${CUSTOMER_MYSQL_PASSWORD}@tcp(customer-mysql:3306)/customer_opportunity?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      PRESALE_PROGRESS_NOTIFICATION_WORKER_ID: crm-presale-progress-notification-local-1
    command: ["./presale-progress-notification-worker"]
    depends_on:
      customer-mysql:
        condition: service_healthy
      customer-migrate:
        condition: service_completed_successfully
    profiles: ["customer"]
    restart: unless-stopped

  # 把 crm_notifications 投递到基础平台通知中心。notification.ingest 的 Client
  # ID/Secret 只从 docker/.env.customer.local 注入，由 dev 接入流程生成。
  customer-notification-delivery-worker:
    <<: *customer-backend-runtime
    env_file: *customer-runtime-env
    environment:
      MYSQL_DSN: customer:${CUSTOMER_MYSQL_PASSWORD}@tcp(customer-mysql:3306)/customer_opportunity?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      PLATFORM_BASE_URL: http://platform-api:8080
      NOTIFICATION_DELIVERY_WORKER_ID: crm-notification-delivery-local-1
    command: ["./notification-delivery-worker"]
    depends_on:
      customer-mysql:
        condition: service_healthy
      customer-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    profiles: ["customer"]
    restart: unless-stopped

  # 商机签约事件到合同系统受理箱的常驻投递进程，复用 CRM 后端镜像中的 worker。
  contract-transfer-worker:
    <<: *customer-backend-runtime
    env_file: *customer-runtime-env
    environment:
      MYSQL_DSN: customer:${CUSTOMER_MYSQL_PASSWORD}@tcp(customer-mysql:3306)/customer_opportunity?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    command: ["./contract-transfer-worker"]
    depends_on:
      customer-mysql:
        condition: service_healthy
      customer-migrate:
        condition: service_completed_successfully
    profiles: ["customer"]
    restart: unless-stopped

  # 售前投递进程独立于 CRM API 部署。审批、统一认证和 PMS 地址只从指定的
  # Worker 环境文件注入，可以按环境指向本地 HTTPS 服务或远端服务器；Compose
  # 不提供任何地址默认值。显式启用 profile 才会启动，缺配置时保持失败关闭。
  presale-worker:
    image: customer-opportunity/presale-worker:local
    build:
      context: ../customer_and_opportunity
      target: presale-worker-runtime
    env_file:
      - path: ${PRESALE_WORKER_ENV_FILE:-../customer_and_opportunity/.env.presale-worker}
        required: false
    environment:
      MYSQL_DSN: customer:${CUSTOMER_MYSQL_PASSWORD}@tcp(customer-mysql:3306)/customer_opportunity?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      PRESALE_TEMPORAL_ENABLED: ${PRESALE_TEMPORAL_ENABLED:-true}
      PRESALE_TEMPORAL_INTERNAL_MODE: ${PRESALE_TEMPORAL_INTERNAL_MODE:-true}
      TEMPORAL_ADDRESS: ${CUSTOMER_TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${CUSTOMER_TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${CUSTOMER_TEMPORAL_TASK_QUEUE:-customer-opportunity-presale}
      TEMPORAL_TLS: ${CUSTOMER_TEMPORAL_TLS:-false}
    depends_on:
      customer-mysql:
        condition: service_healthy
      customer-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    profiles: ["presale-worker"]
    restart: unless-stopped

  # 本地售前联调桩：提供 OAuth Token、审批开始/动作和 PMS 工时接口。
  # 仅用于开发联调，正式环境必须使用真实审批/PMS 服务并保持 HTTPS。
  presale-integration-mock:
    image: customer-opportunity/presale-integration-mock:local
    build:
      context: ../customer_and_opportunity
      target: presale-integration-mock-runtime
    ports:
      - "127.0.0.1:${PRESALE_MOCK_PORT:-18099}:8092"
    profiles: ["presale-worker"]
    restart: unless-stopped

  # 客户自助门户使用独立数据库，避免外部客户会话、身份映射和备案材料与 CRM
  # 员工域混库。门户与 CRM 从同一源码仓库构建，但使用不同 target、不同镜像和不同容器。
  portal-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: customer_portal
      MYSQL_USER: portal
      MYSQL_PASSWORD: ${PORTAL_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PORTAL_MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - portal_mysql_local_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  portal-migrate:
    <<: *portal-backend-runtime
    env_file: *portal-runtime-env
    environment:
      PORTAL_MYSQL_DSN: portal:${PORTAL_MYSQL_PASSWORD}@tcp(portal-mysql:3306)/customer_portal?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    depends_on:
      portal-mysql:
        condition: service_healthy
    command: ["./local-migrate", "--schema", "portal"]
    profiles: ["portal"]
    restart: "no"

  portal-api:
    <<: *portal-backend-runtime
    build:
      context: ../customer_and_opportunity
      target: portal-runtime
    env_file: *portal-runtime-env
    environment:
      PORTAL_HTTP_ADDRESS: :8091
      PORTAL_MYSQL_DSN: portal:${PORTAL_MYSQL_PASSWORD}@tcp(portal-mysql:3306)/customer_portal?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      PORTAL_PLATFORM_BASE_URL: http://platform-api:8080
      PORTAL_AUTHORIZATION_CONTEXT_URL: http://platform-api:8080/oauth2/authorization-context
      PORTAL_MACHINE_TOKEN_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
      GIN_MODE: release
    command: ["./portal-server"]
    volumes:
      - ./data/keys:/app/data/keys:ro
    depends_on:
      portal-mysql:
        condition: service_healthy
      portal-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      customer-api:
        condition: service_healthy
    expose:
      - "8091"
    labels:
      com.basic-platform.discovery: "v1"
      com.basic-platform.application_code: customer_portal
      com.basic-platform.application_name: 客户自助门户
      com.basic-platform.environment: dev
      com.basic-platform.service_name: portal-api
      com.basic-platform.service_role: business
      com.basic-platform.internal_host: portal-api
      com.basic-platform.internal_port: "8091"
      com.basic-platform.protocol: http
      com.basic-platform.health_endpoint: /customer-portal/healthz
      com.basic-platform.path_prefix: /customer-portal
      com.basic-platform.oidc_callback_path: /customer-portal/auth/callback
      com.basic-platform.oidc_callback_supported: "true"
      com.basic-platform.version: ${APP_VERSION:-local}
    networks:
      default:
        aliases:
          - portal-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8091/customer-portal/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    profiles: ["portal"]
    restart: unless-stopped

  # Portal 邀请 Saga 的常驻补偿进程。只复用 CRM 运行镜像与 customer runtime，
  # 不在平台仓库复制 Portal 业务逻辑；接入流程写入的最小机器凭据通过变量映射交付。
  portal-invite-compensation-worker:
    <<: *customer-backend-runtime
    env_file: *customer-runtime-env
    environment:
      PORTAL_INVITE_COMPENSATION_MYSQL_DSN: customer:${CUSTOMER_MYSQL_PASSWORD}@tcp(customer-mysql:3306)/customer_opportunity?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      PORTAL_INVITE_COMPENSATION_PORTAL_PROVISION_URL: http://portal-api:8091/customer-portal/internal/accounts/provision
      PORTAL_INVITE_COMPENSATION_PORTAL_TOKEN_URL: http://api:8080/oauth2/token
      PORTAL_INVITE_COMPENSATION_PORTAL_CLIENT_ID: ${PORTAL_PROVISION_CLIENT_ID:-}
      PORTAL_INVITE_COMPENSATION_PORTAL_CLIENT_SECRET: ${PORTAL_PROVISION_CLIENT_SECRET:-}
      PORTAL_INVITE_COMPENSATION_PORTAL_SCOPE: portal.identity_mapping.provision
      PORTAL_INVITE_COMPENSATION_PLATFORM_ROLE_ASSIGN_URL: http://api:8080/api/v1/internal/application-roles
      PORTAL_INVITE_COMPENSATION_PLATFORM_TOKEN_URL: http://api:8080/oauth2/token
      PORTAL_INVITE_COMPENSATION_PLATFORM_CLIENT_ID: ${PLATFORM_ROLE_ASSIGN_CLIENT_ID:-}
      PORTAL_INVITE_COMPENSATION_PLATFORM_CLIENT_SECRET: ${PLATFORM_ROLE_ASSIGN_CLIENT_SECRET:-}
      PORTAL_INVITE_COMPENSATION_PLATFORM_SCOPE: application_role.assign
      PORTAL_INVITE_COMPENSATION_PLATFORM_APPLICATION_CODE: customer_portal
      # 平台客户绑定补偿（Phase 2 起，可选；与 PORTAL_MAPPING_DUAL_WRITE 同开）
      PORTAL_INVITE_COMPENSATION_BINDING_ENABLED: ${PORTAL_INVITE_COMPENSATION_BINDING_ENABLED:-false}
      PORTAL_INVITE_COMPENSATION_BINDING_BASE_URL: http://api:8080/api/v1/internal/external-users
      PORTAL_INVITE_COMPENSATION_BINDING_TOKEN_URL: http://api:8080/oauth2/token
      PORTAL_INVITE_COMPENSATION_BINDING_CLIENT_ID: ${PORTAL_PROVISION_CLIENT_ID:-}
      PORTAL_INVITE_COMPENSATION_BINDING_CLIENT_SECRET: ${PORTAL_PROVISION_CLIENT_SECRET:-}
      PORTAL_INVITE_COMPENSATION_BINDING_SCOPE: portal_mapping_provision
      PORTAL_INVITE_COMPENSATION_BINDING_APPLICATION_CODE: customer_portal
      PORTAL_INVITE_COMPENSATION_BINDING_DISABLE_CLIENT_ID: ${PORTAL_DISABLE_CLIENT_ID:-}
      PORTAL_INVITE_COMPENSATION_BINDING_DISABLE_CLIENT_SECRET: ${PORTAL_DISABLE_CLIENT_SECRET:-}
      PORTAL_INVITE_COMPENSATION_BINDING_DISABLE_SCOPE: portal_mapping_disable
    command: ["./portal-invite-compensation-worker"]
    depends_on:
      customer-mysql:
        condition: service_healthy
      api:
        condition: service_healthy
      portal-api:
        condition: service_healthy
    profiles: ["portal"]
    restart: unless-stopped

  # 一个前端容器同时承载基础平台、合同管理、客户与商机管理和客户自助门户 Vue 模块，
  # 并统一反向代理四个独立后端进程。
  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_LOGIN_SUCCESS_URL: /
        VITE_CONTRACT_PUBLIC_PATH_PREFIX: /contract_management
        VITE_CONTRACT_API_BASE_URL: /contract_management/api/v1
        VITE_PROJECT_PUBLIC_PATH_PREFIX: /project_management
        VITE_PROJECT_API_BASE_URL: /project_management/api/v1
        VITE_SETTLEMENT_PUBLIC_PATH_PREFIX: /settlement
        VITE_SETTLEMENT_API_BASE_URL: /settlement/api/v1
        VITE_CRM_PUBLIC_PATH_PREFIX: /customer-opportunity
        VITE_CRM_API_BASE_URL: /customer-opportunity/api/v1
        VITE_CUSTOMER_PORTAL_PUBLIC_PATH_PREFIX: /customer-portal
        VITE_CUSTOMER_PORTAL_API_BASE_URL: /customer-portal/api/v1
    image: basic-platform/frontend:local
    volumes:
      - ./docker/portal-apps-locations.conf:/etc/nginx/portal-apps.d/managed.conf:ro
    ports:
      # 默认只监听本机；临时 LAN 模式由 scripts/lan-access.sh 显式开启。
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HTTP_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
      contract-api:
        condition: service_healthy
      settlement-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_local_data:
    name: basic-platform-local-mysql-data
  contract_mysql_local_data:
    name: basic-platform-local-contract-mysql-data
  customer_mysql_local_data:
    name: basic-platform-local-customer-mysql-data
  customer_attachment_local_data:
    name: basic-platform-local-customer-attachment-data
  portal_mysql_local_data:
    name: basic-platform-local-portal-mysql-data
  project_mysql_local_data:
    name: basic-platform-local-project-mysql-data
  settlement_mysql_local_data:
    name: basic-platform-local-settlement-mysql-data
  dashboard_mysql_local_data:
    name: basic-platform-local-dashboard-mysql-data
  keycloak_mysql_local_data:
    name: basic-platform-local-keycloak-mysql-data
  subsystem_provisioner_socket:
    name: basic-platform-local-provisioner-socket
