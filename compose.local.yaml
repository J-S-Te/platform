name: basic-platform-local

# 本地 Docker 编排：只有 frontend 暴露宿主机端口，MySQL/API/Worker 仅在 Compose 内网通信。
x-runtime-env: &runtime-env
  - ${BASIC_PLATFORM_RUNTIME_ENV_FILE:-./docker/.env.local}

x-backend-image: &backend-image
  build:
    context: ./backend
  image: basic-platform/backend:local

x-contract-environment: &contract-environment
  HTTP_ADDRESS: :8081
  MYSQL_DSN: contract:${CONTRACT_MYSQL_PASSWORD}@tcp(contract-mysql:3306)/contract_management?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
  PLATFORM_BASE_URL: http://api:8080
  AUTH_SESSION_COOKIE_NAME: bp_session
  PLATFORM_AUDIT_CLIENT_ID: ${CONTRACT_PLATFORM_AUDIT_CLIENT_ID:-}
  PLATFORM_AUDIT_CLIENT_SECRET: ${CONTRACT_PLATFORM_AUDIT_CLIENT_SECRET:-}
  PLATFORM_APPLICATION_CODE: contract_management
  PLATFORM_ENVIRONMENT_CODE: dev
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: contract-management
  TEMPORAL_TLS: "false"
  APPROVAL_NODE_TIMEOUT: 72h
  APPROVAL_REMINDER_INTERVAL: 24h
  ARCHIVE_CRON_SCHEDULE: "0 16 * * *"
  APPROVER_ROLE_ASSIGNMENTS_JSON: ${CONTRACT_APPROVER_ROLE_ASSIGNMENTS_JSON:-{}}
  GIN_MODE: release

services:
  mysql:
    image: mysql:8.4
    env_file: *runtime-env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_local_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *backend-image
    env_file: *runtime-env
    command: ["./migrate"]
    volumes:
      - ./data/keys:/app/data/keys
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # 该服务不由普通 `up` 自动启动，由 scripts/docker-local.sh 在迁移成功后按需 run。
  # bootstrap-admin 本身会检查数据库状态，已初始化时直接成功退出，因此可重复执行。
  bootstrap-admin:
    <<: *backend-image
    env_file: *runtime-env
    command: ["./bootstrap-admin"]
    volumes:
      - ./data/keys:/app/data/keys
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["bootstrap"]
    restart: "no"

  api:
    <<: *backend-image
    env_file: *runtime-env
    environment:
      BASIC_PLATFORM_RUN_WORKER_WITH_API: "true"
      SUBSYSTEM_ONBOARDING_AUTOMATION_ENABLED: "true"
      SUBSYSTEM_PROJECTS_ROOT: ${SUBSYSTEM_HOST_PROJECTS_ROOT}
      SUBSYSTEM_GATEWAY_SCRIPT_PATH: ${BASIC_PLATFORM_HOST_PROJECT_ROOT}/scripts/portal-gateway.sh
      SUBSYSTEM_GATEWAY_INCLUDE_PATH: ${BASIC_PLATFORM_HOST_PROJECT_ROOT}/docker/portal-apps-locations.conf
      SUBSYSTEM_PROVISIONING_SOCKET_PATH: /run/basic-platform-provisioner/provisioner.sock
      SUBSYSTEM_PLATFORM_COMPOSE_PROJECT: basic-platform-local
      SUBSYSTEM_PLATFORM_FRONTEND_SERVICE: frontend
      SUBSYSTEM_PLATFORM_DOCKER_NETWORK: basic-platform-local_default
      SUBSYSTEM_DOCKER_BINARY: docker
      SUBSYSTEM_ONBOARDING_TIMEOUT: 15m
    command: ["./api"]
    volumes:
      - ./data/keys:/app/data/keys:ro
      - ./data/logs:/app/data/logs
      - ./data/uploads:/app/data/uploads
      # API 仅通过 Unix Socket 向隔离助手提交固定动作，不直接访问 Docker Socket 或宿主机项目目录。
      - subsystem_provisioner_socket:/run/basic-platform-provisioner
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      subsystem-provisioner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      default:
        aliases:
          - platform-api
    restart: unless-stopped

  # 隔离部署助手不暴露网络端口，也不承载业务接口。它是唯一挂载 Docker Socket
  # 和子系统父目录的容器，并通过共享 Unix Socket 接收 API 发出的严格白名单动作。
  subsystem-provisioner:
    <<: *backend-image
    environment:
      SUBSYSTEM_PROJECTS_ROOT: ${SUBSYSTEM_HOST_PROJECTS_ROOT}
      SUBSYSTEM_GATEWAY_SCRIPT_PATH: ${BASIC_PLATFORM_HOST_PROJECT_ROOT}/scripts/portal-gateway.sh
      SUBSYSTEM_GATEWAY_INCLUDE_PATH: ${BASIC_PLATFORM_HOST_PROJECT_ROOT}/docker/portal-apps-locations.conf
      SUBSYSTEM_PROVISIONING_SOCKET_PATH: /run/basic-platform-provisioner/provisioner.sock
      SUBSYSTEM_PLATFORM_COMPOSE_PROJECT: basic-platform-local
      SUBSYSTEM_PLATFORM_FRONTEND_SERVICE: frontend
      SUBSYSTEM_PLATFORM_DOCKER_NETWORK: basic-platform-local_default
      SUBSYSTEM_DOCKER_BINARY: docker
      SUBSYSTEM_ONBOARDING_TIMEOUT: 15m
    command: ["./subsystem-provisioner"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SUBSYSTEM_HOST_PROJECTS_ROOT}:${SUBSYSTEM_HOST_PROJECTS_ROOT}
      - subsystem_provisioner_socket:/run/basic-platform-provisioner
    network_mode: none
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/basic-platform-provisioner/provisioner.sock"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  worker:
    profiles: ["split-runtime"]
    <<: *backend-image
    env_file: *runtime-env
    command: ["./worker"]
    volumes:
      - ./data/keys:/app/data/keys:ro
      - ./data/logs:/app/data/logs
      - ./data/uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  contract-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: contract_management
      MYSQL_USER: contract
      MYSQL_PASSWORD: ${CONTRACT_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CONTRACT_MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - contract_mysql_local_data:/var/lib/mysql
      - ../contract_management/docker/mysql-init/000_databases.sql:/docker-entrypoint-initdb.d/000_databases.sql:ro
      - ../contract_management/migrations/000001_contract_workflow.sql:/docker-entrypoint-initdb.d/010_contract_workflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucontract -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      contract-mysql:
        condition: service_healthy
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_SEEDS: contract-mysql
      MYSQL_USER: contract
      MYSQL_PWD: ${CONTRACT_MYSQL_PASSWORD}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  contract-api:
    build:
      context: ../contract_management
    image: contract-management:local
    environment:
      <<: *contract-environment
      CONTRACT_MYSQL_PASSWORD: ${CONTRACT_MYSQL_PASSWORD}
    depends_on:
      api:
        condition: service_healthy
      contract-mysql:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  contract-worker:
    image: contract-management:local
    command: ["./worker"]
    environment:
      <<: *contract-environment
      CONTRACT_MYSQL_PASSWORD: ${CONTRACT_MYSQL_PASSWORD}
    depends_on:
      api:
        condition: service_healthy
      contract-mysql:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_LOGIN_SUCCESS_URL: /
    image: basic-platform/frontend:local
    volumes:
      - ./docker/portal-apps-locations.conf:/etc/nginx/portal-apps.d/managed.conf:ro
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
      contract-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_local_data:
    name: basic-platform-local-mysql-data
  subsystem_provisioner_socket:
    name: basic-platform-local-provisioner-socket
