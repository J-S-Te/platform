# DO NOT EDIT: managed by scripts/portal-gateway.sh.
# 任何手动修改会在下一次 add/remove/sync 时被覆盖。

# redirect code=contract_management
location = /contract_management {
    return 308 /contract_management/;
}

# code=contract_management
location /contract_management/ {
    proxy_pass http://contract-api:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /contract_management;
}
