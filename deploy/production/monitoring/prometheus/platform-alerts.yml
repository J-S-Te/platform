# 平台自身 /metrics（docker-compose.yml 的 platform-api:8080）告警规则。
#
# 指标名来源（全部来自代码实际输出，不得臆造；改指标名先改代码与本文档）：
#   platform_oauth_backchannel_unregistered_rp
#   platform_oauth_backchannel_logout_no_endpoint
#     → platform/internal/platform/oidc/backchannel/observability.go:16,18
#   platform_http_requests_total{method,route,status} /
#   platform_http_errors_total{method,route,status} /
#   platform_http_request_duration_seconds_bucket{method,route,status,le} /
#   platform_http_request_duration_seconds_sum{method,route,status} /
#   platform_http_request_duration_seconds_count{method,route,status} /
#   platform_authz_failures_total / platform_oidc_login_failures_total
#     → platform/internal/transport/http/metrics.go 的 HTTP 指标常量块与 writeHTTPMetrics
#       （Middleware 逐请求累加，ServeHTTP 每次抓取无条件输出 TYPE 行）。
#       标签口径（C1 起）：requests/errors/duration 三条指标共用同一组标签
#       {method, route, status}：
#         method ∈ GET/POST/PUT/PATCH/DELETE/OPTIONS/HEAD/OTHER（非白名单方法记 OTHER）
#         route  = gin 注册模式（如 /api/v1/users/:id），未匹配路由（404/405）固定
#                  "__unmatched__"；常规序列数超 maxHTTPSeries(1000) 后新组合折叠为
#                  {method="OTHER",route="__overflow__",status="other"} 继续计数。
#         status ∈ 1xx/2xx/3xx/4xx/5xx（畸形状态码兜底 "other"）
#       → 标签值是**分桶枚举字符串**，不是数字：只有 `status="5xx"` 能命中；
#         `status=~"5.."`、`status=~"5.*"`、`status>=500` 这类写法**永远匹配不到**任何
#         序列（正则是对字符串 "5xx" 匹配，比较运算在字符串标签上直接丢弃），规则会
#         静默永不触发。以后写 5xx 相关选择器必须写等值 `status="5xx"`。
#       延迟指标是 histogram：有 *_bucket（桶上界 0.005/0.01/0.025/0.05/0.1/0.25/0.5/1/
#       2.5/5/10 秒 + le="+Inf"，+Inf 恒等于 _count），因此 histogram_quantile 可用。
#       但 p95 告警另立项，本文件目前只有 _sum/_count 比值的**平均值**规则。
#       另注意：带标签后进程刚启动、还没有任何请求时，这三条指标**没有样本**（只有 TYPE
#       行）——"没有流量"不是故障，所以"抓取成功但内容为空"的 absent() 兜底必须用
#       platform_metric_collection_errors_total（每次抓取都无条件输出）。
#   platform_database_open_connections / platform_database_in_use_connections /
#   platform_database_wait_count_total
#     → platform/internal/transport/http/metrics.go:438-440（gorm/sql.DB.Stats()）。
#       连接池上限 50 见 platform/internal/shared/database/mysql.go:21
#       的 OpenMySQLWithPool(cfg, 50, 20, 15m, 2m)。
#   platform_metric_collection_errors_total
#     → platform/internal/transport/http/metrics.go:422（每次抓取无条件输出，采集失败计数）
#   platform_keycloak_outbox_backlog / platform_keycloak_outbox_dead /
#   platform_async_job_backlog / platform_async_job_dead /
#   platform_oidc_backchannel_logout_backlog / platform_oidc_backchannel_logout_failed
#     → platform/internal/transport/http/metrics.go:364-370
#   platform_async_job_last_success_timestamp_seconds
#     → platform/internal/transport/http/metrics.go:455
#   platform_oauth_client_secret_active{status} /
#   platform_oauth_client_secret_active_client{client_id} /
#   platform_oauth_client_secret_active_clients /
#   platform_oauth_client_secret_oldest_active_seconds /
#   platform_oauth_client_secret_active_over_90d
#     → platform/internal/transport/http/metrics.go 的 Secret 指标常量块（RUNTIME-05）
#   up
#     → Prometheus 自身抓取健康度（up{job="platform-api"}）
#
# 采集语义（BIZ-XEVT2-07）：back-channel 的两条 gauge 在采集失败时**不输出**，
# 而不是输出 0——所以“没有告警”也可能是没有样本，必须有 absent() 兜底规则
# （见下方 PlatformMetricsSamplesMissing），否则缺口会被当成一切正常。
# OAuth Client Secret gauge 同语义：采集失败时整组跳过（只有 collection_errors 增长），
# 因此 platform-oauth-secrets 组额外用 absent() 兜底，避免“查不到”被当成“密钥很新”。
# 所有 summary/runbook 指向 platform/deploy/production/README.md 的观测接入章节。
groups:
  - name: platform-scrape
    rules:
      # 抓取层面的硬失败：连接失败、超时、容器未运行。401/403 不在这里（up 仍为 1），
      # 由下一条 absent() 与 backchannel 缺口规则暴露。
      - alert: PlatformMetricsScrapeDown
        expr: up{job="platform-api"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Platform /metrics scrape target is down
          description: >-
            Prometheus 连续 5 分钟无法抓取 platform-api:8080/metrics。抓取失败的期间所有
            backchannel/队列 gauge 都无样本，监控盲区等同于没有告警。
          runbook: platform/deploy/production/README.md#监控抓取与指标端点边界

      # up 为 1 但没有任何平台指标样本：token 不匹配（RequireMetricsAccess 返回 401）、
      # 路由缺失或被反代拦截。这条规则是“抓取成功但内容为空”的唯一信号。
      #
      # 探测指标必须选**每次抓取都无条件输出**的那一条：platform_metric_collection_errors_total
      # 在 ServeHTTP 末尾无条件输出（采集失败也照常打印计数）。不能再用
      # platform_http_requests_total 探测——C1 起它带 {method,route,status} 标签，
      # 进程刚启动、还没有任何请求时本来就没有样本，用它会让 absent() 在健康进程上误报。
      - alert: PlatformMetricsSamplesMissing
        expr: absent(platform_metric_collection_errors_total{job="platform-api"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Platform /metrics is reachable but exposes no samples
          description: >-
            platform_metric_collection_errors_total 在每次抓取时无条件输出，样本缺失说明抓取被
            RequireMetricsAccess 拒绝（METRICS_ACCESS_TOKEN 与
            runtime/prometheus-secrets/platform-metrics-token 不一致）或 /metrics 路由失效。
            注意 HTTP 请求面指标（platform_http_*）带 method/route/status 标签，空闲进程没有
            样本是正常的，不能用它们判断抓取是否可用。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      # 采集失败只在写库/查询出错时累加；对应 gauge 会被跳过（不以 0 冒充“没有缺口”）。
      - alert: PlatformMetricCollectionErrors
        expr: increase(platform_metric_collection_errors_total[10m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Platform metric collection is failing repeatedly
          description: >-
            队列/backchannel 采集在最近 10 分钟内持续失败，对应 gauge 已被跳过输出。
            先查数据库可用性与 platform_metric_collection_errors_total 的增长速率。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

  - name: platform-backchannel
    rules:
      # 未登记 RP：存在 ACTIVE token family 但没有 logout_uri 登记。这类 RP 的登出通知
      # 根本无法送达（fail-closed 于监控面），>0 持续 15 分钟即需要登记修复。
      - alert: PlatformBackchannelUnregisteredRP
        expr: platform_oauth_backchannel_unregistered_rp > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: OAuth clients hold active sessions without a back-channel logout URI
          description: >-
            platform_oauth_backchannel_unregistered_rp > 0 表示有 RP 存在活跃登录状态但没有
            logout_uri 登记，登出通知无法投递。按只读清单确认客户端后走受控更新补登记，
            不要直接改库。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      # NO_ENDPOINT 积压：已生成但目的地缺登记端点、不可投递的 outbox 行。它不是“投递失败”，
      # 而是“目的地不存在”；warning 表示新缺口正在产生，需要补登记。
      - alert: PlatformBackchannelNoEndpointBacklog
        expr: platform_oauth_backchannel_logout_no_endpoint > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Back-channel logout events are piling up without a deliverable endpoint
          description: >-
            platform_oauth_backchannel_logout_no_endpoint 是 status=NO_ENDPOINT 的 outbox 行数：
            事件已生成，但目标 RP 没有登记 logout_uri，因此永远不可投递。warning 级语义是
            “缺口已持续一个投放周期且未清零”，处理方式是补登记后受控幂等重放，而不是删除行。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      # 同一缺口持续 6 小时：登记修复没有完成，用户侧仍保留失效会话。升级为 critical，
      # 与 30 分钟 warning 的差别是“需要跨团队升级”，不是“另一个指标”。
      - alert: PlatformBackchannelNoEndpointBacklogPersistent
        expr: platform_oauth_backchannel_logout_no_endpoint > 0
        for: 6h
        labels:
          severity: critical
        annotations:
          summary: Back-channel logout endpoint gap has persisted for six hours
          description: >-
            NO_ENDPOINT 积压 6 小时未清零：要么登记修复未完成，要么重放未执行。此时 RP 侧
            仍持有已登出会话，属于安全缺口，需要升级与书面记录。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      # 投递失败（status=FAILED）：端点存在但投递失败，与 NO_ENDPOINT 语义不同。
      - alert: PlatformBackchannelLogoutDeliveryFailed
        expr: platform_oidc_backchannel_logout_failed > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Back-channel logout deliveries are failing
          description: >-
            platform_oidc_backchannel_logout_failed 是 status=FAILED 的投递行；端点已登记但
            RP 返回失败。检查 RP 可达性、超时与重试窗口，不要用删除行规避。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

  - name: platform-queues
    rules:
      - alert: PlatformKeycloakOutboxBacklog
        expr: platform_keycloak_outbox_backlog > 200
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Keycloak authorization outbox backlog is above the expected ceiling
          description: >-
            platform_keycloak_outbox_backlog 统计 PENDING/PROCESSING/RETRY 行数；持续 30 分钟
            过高说明 Keycloak 投影消费者落后，用户与角色变更不会及时生效。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      - alert: PlatformKeycloakOutboxDead
        expr: platform_keycloak_outbox_dead > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Keycloak authorization outbox has dead letters
          description: >-
            platform_keycloak_outbox_dead 统计 FAILED/DEAD 行；>0 表示重试已耗尽，需要人工
            核对原因后受控重放。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      - alert: PlatformAsyncJobDead
        expr: platform_async_job_dead > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Platform async jobs have dead letters
          description: >-
            platform_async_job_dead 统计 FAILED/DEAD 的异步任务；>0 表示任务已停止自动重试。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      # 最后成功时间戳为 0 表示“从未成功过”，此时不应按“停滞”告警（会与 dead 规则重复，
      # 且新环境必然命中），因此显式排除 0。
      - alert: PlatformAsyncJobStalled
        expr: >-
          time() - platform_async_job_last_success_timestamp_seconds > 7200
          and platform_async_job_last_success_timestamp_seconds > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Platform async jobs have not succeeded for two hours
          description: >-
            platform_async_job_last_success_timestamp_seconds 已超过 2 小时没有前进；消费者可能
            空转或全部失败。该指标在采集失败时不输出，先确认 up 与
            platform_metric_collection_errors_total。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

  # OAuth Client Secret 退役面（RUNTIME-05）。默认 keep 时旧 Secret 永久有效：
  # 受控更新/许可登记每签发一次新值就多一行 ACTIVE，泄露的旧值仍能换令牌。
  # 这组规则把“累积了多个 ACTIVE”“龄期超过 90 天”“gauge 采集失败”变成可发现的信号。
  - name: platform-oauth-secrets
    rules:
      # 单客户端 ACTIVE Secret > 1。两个来源都合法，必须区分后再处理：
      #   1) GRACE/轮换重叠窗口内（AUTH_OAUTH_CLIENT_SECRET_PREVIOUS_RETIREMENT=grace，
      #      或 credentials/rotate 的 overlap_seconds>0）：旧值被收紧有效期但仍为 ACTIVE，
      #      窗口内 >1 属预期；窗口结束后应回到 1，否则说明退役没生效。
      #   2) 默认 keep：旧值永不退役，>1 就是需要人工收窗的累积（先 rotate 用
      #      overlap_seconds=0 或 disable 旧 credential，不要直接改库）。
      # for: 1h 是为了不把刚完成的受控更新/轮换当成事故。
      - alert: PlatformClientSecretActivePerClientAccumulated
        expr: platform_oauth_client_secret_active_client > 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: An OAuth client holds more than one ACTIVE secret
          description: >-
            platform_oauth_client_secret_active_client{client_id} > 1：该客户端有多行仍可用于
            换令牌的 Secret。GRACE 窗口或 overlap_seconds>0 的轮换期间属预期，窗口结束后
            仍 >1 即为 keep 累积——用 credentials/rotate 的 overlap_seconds=0 收紧，或用
            credentials/{id}/disable 吊销旧值。核对 platform_oauth_client_secret_active_clients
            与 platform_oauth_client_secret_active_over_90d 判断遗留面大小。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      # 最老 ACTIVE Secret 超过 90 天（7776000s）：制度上限，说明该客户端的密钥从未轮换。
      # 该 gauge 在采集失败或无 ACTIVE Secret 时不输出，因此缺席不等于“密钥很新”。
      - alert: PlatformClientSecretActiveOldestOver90Days
        expr: platform_oauth_client_secret_oldest_active_seconds > 7776000
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: The oldest ACTIVE OAuth client secret is older than 90 days
          description: >-
            platform_oauth_client_secret_oldest_active_seconds > 7776000（90 天）：至少有一个
            OAuth Client 的 ACTIVE Secret 超过制度龄期上限。先按
            platform_oauth_client_secret_active_client{client_id} 定位客户端，再走受控轮换
            （credentials/rotate，重叠时长 ≤ 30 天）。持续未处理时旧值一旦泄露即可长期换令牌。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      # gauge 采集失败/样本缺失兜底：Secret 指标在采集失败时整组跳过（不写 0），
      # 只靠 collection_errors 增长。抓取 up 正常但样本缺席 = 采集链路或鉴权坏了，
      # 此时 age/累积告警全部静默，必须单独告警。
      - alert: PlatformClientSecretGaugeSamplesMissing
        expr: >-
          absent(platform_oauth_client_secret_active_clients{job="platform-api"})
          and up{job="platform-api"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: OAuth client secret gauges are missing from platform /metrics
          description: >-
            platform-api 抓取正常（up=1）但 platform_oauth_client_secret_active_clients 无样本：
            Secret 采集被数据库错误跳过，或 /metrics 被 RequireMetricsAccess 拒绝（token 与
            runtime/prometheus-secrets/platform-metrics-token 不一致）。先看
            platform_metric_collection_errors_total 的增速，再确认抓取凭据；不要在没有样本时
            认为“没有累积、没有超龄密钥”。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

  # 平台自身请求面与数据库连接池（BIZ-FIX-B2）。这一组故意不写审计链指标：
  # platform_audit_chain_* 目前**在代码里并不存在**，为不存在的指标写规则等于制造
  # 永久静默的假告警（absent() 也会长期红），必须等指标先落地再加规则。
  - name: platform-http-db
    rules:
      # 错误率：status="5xx" 的 errors / 全部 requests。
      #
      # C1 起 metrics.go 的 HTTP 指标带 {method,route,status} 标签，所以终于能把分子
      # 收敛到 5xx：`platform_http_errors_total{status="5xx"}`。分母保持无标签选择器，
      # 由 sum() 把所有序列加总（等价于全站请求量）。
      #
      # 两种写法必须区分清楚：
      #   - 对：`status="5xx"`——status 是分桶枚举字符串，等值才能命中。
      #   - 错：`status=~"5.."`/`status=~"5.*"` 看起来“5 开头”，但标签值实际是 "5xx"
      #     这三个字符：正则要写成 `status=~"5xx"` 才命中，而原意是数字区间时更该用
      #     等值。写成 `status=~"5.."` 会得到空结果，规则静默永不触发。
      #
      # 阈值 5%：5xx 是服务端责任（4xx 归 authz/参数校验，由
      # PlatformAuthzFailuresSurge 与访问日志覆盖），持续超过 5% 说明数据库、下游依赖
      # 或应用本身在稳定失败，不是客户端行为。
      # for: 10m 用于过滤一次性批处理、健康探针与发布瞬间的抖动。
      - alert: PlatformHTTPErrorRateHigh
        expr: >-
          sum(rate(platform_http_errors_total{status="5xx"}[5m]))
          /
          sum(rate(platform_http_requests_total[5m]))
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Platform HTTP 5xx ratio is above 5 percent
          description: >-
            sum(rate(platform_http_errors_total{status="5xx"})) /
            sum(rate(platform_http_requests_total)) 的 5 分钟速率比超过 5% 并持续 10 分钟。
            分子只统计 status="5xx" 的序列（4xx 不计入），分母是全站请求总量，因此这是
            **服务端错误率**：先看应用日志与数据库可用性，再看下游依赖超时；如果是某个
            路由独大，用 `sum by (route) (rate(platform_http_errors_total{status="5xx"}[5m]))`
            定位。注意标签值是分桶枚举字符串，"5xx" 必须等值匹配（`status=~"5.."` 永远
            匹配不到）。该比值不受 /metrics 抓取影响：抓取自身已从计数中排除
            （Middleware 对 /metrics 不计数）。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      # 平均延迟：platform_http_request_duration_seconds_sum / _count。
      # 口径说明（C1 起）：延迟指标已由 summary 改为 **histogram**，现在有 *_bucket
      # （0.005…10 秒 + le="+Inf"），因此 histogram_quantile 已经可用。但这条规则**故意
      # 仍然只看 _sum/_count 的算术平均值**：p95 的阈值、分位与“按 route 分组还是全站”
      # 需要单独评审口径，p95 告警另立项，不在本轮顺手加。所以不要以为“有桶了就等于
      # 有尾延迟告警”——没有这条 p95 规则时，平均值正常不代表 p99 正常。
      # 想临时看尾延迟可以在 Prometheus 控制台手工查：
      #   histogram_quantile(0.95, sum by (le) (rate(platform_http_request_duration_seconds_bucket[5m])))
      # 阈值 1.5s：平台 API 以短事务 CRUD 为主，均值 1.5s 已经说明有明显慢路径
      # （典型是锁等待/连接池排队）；for: 15m 避开备份、迁移与批处理的周期性抖动。
      - alert: PlatformHTTPMeanLatencyHigh
        expr: >-
          sum(rate(platform_http_request_duration_seconds_sum[5m]))
          /
          sum(rate(platform_http_request_duration_seconds_count[5m]))
          > 1.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Platform HTTP mean latency is above 1.5 seconds
          description: >-
            platform_http_request_duration_seconds_sum / _count 得到的**平均**响应时间超过
            1.5 秒并持续 15 分钟。注意这是平均值而不是 p95：指标本身已是 histogram（有
            *_bucket），但本规则未使用分位，所以“平均值正常”不代表尾延迟正常。
            先看 platform_database_in_use_connections 与 platform_database_wait_count_total
            判断是不是连接池排队，再看慢查询与外部依赖；需要定位是哪类路由时按
            {method,route,status} 标签下钻。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      # 连接池高水位：platform_database_in_use_connections 是
      # gorm sql.DB.Stats().InUse（metrics.go:439），即“已被请求占用”的连接数。
      # 平台主池上限 50（internal/shared/database/mysql.go:21 → OpenMySQLWithPool(cfg,50,20,...)），
      # 代码不输出 MaxOpenConnections，因此写不出“占上限的百分比”，只能给绝对高水位：
      # 40 = 上限的 80%。80% 是“还有余量但已经开始排队”的位置；真正耗尽时表现为
      # 请求超时，会同时命中上面的 PlatformHTTPMeanLatencyHigh。
      # for: 10m 避免把发布瞬间的并发峰值当成容量问题。
      - alert: PlatformDatabaseInUseConnectionsHigh
        expr: platform_database_in_use_connections > 40
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Platform database connection pool is above 80 percent in use
          description: >-
            platform_database_in_use_connections > 40，即主连接池（上限 50）已有 80% 以上
            连接被占用并持续 10 分钟。常见原因：慢查询/锁等待长期持连接、下游超时未释放、
            或流量真的超过容量。先看 platform_database_wait_count_total 是否同步增长，
            再查慢查询与最长事务；不要用调大 maxOpen 掩盖泄漏——MySQL 侧的连接上限
            与内存会被一起拖垮。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      # 认证授权失败突增：platform_authz_failures_total 在 Middleware 里按
      # status == 401/403 累加（metrics.go:419），是“被拒绝”而不是“被拒绝的原因”。
      # 突增的两种典型含义必须区分：攻击/凭据失效（外部）与权限配置回归（内部，
      # 例如某角色映射漏配导致批量 403）。用 increase 看 10 分钟增量而不是绝对值，
      # 因为它是进程启动以来的累计计数，重启会归零、绝对值无法比较。
      # 阈值 50 次/10 分钟：正常运维下 401/403 是零星事件；超过说明有批量面。
      - alert: PlatformAuthzFailuresSurge
        expr: increase(platform_authz_failures_total[10m]) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Platform authorization failures are surging
          description: >-
            最近 10 分钟 platform_authz_failures_total 增长超过 50 次（status 401/403），
            并持续 5 分钟。先区分来源：集中在少数 IP 且路径分散 → 凭据爆破或客户端令牌过期；
            集中在单个业务路径且来自正常用户 → 权限/角色映射回归（改完权限没同步到
            Keycloak 投影或授权目录）。修复走受控变更，不要直接改库或放宽权限。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据

      # OIDC 登录失败突增：platform_oidc_login_failures_total 是上面 401/403 的子集，
      # 只统计 /oauth2/、/authorize、/api/v1/auth/ 前缀的拒绝（metrics.go:420）。
      # 它比总量更贴近“用户登不进来”：总量突增可能是某个内部调用方令牌过期，
      # 而这条规则命中意味着交互式登录链路本身在拒绝用户。
      # 阈值 20 次/10 分钟：登录失败的用户可见度高，且往往成批出现（issuer/client 配错
      # 或 Keycloak 侧 Client 被改），因此比总量规则更敏感。
      - alert: PlatformOIDCLoginFailuresSurge
        expr: increase(platform_oidc_login_failures_total[10m]) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: OIDC login failures are surging
          description: >-
            最近 10 分钟 platform_oidc_login_failures_total 增长超过 20 次（/oauth2/、
            /authorize、/api/v1/auth/ 前缀上的 401/403）并持续 5 分钟：交互式登录正在被
            批量拒绝。按顺序核对 Keycloak 侧 Client（client_id/secret/redirect_uri）、
            issuer 与平台 OIDC 配置是否一致，再看是否有登出后的旧会话在重放。
            该指标不含失败原因，必须结合 Keycloak 与应用日志定位。
          runbook: platform/deploy/production/README.md#观测接入指标告警与凭据
