global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/keycloak-alerts.yml

scrape_configs:
  # Keycloak management endpoints are available only inside the Compose network.
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  # The backup script atomically writes the timestamp only after gzip and size
  # validation succeed. node-exporter publishes it via the textfile collector.
  - job_name: keycloak-backup
    static_configs:
      - targets: ["keycloak-backup-metrics:9100"]
