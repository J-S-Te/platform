# 可选的可观测性覆盖配置，只有显式指定才会启用。Prometheus 和 node-exporter 保留在内部应用网络，本示例不向宿主机发布监控端口。
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/keycloak-alerts.yml:/etc/prometheus/keycloak-alerts.yml:ro
      - ./monitoring/prometheus/file-gateway-alerts.yml:/etc/prometheus/file-gateway-alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [application]
    restart: unless-stopped

  keycloak-backup-metrics:
    image: prom/node-exporter:v1.9.1
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/textfile
    volumes:
      - ./monitoring/textfile:/textfile:ro
    networks: [application]
    restart: unless-stopped

volumes:
  prometheus-data:
