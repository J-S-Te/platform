# 许可运行态键（COMMERCIAL_LICENSE_ENABLED / COMMERCIAL_LICENSE_COMPATIBILITY）不在本清单：
# 由平台写入 runtime/license-<service>.env；兼容放行开关生产必须缺省（缺省即 fail-closed）。
version: 1
default: false
application:
  code: data_analysis
  initial_admin_roles: [dashboard_admin]
  allowed_service_bindings: [contract_dashboard_read, project_dashboard_read, contract_import_report_read]
  name: 数据看板与统计分析系统
  description: 经营总览、合同项目分析、预警与指标看板
  environment: prod
  path_prefix: /data_analysis
  upstream_url: http://data-analysis-api:8080
  client_type: confidential
runtime:
  required_infrastructure_keys:
    - DASHBOARD_MYSQL_PASSWORD
    - DASHBOARD_MYSQL_ROOT_PASSWORD
  files:
    - path: runtime/data-analysis.env
      template_path: subsystem-templates/data-analysis.env.example
      compose_environment_key: DATA_ANALYSIS_RUNTIME_ENV_FILE
      # 嵌入密钥只在已启用嵌入能力时要求，校验见文末optional_features。
      required_existing_keys: []
      # 会话编解码密钥仅用于本系统 Cookie；首次接入生成并长期复用。
      generated_keys: [OIDC_CODEC_KEY]
      values:
        CONTRACT_IMPORT_SUMMARY_URL: http://contract-api:8081/internal/v1/contract-imports/report-source
        CONTRACT_IMPORT_SYNC_TOKEN_URL: http://platform-api:8080/oauth2/token
        CONTRACT_IMPORT_SYNC_SCOPE: contract.import.report.read
        CONTRACT_IMPORT_STATUS_ISSUER: basic-platform
        CONTRACT_IMPORT_STATUS_AUDIENCE: basic-platform-application
        CONTRACT_IMPORT_STATUS_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
        CONTRACT_IMPORT_STATUS_CLIENT_ID: contract_management-prod-analysis-import-report-status
        CONTRACT_IMPORT_STATUS_CALLER_ENVIRONMENT_CODE: prod
        # BIZ-XAPI-13：报表状态端点的期望 OAuth client 身份，仅由受控接入写入（合同侧签发给
        # 数析的 analysis-import-report-status 客户端 ID）。保持空占位 = 端点不挂载（fail-closed）；
        # 不要手填：身份不符会让合同→数析的状态查询直接 401，且不会伪造报表状态。
        REPORT_STATUS_MACHINE_OAUTH_CLIENT_ID: ""
        DASHBOARD_MYSQL_DSN: 'dashboard:${DASHBOARD_MYSQL_PASSWORD}@tcp(data-analysis-mysql:3306)/dashboard_aggregation?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci'
        OIDC_IDP_HINT: basic-platform
        OIDC_SCOPES: openid profile
        OIDC_SESSION_COOKIE_NAME: data_analysis_session
        OIDC_SESSION_IDLE_TTL: 30m
        OIDC_SESSION_ABSOLUTE_TTL: 8h
        OIDC_AUTHORIZATION_REFRESH_INTERVAL: 1m
        OIDC_ROLE_CONFIG_HASH: sha256:265b9f487ff7ff2f298f9daef323d0e92883bd2086b51f0a57e6ceea3e3b9f1a
        PLATFORM_AUTHORIZATION_CATALOG_SYNC_ENABLED: "true"
        PLATFORM_BASE_URL: http://platform-api:8080
        PLATFORM_APPLICATION_CODE: data_analysis
        PLATFORM_ENVIRONMENT_CODE: prod
        PLATFORM_AUDIT_REQUIRED: "true"
        AUDIT_WORKER_ID: data-analysis-dashboard-api
        METABASE_INTERNAL_URL: http://data-analysis-metabase:3000
        METABASE_BASE_PATH: /
        # 聚合 Worker 只向平台 OAuth 令牌端点申请最小 scope，不再依赖 Keycloak service account。
        MACHINE_TOKEN_URL: http://platform-api:8080/oauth2/token
        MACHINE_TOKEN_ISSUER: basic-platform
        MACHINE_TOKEN_AUDIENCE: basic-platform-application
        CONTRACT_MACHINE_TOKEN_SCOPE: dashboard.contract.read
        PROJECT_MACHINE_TOKEN_SCOPE: dashboard.project.read
        CONTRACT_INTERNAL_URL: http://contract-api:8081/internal/v1/dashboard
        PROJECT_INTERNAL_URL: http://project-api:8082/internal/v1/dashboard
        PROJECT_PROJECTION_URL: http://project-api:8082/internal/v1/dashboard/projects/snapshot
        PROJECT_PROJECTION_HTTP_TIMEOUT: 35s
      bindings:
        CONTRACT_IMPORT_SYNC_CLIENT_ID: service.contract_import_report_read.client_id
        CONTRACT_IMPORT_SYNC_CLIENT_SECRET: service.contract_import_report_read.client_secret
        CONTRACT_IMPORT_STATUS_TENANT_ID: tenant_id
        APP_PATH_PREFIX: path_prefix
        APP_PUBLIC_ORIGIN: public_origin
        OIDC_ISSUER: issuer
        OIDC_BACKCHANNEL_BASE_URL: oidc_backchannel_base_url
        OIDC_CLIENT_ID: client_id
        OIDC_CLIENT_SECRET: client_secret
        OIDC_REDIRECT_URI: redirect_uri
        OIDC_TENANT_ID: tenant_id
        COOKIE_SECURE: cookie_secure
        PLATFORM_AUTHORIZATION_CATALOG_APPLICATION_ID: application_id
        PLATFORM_AUTHORIZATION_CATALOG_CLIENT_ID: catalog_publisher_client_id
        PLATFORM_AUTHORIZATION_CATALOG_CLIENT_SECRET: catalog_publisher_client_secret
        PLATFORM_AUTHORIZATION_CONTEXT_URL: authorization_context_url
        PLATFORM_AUDIT_CLIENT_ID: service.audit_ingest.client_id
        PLATFORM_AUDIT_CLIENT_SECRET: service.audit_ingest.client_secret
        CONTRACT_MACHINE_CLIENT_ID: service.contract_dashboard_read.client_id
        CONTRACT_MACHINE_CLIENT_SECRET: service.contract_dashboard_read.client_secret
        PROJECT_MACHINE_CLIENT_ID: service.project_dashboard_read.client_id
        PROJECT_MACHINE_CLIENT_SECRET: service.project_dashboard_read.client_secret
compose:
  dependency_services: [data-analysis-mysql]
  initialization_services: [data-analysis-metabase-init]
  database:
    service: data-analysis-mysql
    name: dashboard_aggregation
  migrate_service: data-analysis-migrate
  runtime_services: [data-analysis-metabase, data-analysis-api, data-analysis-aggregation-worker, data-analysis-alert-worker]
  teardown_services: [data-analysis-metabase, data-analysis-api, data-analysis-aggregation-worker, data-analysis-alert-worker]
  release_image_keys:
    - DATA_ANALYSIS_DASHBOARD_API_IMAGE
    - DATA_ANALYSIS_AGGREGATION_WORKER_IMAGE
    - DATA_ANALYSIS_ALERT_WORKER_IMAGE
    - DATA_ANALYSIS_MIGRATE_IMAGE
optional_features:
  - name: dashboard_embed
    runtime_file: runtime/data-analysis.env
    enabled_key: DASHBOARD_EMBED_ENABLED
    default_enabled: true
    required_existing_keys: [METABASE_EMBEDDING_SECRET]
    runtime_services: [data-analysis-metabase]
    initialization_services: [data-analysis-metabase-init]
