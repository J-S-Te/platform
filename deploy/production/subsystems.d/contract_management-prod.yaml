# 许可运行态键（COMMERCIAL_LICENSE_ENABLED / COMMERCIAL_LICENSE_COMPATIBILITY）不在本清单：
# 由平台写入 runtime/license-<service>.env；兼容放行开关生产必须缺省（缺省即 fail-closed）。
version: 1
default: true
application:
  code: contract_management
  initial_admin_roles: [admin]
  allowed_service_bindings: [settlement_contract_ingest, owner_directory_read, notification_ingest, file_gateway_write, crm_contract_reference_read, crm_contract_link_write, crm_customer_import_provision, crm_opportunity_import_provision, project_contract_import, analysis_contract_import_report_status]
  name: 合同管理系统
  description: 合同创建、审批与客户管理系统
  environment: prod
  path_prefix: /contract_management
  upstream_url: http://contract-api:8081
  client_type: confidential
runtime:
  required_infrastructure_keys:
    - CONTRACT_MYSQL_PASSWORD
    - CONTRACT_MYSQL_ROOT_PASSWORD
  files:
    - path: runtime/contract.env
      template_path: subsystem-templates/contract.env.example
      compose_environment_key: CONTRACT_RUNTIME_ENV_FILE
      required_existing_keys: []
      generated_keys:
        - OIDC_SESSION_ENCRYPTION_KEY_BASE64
        - SIGNING_PHONE_ENCRYPTION_KEY_BASE64
      values:
        CONTRACT_IMPORT_REPORT_BASE_URL: http://data-analysis-api:8080
        CONTRACT_IMPORT_REPORT_TOKEN_URL: http://platform-api:8080/oauth2/token
        CONTRACT_IMPORT_REPORT_SCOPE: analysis.contract-import.report-status
        CONTRACT_IMPORT_PROJECT_BASE_URL: http://project-api:8082
        CONTRACT_IMPORT_PROJECT_TOKEN_URL: http://platform-api:8080/oauth2/token
        CONTRACT_IMPORT_PROJECT_SCOPE: project.contract.import
        CONTRACT_IMPORT_FINANCE_BASE_URL: http://settlement-api:8085
        CONTRACT_IMPORT_FINANCE_TOKEN_URL: http://platform-api:8080/oauth2/token
        CONTRACT_IMPORT_FINANCE_SCOPE: settlement.contract.ingest
        CONTRACT_IMPORT_REPORT_READ_ISSUER: basic-platform
        CONTRACT_IMPORT_REPORT_READ_AUDIENCE: basic-platform-application
        CONTRACT_IMPORT_REPORT_READ_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
        CONTRACT_IMPORT_REPORT_READ_CLIENT_ID: data_analysis-prod-contract-import-report-read
        CONTRACT_IMPORT_REPORT_READ_CALLER_ENVIRONMENT_CODE: prod
        SETTLEMENT_API_BASE_URL: http://settlement-api:8085
        SETTLEMENT_INTEGRATION_TOKEN_URL: http://platform-api:8080/oauth2/token
        SETTLEMENT_INTEGRATION_AUDIENCE: basic-platform-application
        SETTLEMENT_INTEGRATION_OUTBOUND_ENABLED: "true"
        # 受控“合同财务变更”入口（BIZ-XEVT2-05 合同侧）：开启需产品确认（单人改额
        # 口径尚未签认），当前与子系统模板同为关闭；开启时须同步修改模板，
        # 否则按模板重建会静默关掉该入口。
        CONTRACT_FINANCIAL_CHANGE_ENABLED: "false"
        MYSQL_DSN: 'contract:${CONTRACT_MYSQL_PASSWORD}@tcp(contract-mysql:3306)/contract_management?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci'
        OIDC_IDP_HINT: basic-platform
        OIDC_SCOPES: openid profile
        OIDC_SESSION_COOKIE_NAME: contract_management_session
        OIDC_SESSION_IDLE_TTL: 30m
        OIDC_SESSION_ABSOLUTE_TTL: 8h
        # 中央会话只读缓存显式关闭（0=关闭；开启后平台撤销/登出的本地生效延迟≤该毫秒值，上限 5000）。
        CENTRAL_SESSION_CACHE_MS: "0"
        PLATFORM_AUTHORIZATION_CATALOG_SYNC_ENABLED: "true"
        PLATFORM_APPLICATION_CODE: contract_management
        PLATFORM_ENVIRONMENT_CODE: prod
        PLATFORM_AUDIT_REQUIRED: "true"
        # 审计清理显式关闭（0=不清理；开启前须完成保留期审批，见对应子系统模板注释）。
        AUDIT_OUTBOX_DELIVERED_RETENTION_DAYS: "0"
        CONTRACT_MACHINE_TOKEN_ISSUER: basic-platform
        CONTRACT_MACHINE_TOKEN_AUDIENCE: basic-platform-application
        CONTRACT_MACHINE_TOKEN_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
        DASHBOARD_MACHINE_ENABLED: "true"
        DASHBOARD_MACHINE_REQUIRE_BEARER: "true"
        DASHBOARD_MACHINE_ISSUER: basic-platform
        DASHBOARD_MACHINE_AUDIENCE: basic-platform-application
        DASHBOARD_MACHINE_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
        DASHBOARD_MACHINE_CLIENT_ID: data_analysis-prod-contract-dashboard
        DASHBOARD_MACHINE_CALLER_APPLICATION_CODE: data_analysis
        DASHBOARD_MACHINE_CALLER_ENVIRONMENT_CODE: prod
        DASHBOARD_MACHINE_REQUIRED_SCOPE: dashboard.contract.read
        PROJECT_APPROVAL_MACHINE_ENABLED: "true"
        PROJECT_APPROVAL_MACHINE_REQUIRE_BEARER: "true"
        PROJECT_APPROVAL_MACHINE_ISSUER: basic-platform
        PROJECT_APPROVAL_MACHINE_AUDIENCE: basic-platform-application
        PROJECT_APPROVAL_MACHINE_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
        PROJECT_APPROVAL_MACHINE_CLIENT_ID: project_management-prod-contract-approved-reader
        PROJECT_APPROVAL_MACHINE_CALLER_APPLICATION_CODE: project_management
        PROJECT_APPROVAL_MACHINE_CALLER_ENVIRONMENT_CODE: prod
        PROJECT_APPROVAL_MACHINE_REQUIRED_SCOPE: contract.approved.internal.read
        CRM_SIGNED_COUNT_MACHINE_ENABLED: "true"
        CRM_SIGNED_COUNT_MACHINE_REQUIRE_BEARER: "true"
        CRM_SIGNED_COUNT_MACHINE_ISSUER: basic-platform
        CRM_SIGNED_COUNT_MACHINE_AUDIENCE: basic-platform-application
        CRM_SIGNED_COUNT_MACHINE_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
        CRM_SIGNED_COUNT_MACHINE_CLIENT_ID: customer_and_opportunity-prod-contract-signed-count
        CRM_SIGNED_COUNT_MACHINE_CALLER_APPLICATION_CODE: customer_and_opportunity
        CRM_SIGNED_COUNT_MACHINE_CALLER_ENVIRONMENT_CODE: prod
        CRM_SIGNED_COUNT_MACHINE_REQUIRED_SCOPE: contract.opportunity_signed_count.read
        CRM_OPPORTUNITY_INTAKE_MACHINE_ENABLED: "true"
        CRM_OPPORTUNITY_INTAKE_MACHINE_REQUIRE_BEARER: "true"
        CRM_OPPORTUNITY_INTAKE_MACHINE_ISSUER: basic-platform
        CRM_OPPORTUNITY_INTAKE_MACHINE_AUDIENCE: basic-platform-application
        CRM_OPPORTUNITY_INTAKE_MACHINE_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
        CRM_OPPORTUNITY_INTAKE_MACHINE_CLIENT_ID: customer_and_opportunity-prod-opportunity-intake
        CRM_OPPORTUNITY_INTAKE_MACHINE_CALLER_APPLICATION_CODE: customer_and_opportunity
        CRM_OPPORTUNITY_INTAKE_MACHINE_CALLER_ENVIRONMENT_CODE: prod
        CRM_OPPORTUNITY_INTAKE_MACHINE_REQUIRED_SCOPE: opportunity.signed.write
        CONTRACT_SUMMARY_MACHINE_ENABLED: "true"
        CONTRACT_SUMMARY_MACHINE_REQUIRE_BEARER: "true"
        CONTRACT_SUMMARY_MACHINE_ISSUER: basic-platform
        CONTRACT_SUMMARY_MACHINE_AUDIENCE: basic-platform-application
        CONTRACT_SUMMARY_MACHINE_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
        CONTRACT_SUMMARY_MACHINE_CLIENT_ID: customer_and_opportunity-prod-contract-summary
        CONTRACT_SUMMARY_MACHINE_CALLER_APPLICATION_CODE: customer_and_opportunity
        CONTRACT_SUMMARY_MACHINE_CALLER_ENVIRONMENT_CODE: prod
        CONTRACT_SUMMARY_MACHINE_REQUIRED_SCOPE: contract.summary.read
        FILE_GATEWAY_BASE_URL: http://file-gateway:8086
        FILE_GATEWAY_SCOPE: platform:file:upload platform:file:bind platform:file:download
        STAMPED_FILE_GATEWAY_MODE: dual
        CRM_REFERENCE_BASE_URL: http://customer-api:8090/customer-opportunity
        CRM_REFERENCE_TOKEN_URL: http://platform-api:8080/oauth2/token
        CRM_REFERENCE_SCOPE: customer.contract_reference.read
        CRM_LINK_BASE_URL: http://customer-api:8090/customer-opportunity
        CRM_LINK_TOKEN_URL: http://platform-api:8080/oauth2/token
        CRM_LINK_SCOPE: opportunity.signed.write
        # 历史导入自动开立 CRM 客户/商机（导入专用通道，开关默认关闭）：与合同核验、
        # 签约回写分开的最小权限凭据。客户/商机两个 scope 在平台侧是两个独立用途
        # （crm_customer_import_provision / crm_opportunity_import_provision），
        # 平台按“一用途一 client 一 scope”授予，因此这里也必须给两对 client：
        # CRM_PROVISION_* 服务客户查询/创建，CRM_PROVISION_OPPORTUNITY_* 服务
        # 商机创建与推进；任一 pair 缺失时合同侧启动必须失败关闭。
        CONTRACT_IMPORT_CRM_PROVISION_ENABLED: "false"
        # 能力开关（默认关闭）：开启后历史导入才允许自动审批；开启后仍须由合同
        # 系统超级管理员（角色 admin）在控制台按租户开启运行开关（默认关闭），
        # 两者同时开启才生效。与模板 contract.env.example 同值，改一处必须同步另一处。
        CONTRACT_IMPORT_AUTO_APPROVE_HISTORICAL: "false"
        CRM_PROVISION_BASE_URL: http://customer-api:8090/customer-opportunity
        CRM_PROVISION_TOKEN_URL: http://platform-api:8080/oauth2/token
        CRM_PROVISION_SCOPE: customer.import_provision
        CRM_PROVISION_OPPORTUNITY_SCOPE: opportunity.import_provision
        # PROJECT_INTEGRATION_ENABLED 由部署层按 project.env 接入就绪事实解析写入
        #（来源自动解析，档一），不在清单预置；URL/凭据键仍由清单下发。
        PROJECT_API_BASE_URL: http://project-api:8082
        PROJECT_INTEGRATION_TOKEN_URL: http://platform-api:8080/oauth2/token
        PROJECT_INTEGRATION_AUDIENCE: basic-platform-application
        # 人员离职交接入站（BIZ-XWIRE-04）：平台按批次租户自签短效 application JWT，
        # 合同侧只用平台 Ed25519 公钥验签；issuer/audience/client/应用/环境/scope 全部固定，
        # 租户只来自令牌，不接受请求体或请求头覆盖。
        HANDOVER_MACHINE_ENABLED: "true"
        HANDOVER_MACHINE_REQUIRE_BEARER: "true"
        HANDOVER_MACHINE_ISSUER: basic-platform
        HANDOVER_MACHINE_AUDIENCE: basic-platform-application
        HANDOVER_MACHINE_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
        HANDOVER_MACHINE_CLIENT_ID: platform-handover
        HANDOVER_MACHINE_CALLER_APPLICATION_CODE: platform
        HANDOVER_MACHINE_CALLER_ENVIRONMENT_CODE: prod
        HANDOVER_MACHINE_REQUIRED_SCOPE: handover.machine
      bindings:
        CONTRACT_IMPORT_REPORT_CLIENT_ID: service.analysis_contract_import_report_status.client_id
        CONTRACT_IMPORT_REPORT_CLIENT_SECRET: service.analysis_contract_import_report_status.client_secret
        CONTRACT_IMPORT_PROJECT_CLIENT_ID: service.project_contract_import.client_id
        CONTRACT_IMPORT_PROJECT_CLIENT_SECRET: service.project_contract_import.client_secret
        CONTRACT_IMPORT_FINANCE_CLIENT_ID: service.settlement_contract_ingest.client_id
        CONTRACT_IMPORT_FINANCE_CLIENT_SECRET: service.settlement_contract_ingest.client_secret
        SETTLEMENT_INTEGRATION_CLIENT_ID: service.settlement_contract_ingest.client_id
        SETTLEMENT_INTEGRATION_CLIENT_SECRET: service.settlement_contract_ingest.client_secret
        CENTRAL_SESSION_ENABLED: central_session_enabled
        CENTRAL_SESSION_PUBLIC_BASE_URL: central_session_public_base_url
        OIDC_ISSUER: issuer
        OIDC_BACKCHANNEL_BASE_URL: oidc_backchannel_base_url
        OIDC_CLIENT_ID: client_id
        OIDC_CLIENT_SECRET: client_secret
        OIDC_REDIRECT_URI: redirect_uri
        OIDC_POST_LOGOUT_REDIRECT_URI: logged_out_url
        OIDC_TENANT_ID: tenant_id
        OIDC_SESSION_COOKIE_SECURE: cookie_secure
        APP_PUBLIC_URL: public_url
        APP_PATH_PREFIX: path_prefix
        PLATFORM_AUTHORIZATION_CATALOG_APPLICATION_ID: application_id
        PLATFORM_AUTHORIZATION_CATALOG_CLIENT_ID: catalog_publisher_client_id
        PLATFORM_AUTHORIZATION_CATALOG_CLIENT_SECRET: catalog_publisher_client_secret
        PLATFORM_AUTHORIZATION_CONTEXT_URL: authorization_context_url
        PLATFORM_AUDIT_CLIENT_ID: service.audit_ingest.client_id
        PLATFORM_AUDIT_CLIENT_SECRET: service.audit_ingest.client_secret
        PLATFORM_NOTIFICATION_CLIENT_ID: service.notification_ingest.client_id
        PLATFORM_NOTIFICATION_CLIENT_SECRET: service.notification_ingest.client_secret
        PLATFORM_PERSONNEL_DIRECTORY_CLIENT_ID: service.owner_directory_read.client_id
        PLATFORM_PERSONNEL_DIRECTORY_CLIENT_SECRET: service.owner_directory_read.client_secret
        FILE_GATEWAY_APPLICATION_ID: application_id
        FILE_GATEWAY_CLIENT_ID: service.file_gateway_write.client_id
        FILE_GATEWAY_CLIENT_SECRET: service.file_gateway_write.client_secret
        CRM_REFERENCE_CLIENT_ID: service.crm_contract_reference_read.client_id
        CRM_REFERENCE_CLIENT_SECRET: service.crm_contract_reference_read.client_secret
        CRM_LINK_CLIENT_ID: service.crm_contract_link_write.client_id
        CRM_LINK_CLIENT_SECRET: service.crm_contract_link_write.client_secret
        CRM_PROVISION_CLIENT_ID: service.crm_customer_import_provision.client_id
        CRM_PROVISION_CLIENT_SECRET: service.crm_customer_import_provision.client_secret
        CRM_PROVISION_OPPORTUNITY_CLIENT_ID: service.crm_opportunity_import_provision.client_id
        CRM_PROVISION_OPPORTUNITY_CLIENT_SECRET: service.crm_opportunity_import_provision.client_secret
        PROJECT_INTEGRATION_CLIENT_ID: service.project_contract_import.client_id
        PROJECT_INTEGRATION_CLIENT_SECRET: service.project_contract_import.client_secret
compose:
  dependency_services: [contract-mysql, temporal]
  database:
    service: contract-mysql
    name: contract_management
  migrate_service: contract-migrate
  runtime_services: [contract-api, contract-worker]
  teardown_services: [contract-api, contract-worker]
  release_image_keys: [CONTRACT_IMAGE]
