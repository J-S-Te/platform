version: 1
default: true
application:
  code: contract_management
  initial_admin_roles: [admin]
  allowed_service_bindings: []
  name: 合同管理系统
  description: 合同创建、审批与客户管理系统
  environment: prod
  path_prefix: /contract_management
  upstream_url: http://contract-api:8081
  client_type: confidential
runtime:
  required_infrastructure_keys:
    - CONTRACT_MYSQL_PASSWORD
    - CONTRACT_MYSQL_ROOT_PASSWORD
  files:
    - path: runtime/contract.env
      template_path: subsystem-templates/contract.env.example
      compose_environment_key: CONTRACT_RUNTIME_ENV_FILE
      required_existing_keys: []
      values:
        OIDC_SCOPES: openid profile
        OIDC_SESSION_COOKIE_NAME: contract_management_session
        PLATFORM_AUTHORIZATION_CATALOG_SYNC_ENABLED: "true"
        PLATFORM_APPLICATION_CODE: contract_management
        PLATFORM_ENVIRONMENT_CODE: prod
        CONTRACT_MACHINE_TOKEN_ISSUER: basic-platform
        CONTRACT_MACHINE_TOKEN_AUDIENCE: basic-platform-application
        CONTRACT_MACHINE_TOKEN_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
      bindings:
        OIDC_ISSUER: issuer
        OIDC_CLIENT_ID: client_id
        OIDC_CLIENT_SECRET: client_secret
        OIDC_REDIRECT_URI: redirect_uri
        OIDC_POST_LOGOUT_REDIRECT_URI: logged_out_url
        OIDC_TENANT_ID: tenant_id
        OIDC_SESSION_COOKIE_SECURE: cookie_secure
        APP_PUBLIC_URL: public_url
        APP_PATH_PREFIX: path_prefix
        PLATFORM_AUTHORIZATION_CATALOG_APPLICATION_ID: application_id
        PLATFORM_AUTHORIZATION_CATALOG_CLIENT_ID: catalog_publisher_client_id
        PLATFORM_AUTHORIZATION_CATALOG_CLIENT_SECRET: catalog_publisher_client_secret
        PLATFORM_AUDIT_CLIENT_ID: service.audit_ingest.client_id
        PLATFORM_AUDIT_CLIENT_SECRET: service.audit_ingest.client_secret
compose:
  profiles: [release]
  dependency_services: [contract-mysql, temporal]
  database:
    service: contract-mysql
    name: contract_management
  migrate_service: contract-migrate
  runtime_services: [contract-api]
  teardown_services: [contract-api]
  release_image_keys: [CONTRACT_IMAGE]
