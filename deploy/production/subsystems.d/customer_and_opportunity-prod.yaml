version: 1
default: false
application:
  code: customer_and_opportunity
  initial_admin_roles: [sales_director, team_lead, technical_director]
  allowed_service_bindings: [owner_directory_read, contract_summary_read, contract_opportunity_signed_write, notification_ingest, file_gateway_write]
  name: 客户与商机管理系统
  description: 客户、商机与售前协作管理系统
  environment: prod
  path_prefix: /customer-opportunity
  upstream_url: http://customer-api:8090
  client_type: confidential
runtime:
  required_infrastructure_keys:
    - CUSTOMER_MYSQL_PASSWORD
    - CUSTOMER_MYSQL_ROOT_PASSWORD
  files:
    - path: runtime/customer.env
      template_path: subsystem-templates/customer.env.example
      compose_environment_key: CUSTOMER_RUNTIME_ENV_FILE
      required_existing_keys: []
      generated_keys:
        - SENSITIVE_ENCRYPTION_KEY_BASE64
        - SENSITIVE_HMAC_KEY_BASE64
        - PORTAL_INVITE_PEPPER_BASE64
      values:
        OIDC_IDP_HINT: basic-platform
        DEV_AUTH_ENABLED: "false"
        OIDC_SCOPES: openid profile
        OIDC_ROLE_CONFIG_HASH: sha256:77443efe31deec9ade8836e826b7240edfc377e953b9f5722e37dace011db0bb
        OIDC_MAX_EFFECTIVE_ROLES: "10"
        OIDC_SESSION_COOKIE_NAME: customer_opportunity_session
        PLATFORM_AUTHORIZATION_CATALOG_SYNC_ENABLED: "true"
        PLATFORM_BASE_URL: http://platform-api:8080
        PLATFORM_APPLICATION_CODE: customer_and_opportunity
        PLATFORM_ENVIRONMENT_CODE: prod
        OWNER_DIRECTORY_ENABLED: "true"
        PLATFORM_OWNER_DIRECTORY_URL: http://platform-api:8080/api/v1/internal/owner-directory
        PLATFORM_MANAGEMENT_TOKEN_URL: http://platform-api:8080/oauth2/token
        PLATFORM_OWNER_DIRECTORY_SCOPE: owner_directory.read
        # 合同摘要凭据只在运行时已完成密钥交付后显式开启。历史环境的
        # Retry/Update 不会从平台数据库恢复 OAuth 明文，因此默认关闭可
        # 安全修复旧环境，避免把缺失凭据误报成 Docker/目录不可用。
        CONTRACT_VERIFICATION_ENABLED: "false"
        CONTRACT_SUMMARY_URL: http://contract-api:8081/internal/contract-summary
        CONTRACT_SUMMARY_TOKEN_URL: http://platform-api:8080/oauth2/token
        CONTRACT_SUMMARY_SCOPE: contract.summary.read
        CONTRACT_TOKEN_URL: http://platform-api:8080/oauth2/token
        CONTRACT_OPPORTUNITY_INTAKE_URL: http://contract-api:8081/internal/opportunity-signed-events
        CONTRACT_SCOPE: opportunity.signed.write
        FILE_GATEWAY_BASE_URL: http://file-gateway:8086
        FILE_GATEWAY_SCOPE: platform:file:upload platform:file:bind
        ATTACHMENT_FILE_GATEWAY_MODE: dual
        ATTACHMENT_FILE_GATEWAY_BASE_URL: http://file-gateway:8086
        ATTACHMENT_FILE_GATEWAY_TOKEN_URL: http://platform-api:8080/oauth2/token
        ATTACHMENT_FILE_GATEWAY_SCOPE: platform:file:upload platform:file:bind
      bindings:
        APP_PUBLIC_ORIGIN: public_origin
        APP_PATH_PREFIX: path_prefix
        OIDC_ISSUER: issuer
        OIDC_CLIENT_ID: client_id
        OIDC_CLIENT_SECRET: client_secret
        OIDC_REDIRECT_URI: redirect_uri
        OIDC_POST_LOGOUT_REDIRECT_URI: public_url
        OIDC_TENANT_ID: tenant_id
        OIDC_SESSION_COOKIE_SECURE: cookie_secure
        PLATFORM_AUTHORIZATION_CATALOG_APPLICATION_ID: application_id
        PLATFORM_AUTHORIZATION_CATALOG_CLIENT_ID: catalog_publisher_client_id
        PLATFORM_AUTHORIZATION_CATALOG_CLIENT_SECRET: catalog_publisher_client_secret
        PLATFORM_AUTHORIZATION_CONTEXT_URL: authorization_context_url
        PLATFORM_AUDIT_CLIENT_ID: service.audit_ingest.client_id
        PLATFORM_AUDIT_CLIENT_SECRET: service.audit_ingest.client_secret
        PLATFORM_NOTIFICATION_CLIENT_ID: service.notification_ingest.client_id
        PLATFORM_NOTIFICATION_CLIENT_SECRET: service.notification_ingest.client_secret
        PLATFORM_OWNER_DIRECTORY_CLIENT_ID: service.owner_directory_read.client_id
        PLATFORM_OWNER_DIRECTORY_CLIENT_SECRET: service.owner_directory_read.client_secret
        CONTRACT_SUMMARY_CLIENT_ID: service.contract_summary_read.client_id
        CONTRACT_SUMMARY_CLIENT_SECRET: service.contract_summary_read.client_secret
        CONTRACT_CLIENT_ID: service.contract_opportunity_signed_write.client_id
        CONTRACT_CLIENT_SECRET: service.contract_opportunity_signed_write.client_secret
        FILE_GATEWAY_APPLICATION_ID: application_id
        FILE_GATEWAY_CLIENT_ID: service.file_gateway_write.client_id
        FILE_GATEWAY_CLIENT_SECRET: service.file_gateway_write.client_secret
        ATTACHMENT_FILE_GATEWAY_APPLICATION_ID: application_id
        ATTACHMENT_FILE_GATEWAY_CLIENT_ID: service.file_gateway_write.client_id
        ATTACHMENT_FILE_GATEWAY_CLIENT_SECRET: service.file_gateway_write.client_secret
compose:
  profiles: [customer, customer-release]
  dependency_services: [customer-mysql]
  database:
    service: customer-mysql
    name: customer_opportunity
  migrate_service: customer-migrate
  runtime_services: [customer-api, customer-opportunity-alert-worker, customer-owner-notification-worker, customer-presale-alert-worker, customer-presale-assignment-notification-worker, customer-presale-progress-notification-worker, customer-notification-delivery-worker, customer-presale-worker]
  teardown_services: [customer-api, customer-opportunity-alert-worker, customer-owner-notification-worker, customer-presale-alert-worker, customer-presale-assignment-notification-worker, customer-presale-progress-notification-worker, customer-notification-delivery-worker, customer-presale-worker]
  release_image_keys: [CUSTOMER_CRM_IMAGE]
