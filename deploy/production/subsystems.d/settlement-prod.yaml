# 许可运行态键（COMMERCIAL_LICENSE_ENABLED / COMMERCIAL_LICENSE_COMPATIBILITY）不在本清单：
# 由平台写入 runtime/license-<service>.env；兼容放行开关生产必须缺省（缺省即 fail-closed）。
version: 1
default: false
application:
  code: settlement
  initial_admin_roles: [settlement_admin]
  allowed_service_bindings: [file_gateway_write, owner_directory_read, notification_ingest, settlement_project_reference_read, crm_credit_payment_ingest]
  name: 结算与开票管理系统
  description: 应收、回款核销、开票与催收管理系统
  environment: prod
  path_prefix: /settlement
  upstream_url: http://settlement-api:8085
  client_type: confidential
runtime:
  required_infrastructure_keys:
    - SETTLEMENT_MYSQL_PASSWORD
    - SETTLEMENT_MYSQL_ROOT_PASSWORD
  files:
    - path: runtime/settlement.env
      template_path: subsystem-templates/settlement.env.example
      compose_environment_key: SETTLEMENT_RUNTIME_ENV_FILE
      required_existing_keys: []
      generated_keys:
        - OIDC_SESSION_ENCRYPTION_KEY_BASE64
      values:
        CONTRACT_INTEGRATION_AUDIENCE: basic-platform-application
        PLATFORM_MACHINE_TOKEN_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
        PLATFORM_MACHINE_TOKEN_ISSUER: basic-platform
        SETTLEMENT_MYSQL_DSN: 'settlement:${SETTLEMENT_MYSQL_PASSWORD}@tcp(settlement-mysql:3306)/settlement?parseTime=true&charset=utf8mb4&loc=UTC'
        OIDC_IDP_HINT: basic-platform
        OIDC_SESSION_COOKIE_NAME: settlement_session
        OIDC_SESSION_IDLE_TTL: 30m
        OIDC_SESSION_ABSOLUTE_TTL: 8h
        SETTLEMENT_DEVELOPMENT_AUTH: "false"
        SETTLEMENT_INTEGRATION_ENABLED: "true"
        SETTLEMENT_OUTBOX_BATCH_SIZE: "50"
        SETTLEMENT_INVOICE_ISSUANCE_MODE: manual
        SETTLEMENT_CRM_CREDIT_SYNC_ENABLED: "false"
        # 结算→CRM 回款/冲销信用事实同步的固定接线：scope 与 CRM 机器权限白名单
        # （customer.credit.payment.ingest）及平台用途 crm_credit_payment_ingest 一致。
        CRM_CREDIT_SYNC_ENDPOINT: http://customer-api:8090/api/v1/internal/credit/payment-events
        CRM_CREDIT_TOKEN_URL: http://platform-api:8080/oauth2/token
        CRM_CREDIT_SCOPE: customer.credit.payment.ingest
        SETTLEMENT_FILE_GATEWAY_MODE: required
        FILE_GATEWAY_URL: http://file-gateway:8086
        FILE_GATEWAY_TOKEN_URL: http://platform-api:8080/oauth2/token
        FILE_GATEWAY_SCOPE: platform:file:upload platform:file:bind platform:file:download
        SETTLEMENT_PROJECT_REFERENCE_URL: http://project-api:8082
        SETTLEMENT_PROJECT_REFERENCE_TOKEN_URL: http://platform-api:8080/oauth2/token
        PLATFORM_PERSONNEL_DIRECTORY_URL: http://platform-api:8080
        PLATFORM_BASE_URL: http://platform-api:8080
        PLATFORM_ENVIRONMENT_CODE: prod
        PLATFORM_AUTHORIZATION_CATALOG_SYNC_ENABLED: "true"
        # 人员离职交接入站（BIZ-XWIRE-04）：平台按批次租户自签短效 application JWT，
        # 结算侧只用平台 Ed25519 公钥验签；issuer/audience/client/应用/环境/scope 固定，
        # 租户只来自令牌。键名以 Settlement/internal/config 读取的 SETTLEMENT_HANDOVER_* 为准。
        SETTLEMENT_HANDOVER_ENABLED: "true"
        SETTLEMENT_HANDOVER_CLIENT_ID: platform-handover
        SETTLEMENT_HANDOVER_AUDIENCE: basic-platform-application
        SETTLEMENT_HANDOVER_APPLICATION_CODE: platform
        SETTLEMENT_HANDOVER_SCOPE: handover.machine
        SETTLEMENT_HANDOVER_ISSUER: basic-platform
        SETTLEMENT_HANDOVER_PUBLIC_KEY_PATH: /app/data/keys/jwt-ed25519-public.pem
        SETTLEMENT_HANDOVER_CALLER_ENVIRONMENT_CODE: prod
      bindings:
        SETTLEMENT_PROJECT_REFERENCE_CLIENT_ID: service.settlement_project_reference_read.client_id
        SETTLEMENT_PROJECT_REFERENCE_CLIENT_SECRET: service.settlement_project_reference_read.client_secret
        PLATFORM_PERSONNEL_DIRECTORY_CLIENT_ID: service.owner_directory_read.client_id
        PLATFORM_PERSONNEL_DIRECTORY_CLIENT_SECRET: service.owner_directory_read.client_secret
        SETTLEMENT_NOTIFICATION_CLIENT_ID: service.notification_ingest.client_id
        SETTLEMENT_NOTIFICATION_CLIENT_SECRET: service.notification_ingest.client_secret
        SETTLEMENT_AUDIT_CLIENT_ID: service.audit_ingest.client_id
        SETTLEMENT_AUDIT_CLIENT_SECRET: service.audit_ingest.client_secret
        # 信用同步机器凭据只能由平台按 crm_credit_payment_ingest 用途受控注入；
        # 键名必须与 Settlement/internal/config 读取的一致（CRM_CREDIT_CLIENT_ID/SECRET）。
        CRM_CREDIT_CLIENT_ID: service.crm_credit_payment_ingest.client_id
        CRM_CREDIT_CLIENT_SECRET: service.crm_credit_payment_ingest.client_secret
        CONTRACT_INTEGRATION_CLIENT_ID: related_service.contract_management.settlement_contract_ingest.client_id
        CONTRACT_INTEGRATION_OAUTH_CLIENT_ID: related_service.contract_management.settlement_contract_ingest.oauth_client_id
        CONTRACT_INTEGRATION_APPLICATION_ID: related_service.contract_management.settlement_contract_ingest.application_id
        CONTRACT_INTEGRATION_ENVIRONMENT_ID: related_service.contract_management.settlement_contract_ingest.environment_id
        OIDC_ISSUER: issuer
        OIDC_BACKCHANNEL_BASE_URL: oidc_backchannel_base_url
        OIDC_CLIENT_ID: client_id
        OIDC_CLIENT_SECRET: client_secret
        OIDC_REDIRECT_URI: redirect_uri
        OIDC_TENANT_ID: tenant_id
        OIDC_SESSION_COOKIE_SECURE: cookie_secure
        SETTLEMENT_PUBLIC_ORIGIN: public_origin
        SETTLEMENT_ALLOW_INSECURE_HTTP_ORIGIN: allow_insecure_http_origin
        PLATFORM_AUTHORIZATION_CATALOG_APPLICATION_ID: application_id
        PLATFORM_AUTHORIZATION_CATALOG_CLIENT_ID: catalog_publisher_client_id
        PLATFORM_AUTHORIZATION_CATALOG_CLIENT_SECRET: catalog_publisher_client_secret
        PLATFORM_AUTHORIZATION_CONTEXT_URL: authorization_context_url
        SETTLEMENT_FILE_GATEWAY_APPLICATION_ID: application_id
        FILE_GATEWAY_CLIENT_ID: service.file_gateway_write.client_id
        FILE_GATEWAY_CLIENT_SECRET: service.file_gateway_write.client_secret
compose:
  dependency_services: [settlement-mysql]
  database:
    service: settlement-mysql
    name: settlement
  migrate_service: settlement-migrate
  catalog_sync_service: settlement-catalog-sync
  runtime_services: [settlement-api, settlement-worker]
  teardown_services: [settlement-api, settlement-worker]
  release_image_keys: [SETTLEMENT_IMAGE]
