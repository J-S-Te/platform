# Optional isolated BI listener. For production use an independent HTTPS edge
# on a distinct registrable domain. Do not expose port 8082 as a business API.
services:
  frontend:
    environment:
      BI_EMBED_PUBLIC_ORIGIN: ${BI_EMBED_PUBLIC_ORIGIN:?configure an independent embed origin}
    ports:
      - ${BI_EMBED_BIND_ADDRESS:-127.0.0.1}:${BI_EMBED_HTTP_PORT:-8182}:8082
