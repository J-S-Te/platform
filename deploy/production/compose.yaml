name: ${COMPOSE_PROJECT_NAME:-basic-platform-production}

x-platform-service: &platform-service
  image: ${PLATFORM_IMAGE}
  env_file: [.env]
  networks: [application]
  volumes:
    - ./data/platform/keys:/app/data/keys
    - ./data/platform/logs:/app/data/logs
    - ./data/platform/uploads:/app/data/uploads
  restart: unless-stopped

x-contract-service: &contract-service
  image: ${CONTRACT_IMAGE}
  env_file: [.env]
  environment:
    HTTP_ADDRESS: :8081
    MYSQL_DSN: contract:${CONTRACT_MYSQL_PASSWORD}@tcp(contract-mysql:3306)/contract_management?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
    PLATFORM_BASE_URL: http://platform-api:8080
    OIDC_BACKCHANNEL_BASE_URL: http://platform-api:8080
    TEMPORAL_ADDRESS: temporal:7233
    GIN_MODE: release
  networks: [application]
  restart: unless-stopped

services:
  platform-mysql:
    image: mysql:8.4
    env_file: [.env]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - platform-mysql-data:/var/lib/mysql
    networks: [application]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  platform-migrate:
    <<: *platform-service
    command: ["./migrate"]
    profiles: ["release"]
    depends_on:
      platform-mysql:
        condition: service_healthy
    restart: "no"

  platform-api:
    <<: *platform-service
    command: ["./api"]
    ports:
      - "127.0.0.1:${PLATFORM_API_PORT:-18080}:8080"
    depends_on:
      platform-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  platform-worker:
    <<: *platform-service
    command: ["./worker"]
    depends_on:
      platform-mysql:
        condition: service_healthy

  contract-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: contract_management
      MYSQL_USER: contract
      MYSQL_PASSWORD: ${CONTRACT_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CONTRACT_MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - contract-mysql-data:/var/lib/mysql
      - ./mysql-init/contract-databases.sql:/docker-entrypoint-initdb.d/010_contract_databases.sql:ro
    networks: [application]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucontract -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_SEEDS: contract-mysql
      MYSQL_USER: contract
      MYSQL_PWD: ${CONTRACT_MYSQL_PASSWORD}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    networks: [application]
    depends_on:
      contract-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  contract-migrate:
    <<: *contract-service
    command: ["./migrate"]
    profiles: ["release"]
    depends_on:
      contract-mysql:
        condition: service_healthy
    restart: "no"

  contract-api:
    <<: *contract-service
    command: ["./api"]
    ports:
      - "127.0.0.1:${CONTRACT_API_PORT:-18081}:8081"
    depends_on:
      contract-mysql:
        condition: service_healthy
      temporal:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  contract-worker:
    <<: *contract-service
    command: ["./worker"]
    depends_on:
      contract-mysql:
        condition: service_healthy
      temporal:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18082}:80"
    networks: [application]
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  application:
    name: basic-platform-production

volumes:
  platform-mysql-data:
  contract-mysql-data:
