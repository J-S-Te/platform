name: ${COMPOSE_PROJECT_NAME:-basic-platform-production}

x-platform-service: &platform-service
  image: ${PLATFORM_IMAGE}
  env_file: [.env]
  networks: [application]
  volumes:
    - ./data/platform/keys:/app/data/keys
    - ./data/platform/logs:/app/data/logs
    - ./data/platform/uploads:/app/data/uploads
  restart: unless-stopped

x-contract-service: &contract-service
  image: ${CONTRACT_IMAGE}
  env_file: [.env]
  environment:
    HTTP_ADDRESS: :8081
    MYSQL_DSN: contract:${CONTRACT_MYSQL_PASSWORD}@tcp(contract-mysql:3306)/contract_management?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
    PLATFORM_BASE_URL: http://platform-api:8080
    OIDC_BACKCHANNEL_BASE_URL: http://platform-api:8080
    TEMPORAL_ADDRESS: temporal:7233
    GIN_MODE: release
  networks: [application]
  restart: unless-stopped

x-project-service: &project-service
  image: ${PROJECT_IMAGE}
  env_file: [.env]
  environment:
    PM_HTTP_ADDR: :8082
    MYSQL_DSN: project:${PROJECT_MYSQL_PASSWORD}@tcp(project-mysql:3306)/project_management?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
    PLATFORM_BASE_URL: http://platform-api:8080
    PLATFORM_APPLICATION_CODE: project_management
    PLATFORM_ENVIRONMENT_CODE: prod
    OIDC_ISSUER: ${OIDC_ISSUER}
    OIDC_BACKCHANNEL_BASE_URL: http://platform-api:8080
    OIDC_CLIENT_ID: ${PROJECT_OIDC_CLIENT_ID}
    OIDC_CLIENT_SECRET: ${PROJECT_OIDC_CLIENT_SECRET}
    OIDC_REDIRECT_URI: ${PROJECT_OIDC_REDIRECT_URI}
    OIDC_POST_LOGOUT_REDIRECT_URI: ${PROJECT_OIDC_POST_LOGOUT_REDIRECT_URI}
    OIDC_TENANT_ID: ${PROJECT_OIDC_TENANT_ID}
    OIDC_SESSION_COOKIE_NAME: project_management_session
    OIDC_SESSION_COOKIE_SECURE: ${PROJECT_OIDC_SESSION_COOKIE_SECURE:-true}
    OIDC_SESSION_TTL: ${PROJECT_OIDC_SESSION_TTL:-8h}
    APP_PATH_PREFIX: /project_management
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: default
    TEMPORAL_TASK_QUEUE: project-management
    PROJECT_RUN_WORKER_WITH_API: "true"
    PLATFORM_AUDIT_CLIENT_ID: ${PROJECT_PLATFORM_AUDIT_CLIENT_ID:-}
    PLATFORM_AUDIT_CLIENT_SECRET: ${PROJECT_PLATFORM_AUDIT_CLIENT_SECRET:-}
    PLATFORM_AUTHORIZATION_CATALOG_SYNC_ENABLED: ${PROJECT_PLATFORM_AUTHORIZATION_CATALOG_SYNC_ENABLED:-false}
    PLATFORM_AUTHORIZATION_CATALOG_APPLICATION_ID: ${PROJECT_PLATFORM_AUTHORIZATION_CATALOG_APPLICATION_ID:-}
    PLATFORM_AUTHORIZATION_CATALOG_CLIENT_ID: ${PROJECT_PLATFORM_AUTHORIZATION_CATALOG_CLIENT_ID:-}
    PLATFORM_AUTHORIZATION_CATALOG_CLIENT_SECRET: ${PROJECT_PLATFORM_AUTHORIZATION_CATALOG_CLIENT_SECRET:-}
    GIN_MODE: release
  networks: [application]
  restart: unless-stopped

services:
  platform-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - platform-mysql-data:/var/lib/mysql
    networks: [application]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  platform-migrate:
    <<: *platform-service
    command: ["./migrate"]
    profiles: ["release"]
    depends_on:
      platform-mysql:
        condition: service_healthy
    restart: "no"

  # 基础平台后端单容器：入口脚本同时启动 API 与后台 Worker。
  platform-api:
    <<: *platform-service
    environment:
      BASIC_PLATFORM_RUN_WORKER_WITH_API: "true"
    command: ["./api"]
    ports:
      - "127.0.0.1:${PLATFORM_API_PORT:-18080}:8080"
    depends_on:
      platform-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  contract-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: contract_management
      MYSQL_USER: contract
      MYSQL_PASSWORD: ${CONTRACT_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CONTRACT_MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - contract-mysql-data:/var/lib/mysql
      - ./mysql-init/contract-databases.sql:/docker-entrypoint-initdb.d/010_contract_databases.sql:ro
    networks: [application]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucontract -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_SEEDS: contract-mysql
      MYSQL_USER: contract
      MYSQL_PWD: ${CONTRACT_MYSQL_PASSWORD}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    networks: [application]
    depends_on:
      contract-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  project-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: project_management
      MYSQL_USER: project
      MYSQL_PASSWORD: ${PROJECT_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PROJECT_MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - project-mysql-data:/var/lib/mysql
    networks: [application]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uproject -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  contract-migrate:
    <<: *contract-service
    command: ["./migrate"]
    profiles: ["release"]
    depends_on:
      contract-mysql:
        condition: service_healthy
    restart: "no"

  # 合同管理后端单容器：入口脚本同时启动 API 与 Temporal Worker。
  contract-api:
    <<: *contract-service
    environment:
      HTTP_ADDRESS: :8081
      MYSQL_DSN: contract:${CONTRACT_MYSQL_PASSWORD}@tcp(contract-mysql:3306)/contract_management?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
      PLATFORM_BASE_URL: http://platform-api:8080
      OIDC_BACKCHANNEL_BASE_URL: http://platform-api:8080
      TEMPORAL_ADDRESS: temporal:7233
      CONTRACT_RUN_WORKER_WITH_API: "true"
      GIN_MODE: release
    command: ["./api"]
    ports:
      - "127.0.0.1:${CONTRACT_API_PORT:-18081}:8081"
    depends_on:
      contract-mysql:
        condition: service_healthy
      temporal:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  project-migrate:
    <<: *project-service
    entrypoint: ["/usr/local/bin/project-migrate"]
    profiles: ["release"]
    depends_on:
      project-mysql:
        condition: service_healthy
    restart: "no"

  project-api:
    <<: *project-service
    ports:
      - "127.0.0.1:${PROJECT_API_PORT:-18083}:8082"
    depends_on:
      project-mysql:
        condition: service_healthy
      temporal:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  frontend:
    image: ${FRONTEND_IMAGE}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-18082}:80"
    networks: [application]
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  application:
    name: basic-platform-production

volumes:
  platform-mysql-data:
  contract-mysql-data:
  project-mysql-data:
