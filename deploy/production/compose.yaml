    volumes:
      - license-state-customer-owner-notification-worker:/var/lib/commercial-license
      - ${PLATFORM_KEYS_DIR:-./data/platform/keys}/jwt-ed25519-public.pem:/app/data/keys/jwt-ed25519-public.pem:ro
    depends_on:
      customer-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(readlink /proc/1/exe)\" = /app/opportunity-owner-notification-worker"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    profiles: ["customer"]

  customer-contract-transfer-worker:
    <<: *customer-service
    env_file:
      - path: ${CUSTOMER_RUNTIME_ENV_FILE:-runtime/customer.env}
        required: false
      - path: runtime/license-customer-contract-transfer-worker.env
        required: false
    command: ["./contract-transfer-worker"]
    # YAML merge 不会递归合并 environment：本 Worker 与权威编排一致，只拿
    # PLATFORM_BASE_URL，不再继承 CRM API 的 OIDC/HTTP/附件键（继承会让 Worker 带着
    # API 的监听与回调配置启动，排障时看起来像“同一进程两套配置”）。
    environment:
      PLATFORM_BASE_URL: http://platform-api:8080
    volumes:
      - license-state-customer-contract-transfer-worker:/var/lib/commercial-license
      - ${PLATFORM_KEYS_DIR:-./data/platform/keys}/jwt-ed25519-public.pem:/app/data/keys/jwt-ed25519-public.pem:ro
    depends_on:
      customer-mysql:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    labels:
      com.basic-platform.application_code: customer_and_opportunity
      com.basic-platform.environment: prod
      com.basic-platform.service_name: customer-contract-transfer-worker
      com.basic-platform.service_role: worker
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(readlink /proc/1/exe)\" = /app/contract-transfer-worker"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    profiles: ["customer"]

  customer-presale-alert-worker:
