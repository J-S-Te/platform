        '422': { $ref: '#/components/responses/ValidationError' }
  /config/releases/{release_id}:
    parameters: [ { $ref: '#/components/parameters/ReleaseId' } ]
    get:
      tags: [Configuration]
      summary: 查询配置发布任务
      operationId: getConfigRelease
      x-permission: "platform:config-release:read"
      responses:
        '200': { $ref: '#/components/responses/ConfigRelease' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /config/applications/{application_code}/namespaces/{namespace_code}:
    parameters: [ { $ref: '#/components/parameters/ApplicationCode' }, { $ref: '#/components/parameters/NamespaceCode' } ]
    get:
      tags: [Configuration]
      summary: 读取应用已发布配置
      description: 只返回已发布且调用方有权读取的值；用于接入系统运行时读取。
      operationId: getPublishedConfig
      security: [ { applicationAuth: [] }, { cookieAuth: [] } ]
      x-permission: "platform:config:read"
      responses:
        '200':
          description: 已发布配置快照。
          content:
            application/json: { schema: { $ref: '#/components/schemas/PublishedConfigEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

