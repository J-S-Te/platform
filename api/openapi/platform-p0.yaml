openapi: 3.1.0
info:
  title: 基础能力平台 API
  version: 0.1.0-draft
  description: |
    基础能力平台的前后端接口草案。实现基线为 Go 模块化单体、MySQL、JWT Cookie 会话，
    所有时间均为 UTC RFC 3339 格式。本文件与 docs/frontend-backend-contract.md 共同作为联调契约；
    表结构和领域约束以 docs/core-models-mysql.md、docs/architecture.md 为准。
servers:
  - url: /api/v1
    description: 平台 API 相对地址
x-contract-rules:
  tenant_context: 所有受保护接口从认证会话或应用凭据解析 tenant_id；禁止由调用方传入 tenant_id 覆盖。
  write_operations: P0 写接口必须完成鉴权、租户隔离、参数校验、适用的 version 乐观锁和审计记录；登录与审计接收的认证/审计例外由各 operation 描述。
  time_format: UTC RFC 3339
security:
  - cookieAuth: []
tags:
  - name: Auth
  - name: Identity
  - name: Organization
  - name: Authorization
  - name: Audit
  - name: Configuration
  - name: P1 Capability
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 账号密码登录
      description: 校验 Argon2id 凭据，签发 HttpOnly JWT Cookie，并创建 iam_session。无需前端传入 tenant_id。
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功；响应同时通过 Set-Cookie 下发会话 Cookie。
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly; Secure（生产环境）; SameSite=Lax 的会话 Cookie。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '423': { $ref: '#/components/responses/AccountLocked' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/token/refresh:
    post:
      tags: [Auth]
      summary: 刷新当前会话
      operationId: refreshSession
      x-permission: authenticated
      responses:
        '200':
          description: 会话仍有效，已续发 Cookie。
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出当前会话
      operationId: logout
      x-permission: authenticated
      x-audit-action: auth.logout
      responses:
        '200':
          description: 当前 iam_session 已撤销且 Cookie 已清理。
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/EmptyEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/me:
    get:
      tags: [Auth]
      summary: 获取当前控制台主体
      operationId: getCurrentPrincipal
      x-permission: authenticated
      responses:
        '200':
          description: 当前用户、账号、租户、角色与权限摘要。
          content:
            application/json: { schema: { $ref: '#/components/schemas/PrincipalEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /users:
    get:
      tags: [Identity]
      summary: 分页查询用户
      operationId: listUsers
      x-permission: "platform:user:read"
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/StatusFilter' } ]
      responses:
        '200': { $ref: '#/components/responses/UserList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Identity]
      summary: 创建用户
      operationId: createUser
      x-permission: "platform:user:create"
      x-audit-action: platform:user:create
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UserCreateRequest' } }
      responses:
        '201':
          description: 已创建。
          content:
            application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{user_id}:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    get:
      tags: [Identity]
      summary: 获取用户详情
      operationId: getUser
      x-permission: "platform:user:read"
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Identity]
      summary: 更新用户
      description: 必须提交当前 version；服务端从会话取得租户与操作人。
      operationId: updateUser
      x-permission: "platform:user:update"
      x-audit-action: platform:user:update
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UserUpdateRequest' } }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /accounts:
    get:
      tags: [Identity]
      summary: 查询账号
      operationId: listAccounts
      x-permission: "platform:account:read"
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/StatusFilter' } ]
      responses:
        '200': { $ref: '#/components/responses/AccountList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts/{account_id}:
    parameters: [ { $ref: '#/components/parameters/AccountId' } ]
    patch:
      tags: [Identity]
      summary: 更新账号状态或显示信息
      operationId: updateAccount
      x-permission: "platform:account:update"
      x-audit-action: platform:account:update
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AccountUpdateRequest' } }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /org-units:
    get:
      tags: [Organization]
      summary: 查询组织单元
      operationId: listOrgUnits
      x-permission: "platform:organization:read"
      parameters: [ { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/StatusFilter' } ]
      responses:
        '200': { $ref: '#/components/responses/OrgUnitList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organization]
      summary: 创建组织单元
      operationId: createOrgUnit
      x-permission: "platform:organization:create"
      x-audit-action: platform:organization:create
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OrgUnitCreateRequest' } }
      responses:
        '201': { $ref: '#/components/responses/OrgUnit' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /positions:
    get:
      tags: [Organization]
      summary: 查询岗位
      operationId: listPositions
      x-permission: "platform:position:read"
      parameters: [ { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/StatusFilter' } ]
      responses:
        '200': { $ref: '#/components/responses/PositionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organization]
      summary: 创建岗位
      operationId: createPosition
      x-permission: "platform:position:create"
      x-audit-action: platform:position:create
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PositionCreateRequest' } }
      responses:
        '201': { $ref: '#/components/responses/Position' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /memberships:
    get:
      tags: [Organization]
      summary: 查询用户任职
      operationId: listMemberships
      x-permission: "platform:membership:read"
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/StatusFilter' } ]
      responses:
        '200': { $ref: '#/components/responses/MembershipList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organization]
      summary: 新增用户任职
      operationId: createMembership
      x-permission: "platform:membership:create"
      x-audit-action: platform:membership:create
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MembershipCreateRequest' } }
      responses:
        '201': { $ref: '#/components/responses/Membership' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /memberships/{membership_id}:
    parameters: [ { $ref: '#/components/parameters/MembershipId' } ]
    patch:
      tags: [Organization]
      summary: 更新任职
      operationId: updateMembership
      x-permission: "platform:membership:update"
      x-audit-action: platform:membership:update
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MembershipUpdateRequest' } }
      responses:
        '200': { $ref: '#/components/responses/Membership' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /resources:
    get:
      tags: [Authorization]
      summary: 查询资源
      operationId: listResources
      x-permission: "platform:resource:read"
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Keyword' } ]
      responses:
        '200': { $ref: '#/components/responses/ResourceList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Authorization]
      summary: 创建资源
      operationId: createResource
      x-permission: "platform:resource:create"
      x-audit-action: platform:resource:create
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ResourceCreateRequest' } }
      responses:
        '201': { $ref: '#/components/responses/Resource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /permissions:
    get:
      tags: [Authorization]
      summary: 查询权限点
      operationId: listPermissions
      x-permission: "platform:permission:read"
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Keyword' } ]
      responses:
        '200': { $ref: '#/components/responses/PermissionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Authorization]
      summary: 创建权限点
      operationId: createPermission
      x-permission: "platform:permission:create"
      x-audit-action: platform:permission:create
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PermissionCreateRequest' } }
      responses:
        '201': { $ref: '#/components/responses/Permission' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /roles:
    get:
      tags: [Authorization]
      summary: 查询角色
      operationId: listRoles
      x-permission: "platform:role:read"
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/StatusFilter' } ]
      responses:
        '200': { $ref: '#/components/responses/RoleList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Authorization]
      summary: 创建角色
      operationId: createRole
      x-permission: "platform:role:create"
      x-audit-action: platform:role:create
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RoleCreateRequest' } }
      responses:
        '201': { $ref: '#/components/responses/Role' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /roles/{role_id}:
    parameters: [ { $ref: '#/components/parameters/RoleId' } ]
    get:
      tags: [Authorization]
      summary: 获取角色详情
      operationId: getRole
      x-permission: "platform:role:read"
      responses:
        '200': { $ref: '#/components/responses/Role' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Authorization]
      summary: 更新角色和角色权限
      operationId: updateRole
      x-permission: "platform:role:update"
      x-audit-action: platform:role:update
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RoleUpdateRequest' } }
      responses:
        '200': { $ref: '#/components/responses/Role' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /role-bindings:
    get:
      tags: [Authorization]
      summary: 查询角色绑定
      operationId: listRoleBindings
      x-permission: "platform:role-binding:read"
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/StatusFilter' } ]
      responses:
        '200': { $ref: '#/components/responses/RoleBindingList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Authorization]
      summary: 创建角色绑定
      operationId: createRoleBinding
      x-permission: "platform:role-binding:create"
      x-audit-action: platform:role-binding:create
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RoleBindingCreateRequest' } }
      responses:
        '201': { $ref: '#/components/responses/RoleBinding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /role-bindings/{binding_id}:
    parameters: [ { $ref: '#/components/parameters/BindingId' } ]
    patch:
      tags: [Authorization]
      summary: 更新角色绑定
      operationId: updateRoleBinding
      x-permission: "platform:role-binding:update"
      x-audit-action: platform:role-binding:update
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RoleBindingUpdateRequest' } }
      responses:
        '200': { $ref: '#/components/responses/RoleBinding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /authorization/check:
    post:
      tags: [Authorization]
      summary: 单次授权判定
      description: 供接入应用调用；主体默认取认证上下文，不接受调用方覆盖 tenant_id。
      operationId: checkAuthorization
      security: [ { applicationAuth: [] }, { cookieAuth: [] } ]
      x-permission: "platform:authorization:check"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AuthorizationCheckRequest' } }
      responses:
        '200':
          description: 返回允许/拒绝及匹配的策略版本。
          content:
            application/json: { schema: { $ref: '#/components/schemas/AuthorizationDecisionEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /authorization/batch-check:
    post:
      tags: [Authorization]
      summary: 批量授权判定
      operationId: batchCheckAuthorization
      security: [ { applicationAuth: [] }, { cookieAuth: [] } ]
      x-permission: "platform:authorization:check"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AuthorizationBatchCheckRequest' } }
      responses:
        '200':
          description: 顺序与输入 requests 保持一致。
          content:
            application/json: { schema: { $ref: '#/components/schemas/AuthorizationDecisionListEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /audit/events:
    get:
      tags: [Audit]
      summary: 分页查询审计事件
      description: 输出 DTO 仅含控制台已展示字段与变更摘要；不返回主体信息、request_id、trace_id。
      operationId: listAuditEvents
      x-permission: "platform:audit:view"
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/AuditApplicationFilter' }, { $ref: '#/components/parameters/AuditEnvironmentFilter' }, { $ref: '#/components/parameters/AuditActionFilter' }, { $ref: '#/components/parameters/AuditResultFilter' }, { $ref: '#/components/parameters/AuditRiskFilter' }, { $ref: '#/components/parameters/OccurredFrom' }, { $ref: '#/components/parameters/OccurredTo' } ]
      responses:
        '200': { $ref: '#/components/responses/AuditEventList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Audit]
      summary: 接收单条接入系统审计事件
      description: 接收数据可携带内部关联字段，但这些字段绝不进入控制台列表、详情或导出 DTO。event_id 用于幂等去重。
      operationId: ingestAuditEvent
      security: [ { applicationAuth: [] } ]
      x-permission: "platform:audit:ingest"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AuditEventInput' } }
      responses:
        '202':
          description: 已接收或幂等确认；后续持久化可异步处理。
          content:
            application/json: { schema: { $ref: '#/components/schemas/AuditReceiptEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  '/audit/events:batch':
    post:
      tags: [Audit]
      summary: 批量接收接入系统审计事件
      operationId: ingestAuditEventsBatch
      security: [ { applicationAuth: [] } ]
      x-permission: "platform:audit:ingest"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AuditEventBatchInput' } }
      responses:
        '202':
          description: 每条记录通过 event_id 幂等处理。
          content:
            application/json: { schema: { $ref: '#/components/schemas/AuditReceiptListEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /audit/events/{event_id}:
    parameters: [ { $ref: '#/components/parameters/AuditEventId' } ]
    get:
      tags: [Audit]
      summary: 获取审计事件详情
      description: 不返回主体信息、request_id、trace_id。敏感变更值按照字段策略脱敏。
      operationId: getAuditEvent
      x-permission: "platform:audit:view"
      responses:
        '200': { $ref: '#/components/responses/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /audit/export-jobs:
    post:
      tags: [Audit]
      summary: 创建审计导出任务
      operationId: createAuditExportJob
      x-permission: "platform:audit:export"
      x-audit-action: platform:audit:export.create
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AuditExportJobCreateRequest' } }
      responses:
        '202':
          description: 导出异步执行。
          content:
            application/json: { schema: { $ref: '#/components/schemas/AuditExportJobEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /audit/export-jobs/{job_id}:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [Audit]
      summary: 查询审计导出任务
      operationId: getAuditExportJob
      x-permission: "platform:audit:export"
      responses:
        '200': { $ref: '#/components/responses/AuditExportJob' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
