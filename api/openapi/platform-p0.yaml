      operationId: updateLoginPolicy
      x-capability-phase: P1
      x-permission: "platform:security-policy:update"
      x-audit-action: platform:security-policy:update
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { $ref: '#/components/responses/P1Settings' }, '501': { $ref: '#/components/responses/CapabilityNotEnabled' } }
  /security/locked-accounts:
    get:
      tags: [P1 Capability]
      summary: 查询锁定账号（P1）
      operationId: listLockedAccounts
      x-capability-phase: P1
