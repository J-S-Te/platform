  /auth/password:change:
    post:
      tags: [Auth]
      summary: 修改当前账号密码
      description: >-
        校验当前 ACTIVE HUMAN/LOCAL 账号的 current_password 后设置新强密码。成功后撤销该账号全部有效会话，
        并通过 Set-Cookie 清理当前浏览器 Cookie，用户必须重新登录；任何密码材料均不在响应、日志或审计中返回。
      operationId: changeOwnPassword
      x-permission: authenticated
      x-audit-action: auth.password.change
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } }
      responses:
        '200':
          description: 密码已修改且当前 Cookie 已清理。
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/EmptyEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

