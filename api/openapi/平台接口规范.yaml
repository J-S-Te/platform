        status: { type: string, enum: [OPEN, RESOLVED] }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        resolved_at: { $ref: '#/components/schemas/Timestamp' }
        resolved_by: { $ref: '#/components/schemas/ULID' }
        resolution_comment: { type: string, maxLength: 500 }
