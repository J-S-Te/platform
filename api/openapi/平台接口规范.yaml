      summary: 下载已完成的审计导出文件
      description: >-
        仅在任务状态为 SUCCEEDED 时返回本地 CSV 文件。下载请求必须使用同一租户的控制台 Cookie
        会话并拥有 platform:audit:export；服务端不会暴露文件系统路径或对象存储地址。
      operationId: downloadAuditExportJob
