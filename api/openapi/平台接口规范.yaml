openapi: 3.1.0
info:
  title: 基础能力平台 API
  version: 0.1.0-draft
  description: |
    基础能力平台的前后端接口草案。实现基线为 Go 模块化单体、MySQL、JWT Cookie 会话，
    所有时间均为 UTC RFC 3339 格式。本文件与 docs/前后端接口契约.md 共同作为联调契约；
    表结构和领域约束以 docs/核心模型与MySQL设计.md、docs/系统架构.md 为准。
servers:
  - url: /api/v1
    description: 平台 API 相对地址
x-contract-rules:
  dingtalk_qr_boundary: 钉钉 DINGTALK_QR 不是 OIDC 提供商；SuiteSecret/客户端密钥仅允许写入并以应用层加密保存，管理响应、日志和审计只能显示是否已配置。创建扫码会话时 state 只能在发起浏览器收到的 sdk_config 中返回，数据库只保存其 SHA-256 摘要和加密服务端载荷；authCode、上游令牌和原始外部身份标识不得写入 Cookie、日志、审计详情或响应。它们都不是平台 JWT。
  tenant_context: 所有受保护接口从认证会话或应用凭据解析 tenant_id；禁止由调用方传入 tenant_id 覆盖。
  write_operations: P0 写接口必须完成鉴权、租户隔离、参数校验、适用的 version 乐观锁和审计记录；登录与审计接收的认证/审计例外由各 operation 描述。
  time_format: UTC RFC 3339
  cross_application_login_target: platform_application_login_target 是 ApplicationEnvironment 下按 target_code 精确登记的统一登录业务落地目标；它仅供受控统一入口在已解析 tenant/application/environment 后服务端解析 target_uri。OAuth 的 redirect_uri 仍只属于 OAuth Client 的协议回调登记，两者不得互相替代、自动复制或由调用方提交 target_uri。当前公开 OIDC /authorize 不接收 target_code、target_uri、return_to 或 target_url；不得新增无认证的目标解析接口。
  login_target_management_and_resolution: 登录目标管理属于控制台控制面，需认证、授权、乐观锁与审计；运行时解析是内部受控服务契约：(tenant_id, application_id, environment_id, target_code) 只能解析到同租户、同应用、同环境且 ACTIVE 的单条记录。当前运行时未发布独立登录目标管理或解析 HTTP 路径，新增 HTTP 接口前必须先落地处理器、鉴权与 OpenAPI operation；不得以 target_uri 作为 OAuth redirect_uri 或开放重定向依据。
  application_identity: 机器接口仅接受由 /oauth2/token 的 client_credentials 签发的应用 Bearer Token；服务端必须校验签名、iss、aud、token_use、时效、scope 以及令牌与当前 OAuth Client/Application/Environment 的有效绑定。
  audit_ingestion: 审计接收必须使用应用身份、稳定 event_id 幂等、受限批量和 request_id/trace_id/correlation_id 三元关联；敏感数据不得进入请求体、审计存储或接收侧日志。
security:
  - cookieAuth: []
tags:
  - name: Bootstrap
  - name: Auth
  - name: Identity
  - name: Organization
  - name: Authorization
  - name: Audit
  - name: Security
  - name: Configuration
  - name: Settings
  - name: Dictionary
  - name: Application Registry
  - name: OIDC
  - name: 身份增强
  - name: P1 Capability
paths:
  /authorize:
    servers:
      - url: /
        description: OAuth 2.0 / OpenID Connect 根路径端点，不继承 /api/v1 前缀。
    get:
      tags: [OIDC]
      summary: 浏览器授权端点
      description: >-
        执行 OpenID Connect Authorization Code Flow。本端点只处理 OAuth Client 的协议回调：client_id 必须关联启用中的 ApplicationEnvironment，
        redirect_uri 必须与该客户端精确登记的回调地址相等。platform_application_login_target 是统一登录入口的业务落地目标登记，按
        (tenant_id, application_id, environment_id, target_code) 在服务端解析；它不是 OAuth redirect_uri，也不是本端点参数。本端点不接收
        target_code、target_uri、return_to、target_url、回调前缀匹配或其他调用方指定的跳转地址。平台内部为恢复已经校验的授权请求可以使用
        仅与平台会话绑定的恢复状态，但该状态不是接入方可调用的跳转参数，不能决定客户端回调或业务落地。state 是调用方生成的随机、不含个人信息的
        关联值，平台仅原样返回，不解析、不信任其内容。仅允许 PKCE S256，授权码、Cookie、access_token、refresh_token 和客户端密钥不得出现在
        URL、state 或平台重定向参数中。
      operationId: authorizeOIDCClient
      security: []
      x-security-boundary: 仅在 client_id、客户端状态、所属环境、精确 redirect_uri、scope 和 S256 PKCE 全部校验通过后，才可向该 OAuth Client 已登记的回调地址重定向；platform_application_login_target.target_uri 不得作为本端点回调依据，校验失败不得重定向到调用方提供的任何地址。
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string, maxLength: 255 } }
        - { name: redirect_uri, in: query, required: true, description: 必须与该 OAuth Client 已启用的登记值按完整字符串精确相等，禁止通配符、前缀或查询参数拼接。, schema: { type: string, format: uri, maxLength: 2048 } }
        - { name: scope, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 2048, description: 空格分隔范围；OIDC 登录必须包含 openid，全部范围必须已授权给该客户端。 } }
        - { name: state, in: query, required: true, description: 子系统保存的随机关联值；不得放入 URL、用户标识、密码、令牌、Cookie、密钥或可重放凭据。, schema: { type: string, minLength: 16, maxLength: 2048 } }
        - { name: nonce, in: query, schema: { type: string, maxLength: 255 } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
      responses:
        '302':
          description: 未登录时仅跳转平台登录页；成功时仅重定向到精确登记的 redirect_uri，并附带一次性 code 与原样 state。
          headers:
            Location: { schema: { type: string, format: uri } }
            Cache-Control: { schema: { type: string, example: no-store } }
        '400':
          description: 参数无效，或无法安全构造客户端重定向。
          content:
            application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } }
        '401':
          description: 会话无效时服务会按浏览器流程重定向，不向客户端透露会话细节。
  /oauth2/token:
    servers:
      - url: /
        description: OAuth 2.0 根路径端点，不继承 /api/v1 前缀。
    post:
      tags: [OIDC, Application Registry]
      summary: 签发或轮换 OAuth/OIDC 令牌
      description: >-
        支持 authorization_code、refresh_token 与 client_credentials。authorization_code 和 refresh_token：
        confidential 客户端使用 HTTP Basic（client_secret_basic），public 客户端仅以表单 client_id 认证；
        不接受 client_secret 表单字段。client_credentials 必须使用 HTTP Basic。授权码兑换必须提供精确 redirect_uri，
        且使用 PKCE 的授权码必须提供匹配的 code_verifier。Refresh Token 每次成功使用均会轮换。
      operationId: issueOAuthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token, client_credentials] }
                client_id: { type: string, maxLength: 255, description: 仅 public authorization_code / refresh_token 客户端可提供。 }
                code: { type: string, description: grant_type=authorization_code 时必填。 }
                redirect_uri: { type: string, format: uri, description: grant_type=authorization_code 时必须与授权请求完全一致。 }
                code_verifier: { type: string, minLength: 43, maxLength: 128, description: 使用 PKCE 的 authorization_code 时必填。 }
                refresh_token: { type: string, description: grant_type=refresh_token 时必填。 }
                scope: { type: string, description: client_credentials 时为申请范围；授权码和刷新授权不会通过此字段扩大权限。 }
      responses:
        '200':
          description: OAuth 2.0 令牌响应；不使用平台通用响应信封。
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
            Pragma: { schema: { type: string, example: no-cache } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/OAuthTokenResponse' } }
        '400':
          description: 无效请求、已消费/失效授权码、无效 Refresh Token、PKCE 校验失败、未授权授权类型或不允许的范围。
          content:
            application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } }
        '401':
          description: 客户端认证失败。
          headers:
            WWW-Authenticate: { schema: { type: string, example: 'Basic realm="oauth2/token"' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } }
        '500':
          description: 令牌签发内部错误。
          content:
            application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } }
  /oauth2/revoke:
    servers:
      - url: /
        description: OAuth 2.0 根路径端点，不继承 /api/v1 前缀。
    post:
      tags: [OIDC]
      summary: 按 RFC 7009 撤销令牌
      description: >-
        仅接受 confidential 客户端的 HTTP Basic 认证。支持 access_token 与 refresh_token；对未知、过期或已经撤销的令牌仍返回 200，
        避免泄露令牌是否存在。撤销 Refresh Token 会撤销整个 Token Family。
      operationId: revokeOAuthToken
      security: [ { clientCredentialsBasic: [] } ]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 8192 }
                token_type_hint: { type: string, enum: [access_token, refresh_token] }
      responses:
        '200':
          description: 已完成撤销处理；空响应。
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
        '400':
          content:
            application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } }
        '401':
          headers:
            WWW-Authenticate: { schema: { type: string, example: 'Basic realm="oauth2/token"' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } }
  /.well-known/openid-configuration:
    servers:
      - url: /
        description: OpenID Connect 根路径端点，不继承 /api/v1 前缀。
    get:
      tags: [OIDC]
      summary: 获取 OpenID Provider Discovery 文档
      operationId: getOIDCDiscoveryDocument
      security: []
      responses:
        '200':
          description: 当前 OIDC 发行方、端点、支持的授权方式、PKCE 方法和签名算法。
          content:
            application/json: { schema: { $ref: '#/components/schemas/OIDCDiscoveryDocument' } }
  /oauth2/jwks:
    servers:
      - url: /
        description: OAuth 2.0 / OpenID Connect 根路径端点，不继承 /api/v1 前缀。
    get:
      tags: [OIDC]
      summary: 获取 OIDC JWT 验签公钥集合
      operationId: getOIDCJWKS
      security: []
      responses:
        '200':
          description: Ed25519 公钥的 JWKS 表示。
          content:
            application/json: { schema: { $ref: '#/components/schemas/OIDCJWKS' } }
  /oauth2/userinfo:
    servers:
      - url: /
        description: OAuth 2.0 / OpenID Connect 根路径端点，不继承 /api/v1 前缀。
    get:
      tags: [OIDC]
      summary: 查询 OIDC UserInfo
      description: 需要本 OIDC 发行方签发、未撤销且包含 openid scope 的终端用户 Access Token；profile 与 email 字段按 scope 最小化返回。
      operationId: getOIDCUserInfo
      security: [ { oidcBearer: [] } ]
      responses:
        '200':
          description: 用户声明。
          content:
            application/json: { schema: { $ref: '#/components/schemas/OIDCUserInfo' } }
        '401':
          headers:
            WWW-Authenticate: { schema: { type: string, example: 'Bearer realm="oauth2/userinfo", error="invalid_token"' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } }
    post:
      tags: [OIDC]
      summary: 查询 OIDC UserInfo
      description: "与 GET 相同；Access Token 仍仅从 Authorization: Bearer 请求头读取。"
      operationId: postOIDCUserInfo
      security: [ { oidcBearer: [] } ]
      responses:
        '200':
          description: 用户声明。
          content:
            application/json: { schema: { $ref: '#/components/schemas/OIDCUserInfo' } }
        '401':
          headers:
            WWW-Authenticate: { schema: { type: string, example: 'Bearer realm="oauth2/userinfo", error="invalid_token"' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } }
  /oauth2/logout:
    servers:
      - url: /
        description: OpenID Connect 根路径端点，不继承 /api/v1 前缀。
    get:
      tags: [OIDC]
      summary: RP-initiated Logout
      description: >-
        尝试撤销当前平台 Cookie 会话并清理 Cookie。仅当 post_logout_redirect_uri 是客户端精确登记的回调地址，
        且提供了有效 id_token_hint 或相同客户端的 client_id 时才外部重定向；其他情况回到平台登录页。
      operationId: getOIDCLogout
      security: []
      parameters:
        - { name: id_token_hint, in: query, schema: { type: string } }
        - { name: client_id, in: query, schema: { type: string, maxLength: 255 } }
        - { name: post_logout_redirect_uri, in: query, schema: { type: string, format: uri, maxLength: 2048 } }
        - { name: state, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        '302':
          description: 已完成退出；重定向到验证后的客户端地址或平台登录页。
          headers:
            Location: { schema: { type: string, format: uri } }
            Set-Cookie: { schema: { type: string } }
    post:
      tags: [OIDC]
      summary: RP-initiated Logout
      description: 与 GET 相同；参数可通过 application/x-www-form-urlencoded 提交。
      operationId: postOIDCLogout
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token_hint: { type: string }
                client_id: { type: string, maxLength: 255 }
                post_logout_redirect_uri: { type: string, format: uri, maxLength: 2048 }
                state: { type: string, maxLength: 2048 }
      responses:
        '303':
          description: 已完成退出；重定向到验证后的客户端地址或平台登录页。
          headers:
            Location: { schema: { type: string, format: uri } }
            Set-Cookie: { schema: { type: string } }
  /iam/bootstrap/first-super-admin:
    post:
      tags: [Bootstrap]
      summary: 初始化首个超级管理员
      description: >-
        仅用于首次部署。请求必须携带服务端配置的 X-Bootstrap-Token；当 IAM_BOOTSTRAP_TOKEN
        为空时接口返回 404。成功后必须清空该配置并重启服务。此接口不使用 Cookie 会话，且仅在默认
        租户尚未创建 iam_bootstrap_state 时允许执行。
      security: []
      operationId: bootstrapFirstSuperAdmin
      x-audit-action: platform:iam.bootstrap.first-super-admin
      parameters:
        - in: header
          name: X-Bootstrap-Token
          required: true
          schema: { type: string, minLength: 32 }
          description: 仅由受控部署流程提供的一次性初始化令牌；不得写入前端代码、浏览器持久化存储或日志。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BootstrapFirstSuperAdminRequest' }
      responses:
        '201':
          description: 首个超级管理员已初始化；响应不返回密码、密码散列、算法参数或初始化令牌。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapFirstSuperAdminEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/dingtalk/qr-sessions:
    post:
      tags: [Auth, Identity]
      summary: 创建钉钉第三方企业应用扫码会话
      description: >-
        匿名创建一次性钉钉扫码会话。服务端校验指定租户内 DINGTALK_QR 提供商已启用，生成不可预测 state、
        浏览器绑定值和过期时间；state 仅作为钉钉授权回调关联值，绝不作为平台 JWT、平台会话或业务系统令牌。
        响应固定返回 dingtalk_frame 呈现方式及供官方 DTFrameLogin SDK 使用的 sdk_config；state 只会返回给发起请求的浏览器，
        数据库仅保存其 SHA-256 摘要和加密的服务端载荷。仅允许管理员预先绑定的外部身份登录；本接口不创建用户、账号、任职或角色绑定。
        return_to 只能是本平台相对路径，禁止绝对 URL、协议相对 URL、回退跳转和外部域名。
      security: []
      operationId: createDingTalkQRSession
      x-error-codes:
        - AUTH_DINGTALK_PROVIDER_NOT_AVAILABLE
        - PLATFORM_VALIDATION_ERROR
        - PLATFORM_INTERNAL_ERROR
      x-audit-action: auth.dingtalk_qr_session.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DingTalkQRSessionCreateRequest' }
      responses:
        '201':
          description: 扫码会话已创建。服务端同时通过 Set-Cookie 写入短时、HttpOnly 的浏览器绑定 Cookie；该 Cookie 不是平台登录会话。
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 短时 HttpOnly; Secure（生产环境）; SameSite=Lax 的扫码浏览器绑定 Cookie，不包含 state、授权码、SuiteSecret/客户端密钥或平台 JWT。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DingTalkQRSessionEnvelope' }
        '404':
          description: 租户或可用于扫码的钉钉提供商不存在、未启用或不可用；响应不得暴露提供商密钥、内部配置或租户枚举细节。
          content:
            application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500':
          description: 未分类服务端异常；响应不得包含提供商密钥、state、授权码、上游令牌、原始外部身份标识或内部错误详情。
          content:
            application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }

  /auth/dingtalk/callback:
    get:
      tags: [Auth, Identity]
      summary: 处理钉钉第三方企业应用授权回调
      description: >-
        钉钉浏览器回调入口，不是前端 AJAX JSON 接口。服务端原子校验 state、短时 HttpOnly 浏览器绑定、有效期和一次性消费状态，
        再由服务器适配器使用已加密保存的 SuiteSecret/客户端密钥换取并校验身份。回调一律返回 303 See Other：普通登录成功跳转至经校验的受限 return_to；
        需要 MFA 时跳转至 /login?dingtalk_mfa=1&return_to=...；失败跳转至 /login?dingtalk_error=<稳定错误码>。不返回 HTML、跨窗口消息桥接内容、JSON 凭据、
        授权码、SuiteSecret/客户端密钥、上游令牌、原始钉钉身份或平台 JWT。仅在 DINGTALK_QR 提供商、预绑定外部身份和本地账号均有效时进入既有会话签发；
        MFA 分支仅设置短时预认证 HttpOnly Cookie，不设置平台会话 Cookie。
      security: []
      operationId: completeDingTalkQRCallback
      x-error-codes:
        - AUTH_DINGTALK_CALLBACK_INVALID
        - AUTH_DINGTALK_IDENTITY_VERIFICATION_FAILED
        - AUTH_DINGTALK_EXTERNAL_IDENTITY_NOT_BOUND
        - AUTH_DINGTALK_PROVIDER_DISABLED
        - AUTH_DINGTALK_QR_SESSION_INVALID
        - PLATFORM_INTERNAL_ERROR
        - PLATFORM_METHOD_NOT_ALLOWED
      x-audit-action: auth.dingtalk_qr_callback
      x-audit-boundary: >-
        仅在回调可建立可信 tenant_id 与 provider_code 生命周期上下文时写入租户审计事件；无法建立该上下文的早期拒绝仅写安全日志，
        日志不含 state、授权码、令牌、SuiteSecret/客户端密钥或原始身份标识。
      parameters:
        - name: state
          in: query
          required: true
          description: 一次性扫码会话关联值。原文只在发起浏览器的 sdk_config 与本次钉钉回调中出现；数据库仅保存 SHA-256 摘要，且不得记录到日志、审计详情或 Cookie。
          schema: { type: string, minLength: 32, maxLength: 512 }
          x-sensitive: true
        - name: authCode
          in: query
          required: false
          description: 当前钉钉授权码主字段；敏感，不得写入日志、审计、响应或 Cookie。
          schema: { type: string, minLength: 1, maxLength: 4096 }
          x-sensitive: true
        - name: code
          in: query
          required: false
          deprecated: true
          description: 兼容旧字段；同时提交 authCode 时两者必须相同。敏感，不得记录或回显。
          schema: { type: string, minLength: 1, maxLength: 4096 }
          x-sensitive: true
        - name: error
          in: query
          required: false
          description: 钉钉拒绝授权时的协议错误分类；不得向终端用户透传内部详情。
          schema: { type: string, maxLength: 128 }
      responses:
        '303':
          description: >-
            回调处理后的唯一浏览器响应。普通成功的 Location 为服务端校验后的受限 return_to；需 MFA 的 Location 为
            /login?dingtalk_mfa=1&return_to=...；失败的 Location 为 /login?dingtalk_error=<稳定错误码>。非 GET 请求同样以 303 跳转
            /login?dingtalk_error=PLATFORM_METHOD_NOT_ALLOWED。Location 不得携带 state、授权码、SuiteSecret/客户端密钥、上游令牌、原始钉钉身份、
            MFA 预认证凭据或平台 JWT。
          headers:
            Location:
              schema: { type: string }
              description: 服务端构造的同源受限跳转地址；不得由钉钉回调参数直接决定。
            Set-Cookie:
              schema: { type: string }
              description: 进入回调服务处理、执行 state 校验前，回调会清除固定 SameSite=Lax 的扫码浏览器绑定 Cookie。普通成功时写入按 AUTH_SESSION_COOKIE_* 配置的会话 Cookie；MFA 时仅写入按既有配置的预认证 Cookie。方法、查询长度或 authCode 冲突等早期拒绝不依赖该清除，浏览器绑定 Cookie 由短时过期时间失效。
            Cache-Control: { schema: { type: string, example: no-store } }
            Referrer-Policy: { schema: { type: string, example: no-referrer } }
  /auth/login:
    post:
      tags: [Auth]
      summary: 账号密码登录
      description: 校验 Argon2id 凭据。未启用 MFA 时签发 HttpOnly JWT Cookie 并创建 iam_session；已启用 MFA 时返回短时预认证凭据，前端必须继续调用 MFA 验证接口，不能自行创建或保存会话。无需前端传入 tenant_id。
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功；响应同时通过 Set-Cookie 下发会话 Cookie。
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly; Secure（生产环境）; SameSite=Lax 的会话 Cookie。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '202':
          description: 密码校验成功但账号已启用 MFA；不下发 Cookie，前端必须立即使用 data.pre_authentication_credential 调用 MFA 验证接口。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MFALoginRequiredEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '423': { $ref: '#/components/responses/AccountLocked' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login/mfa:verify:
    post:
      tags: [Auth]
      summary: 完成密码登录的 MFA 验证
      description: 使用密码登录成功后返回的一次性预认证凭据和 TOTP 或恢复码完成登录。验证成功后才下发 HttpOnly 会话 Cookie；预认证凭据、验证码和恢复码不得持久化或写入日志。
      security: []
      operationId: verifyMFALogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFALoginVerificationRequest' }
      responses:
        '200':
          description: MFA 验证成功，已下发会话 Cookie。
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly; Secure（生产环境）; SameSite=Lax 的会话 Cookie。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MFALoginVerificationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: 预认证凭据或 MFA 验证窗口已过期。 }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/token/refresh:
    post:
      tags: [Auth]
      summary: 刷新当前会话
      operationId: refreshSession
      x-permission: authenticated
      responses:
        '200':
          description: 会话仍有效，已续发 Cookie。
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出当前会话
      operationId: logout
      x-permission: authenticated
      x-audit-action: auth.logout
      responses:
        '200':
          description: 当前 iam_session 已撤销且 Cookie 已清理。
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/EmptyEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/me:
