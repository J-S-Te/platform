  /audit/events:
    get:
      tags: [Audit]
      summary: 分页查询审计事件
      description: 输出 DTO 仅含控制台已展示字段与变更摘要；不返回主体信息、request_id、trace_id、correlation_id。
      operationId: listAuditEvents
      x-permission: "platform:audit:view"
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/AuditApplicationFilter' }, { $ref: '#/components/parameters/AuditEnvironmentFilter' }, { $ref: '#/components/parameters/AuditActionFilter' }, { $ref: '#/components/parameters/AuditResultFilter' }, { $ref: '#/components/parameters/AuditRiskFilter' }, { $ref: '#/components/parameters/OccurredFrom' }, { $ref: '#/components/parameters/OccurredTo' } ]
      responses:
        '200': { $ref: '#/components/responses/AuditEventList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Audit]
      summary: 接收单条接入系统审计事件
      description: >-
        子系统后端专用接口。仅接受由 /oauth2/token 的 client_credentials 获取、且具有 audit.ingest scope 的应用 Bearer Token。
        令牌的 tenant/application/environment 为接收边界，application_code、environment_code 必须在请求体中显式提供并与令牌精确一致；
        不允许调用方指定 tenant_id、client_id 或覆盖令牌绑定。event_id 在同一 application_id 内永久稳定，重复提交相同 event_id 返回 DUPLICATE，
        不创建第二条事件。单条请求头三元组必须与请求体 request_id、trace_id、correlation_id 一致；请求体和传输层均不得包含敏感凭据。
      operationId: ingestAuditEvent
      security: [ { applicationAuth: [] } ]
      x-application-scope: "audit.ingest"
      x-idempotency: "同一 application_id + event_id 唯一；相同键重复提交返回 202/DUPLICATE，禁止以请求体哈希替代 event_id。"
      x-security-boundary: "应用身份仅能向令牌绑定的租户、应用和环境写入审计；不得使用控制台 Cookie、用户 Bearer Token 或前端直连调用。"
      parameters: [ { $ref: '#/components/parameters/AuditRequestID' }, { $ref: '#/components/parameters/AuditTraceparent' }, { $ref: '#/components/parameters/AuditCorrelationID' } ]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AuditEventInput' } }
      responses:
        '202':
          description: 已接收或幂等确认；响应中每项状态为 ACCEPTED 或 DUPLICATE。
          content:
            application/json: { schema: { $ref: '#/components/schemas/AuditReceiptEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
  '/audit/events:batch':
    post:
      tags: [Audit]
      summary: 批量接收接入系统审计事件
      description: >-
        子系统后端专用接口，认证和租户/应用/环境边界与单条接收完全一致。一次最多 100 条事件，整个 HTTP 请求体最大 256 KiB。
        每条事件必须拥有独立、稳定的 event_id 以及 request_id、trace_id、correlation_id。请求头三元组用于本次 Outbox 投递动作，
        不得覆盖或替换每条事件原始三元组。接收端先校验整个批次；任一事件不合法即返回 422，不写入任何事件或批次回执。
        全部合法时，事件去重结果和内部 audit_ingestion_receipt 回执在同一事务写入；重复事件为成功的逐项 DUPLICATE，并累计回执 duplicate_count。
      operationId: ingestAuditEventsBatch
      security: [ { applicationAuth: [] } ]
      x-application-scope: "audit.ingest"
      x-idempotency: "逐项按同一 application_id + event_id 去重；响应顺序必须与 events 输入顺序一致。"
      x-batch-limit: "1 至 100 条，HTTP body 最大 256 KiB。"
      x-batch-atomicity: "所有事件先校验；全部合法时在一个事务中写入事件/去重结果与内部 audit_ingestion_receipt。任一校验或存储失败均不产生部分事件或投递回执。"
      x-delivery-receipt: "audit_ingestion_receipt 记录本次投递请求头三元组、event_count、accepted_count、duplicate_count 和 COMPLETED 状态；当前不提供其对外查询或管理 operation。"
      x-security-boundary: "仅后端服务可调用；禁止浏览器、前端代码和控制台 Cookie 使用该接口。"
      parameters: [ { $ref: '#/components/parameters/AuditRequestID' }, { $ref: '#/components/parameters/AuditTraceparent' }, { $ref: '#/components/parameters/AuditCorrelationID' } ]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AuditEventBatchInput' } }
      responses:
        '202':
          description: 全部事件校验通过后，按 event_id 幂等处理并按输入顺序返回 ACCEPTED 或 DUPLICATE；内部批次投递回执不在响应中返回。
          content:
            application/json: { schema: { $ref: '#/components/schemas/AuditReceiptListEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /audit/events/{event_id}:
    parameters: [ { $ref: '#/components/parameters/AuditEventId' } ]
    get:
      tags: [Audit]
      summary: 获取审计事件详情
      description: 不返回主体信息、request_id、trace_id、correlation_id。敏感变更值按照字段策略脱敏。
