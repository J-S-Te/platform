      responses:
        '201':
          description: 客户端密钥已创建。
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
            Pragma: { schema: { type: string, example: no-cache } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/OAuthClientCredentialSecretEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /oauth-clients/{oauth_client_id}/credentials:rotate:
    parameters:
      - { $ref: '#/components/parameters/OAuthClientId' }
    post:
      tags: [Application Registry]
      summary: 轮换 OAuth 客户端密钥
      description: 新旧密钥重叠期最长 30 天；密钥明文仅本响应显示一次。
      operationId: rotateOAuthClientCredential
      x-mfa-step-up: required
      parameters: [ { $ref: '#/components/parameters/MFAStepUpGrant' } ]
      x-permission: "platform:oauth-client-credential:rotate"
      x-audit-action: platform:oauth-client-credential:rotate
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OAuthClientCredentialRotateRequest' } }
      responses:
        '201':
          description: 客户端密钥已轮换。
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
            Pragma: { schema: { type: string, example: no-cache } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/OAuthClientCredentialSecretEnvelope' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /oauth-clients/{oauth_client_id}/credentials/{credential_id}:disable:
    parameters:
      - { $ref: '#/components/parameters/OAuthClientId' }
      - { $ref: '#/components/parameters/OAuthClientCredentialId' }
    post:
      tags: [Application Registry]
      summary: 禁用单个 OAuth 客户端密钥
      operationId: disableOAuthClientCredential
      x-mfa-step-up: required
      parameters: [ { $ref: '#/components/parameters/MFAStepUpGrant' } ]
      x-permission: "platform:oauth-client-credential:disable"
      x-audit-action: platform:oauth-client-credential:disable
      responses:
        '204': { description: 客户端密钥已禁用。 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /oauth2/par:
    servers:
      - url: /
        description: OAuth 2.0 根路径端点，不继承 /api/v1 前缀。
    post:
      tags: [OIDC]
      summary: 推送授权请求（PAR）
      description: >-
        按 RFC 9126 保存一次性授权请求并返回 request_uri。支持 client_secret_basic 或已登记公钥的 private_key_jwt；
        可同时提交签名 JAR request 对象。请求 URI 只能由同一客户端在有效期内消费一次。
      operationId: pushAuthorizationRequest
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, response_type]
              properties:
                client_id: { type: string, maxLength: 255 }
                client_secret: { type: string, writeOnly: true, maxLength: 4096 }
                client_assertion_type: { type: string, example: 'urn:ietf:params:oauth:client-assertion-type:jwt-bearer' }
                client_assertion: { type: string, writeOnly: true, maxLength: 16384 }
                response_type: { type: string, enum: [code] }
                redirect_uri: { type: string, format: uri, maxLength: 2048 }
                scope: { type: string, maxLength: 2048 }
                state: { type: string, maxLength: 2048 }
                nonce: { type: string, maxLength: 255 }
                code_challenge: { type: string, minLength: 43, maxLength: 128 }
                code_challenge_method: { type: string, enum: [S256, plain] }
                request: { type: string, writeOnly: true, maxLength: 16384, description: 已登记客户端公钥签名的 JAR。 }
      responses:
        '201':
          description: 已保存一次性请求。
          content:
            application/json:
              schema:
                type: object
                required: [request_uri, expires_in]
                properties:
                  request_uri: { type: string, example: 'urn:ietf:params:oauth:request_uri:01H...' }
                  expires_in: { type: integer, minimum: 1, example: 90 }
        '400': { description: 授权参数、范围、PKCE 或 JAR 无效。 }
        '401': { description: 客户端认证失败。 }
  /oauth2/consent:
    servers:
      - url: /
        description: OIDC 浏览器会话根路径端点。
    get:
      tags: [OIDC]
      summary: 查询当前用户对客户端范围的同意状态
      operationId: getOIDCConsent
      security: [ { cookieAuth: [] } ]
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string, maxLength: 255 } }
        - { name: scope, in: query, required: true, schema: { type: string, maxLength: 2048 } }
      responses:
        '200':
          description: 当前同意判定。
          content:
            application/json:
              schema:
                type: object
                properties:
                  required: { type: boolean }
                  granted: { type: boolean }
                  scope: { type: string }
        '401': { description: 未登录。 }
    delete:
      tags: [OIDC]
      summary: 撤销当前用户对一个客户端的同意
      description: 仅接受与 OIDC_ISSUER 同源的浏览器 Origin。
      operationId: revokeOIDCConsent
      security: [ { cookieAuth: [] } ]
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string, maxLength: 255 } }
      responses:
        '204': { description: 已撤销或原本不存在。 }
        '401': { description: 未登录。 }
        '403': { description: Origin 不匹配。 }
  /oauth2/consent/grant:
    servers:
      - url: /
        description: OIDC 浏览器会话根路径端点。
    post:
      tags: [OIDC]
      summary: 授予当前用户对客户端范围的同意
      description: 仅接受与 OIDC_ISSUER 同源的浏览器 Origin。
      operationId: grantOIDCConsent
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, scope]
              properties:
                client_id: { type: string, maxLength: 255 }
                scope: { type: string, maxLength: 2048 }
      responses:
        '204': { description: 已记录同意。 }
        '401': { description: 未登录。 }
        '403': { description: Origin 不匹配。 }
  /identity-providers:
    get:
      tags: [Identity]
      summary: 分页查询外部身份提供商本地配置
      description: 返回可管理的提供商摘要。响应只返回 client_secret_configured 等配置状态，绝不返回明文、密文、散列或密钥版本内容。对于 DINGTALK_QR，client_id 的钉钉语义为 SuiteKey；client_secret 的钉钉语义为 SuiteSecret/客户端密钥。
      operationId: listIdentityProviders
      security: [ { cookieAuth: [] } ]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 提供商分页列表。 }
        '403': { description: '缺少 platform:identity-provider:read。' }
    post:
      tags: [Identity]
      summary: 创建外部身份提供商本地配置
      description: >-
        OIDC 与 DINGTALK_QR 使用不同校验边界：OIDC 必须具备 issuer、client_id、client_secret、HTTPS callback_uri，
        授权范围必须包含 openid，并以发行方发现/JWKS 完成令牌校验；DINGTALK_QR 不得伪装为 OIDC，issuer 必须为空，
        必须具备 client_id、client_secret、HTTPS callback_uri 和钉钉所需权限配置。第三方企业应用（ISV）场景中，
        client_id 对应钉钉 SuiteKey，client_secret 对应 SuiteSecret/客户端密钥；app_key/app_secret 仅是兼容性术语，不是当前 HTTP JSON 字段。
        密钥只允许写入，服务端采用应用层加密保存，管理响应及审计日志只能显示 client_secret_configured。
      operationId: createIdentityProvider
      x-audit-action: identity_provider.create
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityProviderCreateRequest' }
      responses:
        '201':
          description: 已创建；响应不返回任何密钥。
          content:
            application/json: { schema: { $ref: '#/components/schemas/IdentityProviderEnvelope' } }
        '403': { description: '缺少 platform:identity-provider:create。' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /identity-providers/{provider_id}:
    parameters:
      - { name: provider_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    get:
      tags: [Identity]
      summary: 查询外部身份提供商本地配置
      operationId: getIdentityProvider
      security: [ { cookieAuth: [] } ]
      responses:
        '200':
          description: 提供商详情；绝不返回 client_secret、SuiteSecret/客户端密钥、secret_ref、密文、散列或上游访问令牌。
          content:
            application/json: { schema: { $ref: '#/components/schemas/IdentityProviderEnvelope' } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Identity]
      summary: 更新外部身份提供商配置或状态
      description: 更新密钥时只提交新值；未提交密钥即保留原值。DINGTALK_QR 被禁用后不得新建扫码会话或完成登录；已存在的绑定记录不自动删除。
      operationId: updateIdentityProvider
      x-audit-action: identity_provider.update
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityProviderUpdateRequest' }
      responses:
        '200':
          description: 已更新；响应只返回密钥是否配置。
          content:
            application/json: { schema: { $ref: '#/components/schemas/IdentityProviderEnvelope' } }
        '403': { description: '缺少 platform:identity-provider:update。' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{user_id}/external-identities:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Identity]
      summary: 查询用户外部身份绑定
      operationId: listUserExternalIdentities
      security: [ { cookieAuth: [] } ]
      responses:
        '200': { description: 绑定列表；绝不返回 external_subject。 }
    post:
      tags: [Identity]
      summary: 绑定已验证的外部主体
      description: 当前为管理控制面；调用方必须先通过可信提供商适配器验证 external_subject。DINGTALK_QR 只允许管理员预先绑定，服务端仅保存稳定外部标识的不可逆哈希；绝不回显或记录原文，不自动创建用户、账号、任职或角色。
      operationId: bindUserExternalIdentity
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_code, external_subject]
              properties:
                provider_code: { type: string, maxLength: 64 }
                external_subject: { type: string, writeOnly: true, maxLength: 512 }
      responses:
        '201': { description: 已绑定；绝不回显 external_subject。 }
  /users/{user_id}/external-identities/{binding_id}:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string } }
      - { name: binding_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Identity]
      summary: 解除用户外部身份绑定
      operationId: unbindUserExternalIdentity
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: 已解除绑定。 }
        '409': { description: 版本冲突。 }
  /mfa/totp:prepare:
    post:
      tags: [Identity]
      summary: 为当前账号准备 TOTP 注册
      description: 注册密钥和 provisioning_uri 仅在本响应返回一次，前端不得落盘或记录日志。
      operationId: prepareCurrentAccountTOTP
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 128 }
      responses:
        '201': { description: 返回 factor_id、secret、provisioning_uri 和 expires_at。 }
  /mfa/totp:confirm:
    post:
      tags: [Identity]
      summary: 确认当前账号 TOTP 注册
      description: 恢复码仅在成功响应中返回一次。
      operationId: confirmCurrentAccountTOTP
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor_id, code]
              properties:
                factor_id: { type: string }
                code: { type: string, minLength: 6, maxLength: 16 }
      responses:
        '200': { description: 返回因子信息和一次性 recovery_codes。 }
  /mfa/totp:disable:
    post:
      tags: [Identity]
      summary: 停用当前账号的 TOTP 因子
      operationId: disableCurrentAccountTOTP
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor_id, version]
              properties:
                factor_id: { type: string }
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: 已停用。 }
        '409': { description: 版本冲突。 }
  /mfa/challenges:
    post:
      tags: [Identity]
      summary: 为当前账号创建 TOTP 挑战
      operationId: createCurrentAccountMFAChallenge
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor_id]
              properties:
                factor_id: { type: string }
      responses:
        '201': { description: 返回一次性 challenge、到期时间和最大尝试次数。 }
  /mfa/challenges:verify:
    post:
      tags: [Identity]
      summary: 验证当前会话创建的 MFA 挑战
      description: 该接口只用于当前已认证会话的通用 MFA 挑战；密码登录的 MFA 完成流程使用 /auth/login/mfa:verify。所有身份边界均从服务端会话或预认证凭据推导，客户端不得提交 tenant_id 或 account_id。
      operationId: verifyMFAChallenge
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string, writeOnly: true, minLength: 32, maxLength: 512 }
                code: { type: string, writeOnly: true, minLength: 6, maxLength: 64 }
      responses:
        '200': { description: 验证成功。 }
        '401': { description: 验证码、恢复码或会话无效。 }
  /mfa/step-up/challenges:
    post:
      tags: [Security]
      summary: 创建高风险操作 MFA 二次验证挑战
      description: 基于当前已认证会话和指定的活动 MFA 因子创建一次性 challenge；challenge 仅返回一次，客户端不得记录或持久化。
      operationId: createMFAStepUpChallenge
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFAStepUpChallengeRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MFAStepUpChallengeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /mfa/step-up/challenges:verify:
    post:
      tags: [Security]
      summary: 验证高风险操作 MFA 挑战
      description: 验证成功后返回仅可用于当前会话、两分钟内且只能使用一次的 MFA 二次验证授权。将该授权放入 X-MFA-Step-Up-Grant 请求头后调用目标高风险接口。
      operationId: verifyMFAStepUpChallenge
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFAStepUpVerificationRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MFAStepUpVerificationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: MFA 二次验证挑战已过期。 }
        '422': { $ref: '#/components/responses/ValidationError' }

  /oauth-clients/{oauth_client_id}/post-logout-redirect-uris:
    parameters:
      - { name: oauth_client_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Application Registry]
      summary: 查询独立登出后回调地址集合
      operationId: getOAuthClientPostLogoutRedirectURIs
      security: [ { cookieAuth: [] } ]
      responses:
        '200': { description: 返回 oauth_client_id、version 和 post_logout_redirect_uris。 }
    put:
      tags: [Application Registry]
      summary: 乐观锁替换独立登出后回调地址集合
      operationId: updateOAuthClientPostLogoutRedirectURIs
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_logout_redirect_uris, version]
              properties:
                post_logout_redirect_uris:
                  type: array
                  items: { type: string, format: uri }
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: 已更新。 }
        '409': { description: 版本冲突。 }
  /oauth-clients/{oauth_client_id}/jwks:
    parameters:
      - { name: oauth_client_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Application Registry]
      summary: 查询客户端注册公钥
      operationId: getOAuthClientJWKs
      security: [ { cookieAuth: [] } ]
      responses:
        '200': { description: 返回 oauth_client_id、version 和 public_jwks。 }
    put:
      tags: [Application Registry]
      summary: 乐观锁替换客户端注册公钥
      description: 仅接受公钥 JWK；private_key_jwt 和 JAR 使用这些公钥验证签名。
      operationId: updateOAuthClientJWKs
      x-mfa-step-up: required
      parameters: [ { $ref: '#/components/parameters/MFAStepUpGrant' } ]
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_jwks, version]
              properties:
                public_jwks:
                  type: array
                  items:
                    type: object
                    required: [key_id, public_jwk, algorithm]
                    properties:
                      key_id: { type: string, maxLength: 255 }
                      public_jwk: { type: object, additionalProperties: true }
                      algorithm: { type: string, maxLength: 32 }
                      valid_from: { type: string, format: date-time }
                      valid_until: { type: string, format: date-time }
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: 已更新。 }
        '409': { description: 版本冲突。 }
  /applications/{application_id}/environments/{environment_id}/login-targets:
    parameters:
      - { name: application_id, in: path, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
      - { name: environment_id, in: path, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
    get:
      tags: [Application Registry]
      summary: 分页查询跨应用统一登录目标
      operationId: listApplicationLoginTargets
      security: [ { cookieAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
      responses:
        '200': { description: 返回当前租户、应用和环境边界内的登录目标。 }
    post:
      tags: [Application Registry]
      summary: 创建跨应用统一登录目标
      description: target_uri 必须是无用户凭据的 HTTPS 绝对地址，并与 OAuth redirect_uri 独立管理。
      operationId: createApplicationLoginTarget
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_code, name, target_uri, status]
              properties:
                target_code: { type: string, minLength: 1, maxLength: 64 }
                name: { type: string, minLength: 1, maxLength: 128 }
                target_uri: { type: string, format: uri, maxLength: 2048, pattern: '^https://' }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '201': { description: 登录目标已创建。 }
        '409': { description: 目标编码或地址冲突。 }
  /applications/{application_id}/environments/{environment_id}/login-targets/{login_target_id}:
    parameters:
      - { name: application_id, in: path, required: true, schema: { type: string } }
      - { name: environment_id, in: path, required: true, schema: { type: string } }
      - { name: login_target_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Application Registry]
      summary: 查询单个跨应用登录目标
      operationId: getApplicationLoginTarget
      security: [ { cookieAuth: [] } ]
      responses:
        '200': { description: 返回登录目标详情。 }
        '404': { description: 目标不存在或不属于当前边界。 }
    patch:
      tags: [Application Registry]
      summary: 乐观锁更新跨应用登录目标
      operationId: updateApplicationLoginTarget
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, target_uri, status, version]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                target_uri: { type: string, format: uri, maxLength: 2048, pattern: '^https://' }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: 登录目标已更新。 }
        '409': { description: 版本冲突。 }

  /notifications/templates:
    get:
      tags: [Notification]
      summary: 查询站内信模板
      operationId: listNotificationTemplates
      security: [ { cookieAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses: { '200': { description: 返回模板及当前版本。 } }
    post:
      tags: [Notification]
      summary: 创建站内信模板
      description: 平台只实现站内信投递，不提供邮件或短信发送。
      operationId: createNotificationTemplate
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, status, title_template, body_template, variables]
              properties:
                code: { type: string, maxLength: 64 }
                name: { type: string, maxLength: 128 }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                title_template: { type: string, maxLength: 255 }
                body_template: { type: string, maxLength: 10000 }
                variables: { type: array, items: { type: object, required: [name, required, max_length], properties: { name: { type: string }, required: { type: boolean }, max_length: { type: integer, minimum: 1 } } } }
      responses: { '201': { description: 模板及首个版本已创建。 } }
  /notifications/templates/{template_id}/versions:
    parameters: [ { name: template_id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [Notification]
      summary: 创建站内信模板版本
      operationId: createNotificationTemplateVersion
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [title_template, body_template, variables], properties: { title_template: { type: string }, body_template: { type: string }, variables: { type: array, items: { type: object } } } }
      responses: { '201': { description: 新版本已创建并成为当前版本。 } }
  /notifications/templates/{template_id}/status:
    parameters: [ { name: template_id, in: path, required: true, schema: { type: string } } ]
    patch:
      tags: [Notification]
      summary: 更新站内信模板状态
      operationId: changeNotificationTemplateStatus
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [status, version], properties: { status: { type: string, enum: [ACTIVE, INACTIVE] }, version: { type: integer, minimum: 1 } } } } }
      responses: { '200': { description: 状态已更新。 }, '409': { description: 版本冲突。 } }
  /notifications/messages:
    post:
      tags: [Notification]
      summary: 按模板创建并投递站内信
      operationId: createNotificationMessage
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [template_code, category, variables, recipients, idempotency_key]
              properties:
                template_code: { type: string, maxLength: 64 }
                category: { type: string, maxLength: 64 }
                variables: { type: object, additionalProperties: { type: string } }
                recipients: { type: array, minItems: 1, items: { type: object, required: [type, id], properties: { type: { type: string }, id: { type: string } } } }
                target_url: { type: string, maxLength: 2048 }
                reference_type: { type: string, maxLength: 64 }
                reference_id: { type: string, maxLength: 64 }
                idempotency_key: { type: string, minLength: 1, maxLength: 128 }
      responses: { '201': { description: 站内信消息和投递记录已创建。 } }
  /notifications/deliveries:
    get:
      tags: [Notification]
      summary: 运营查询站内信投递记录
      operationId: listNotificationDeliveries
      security: [ { cookieAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: status, in: query, schema: { type: string } }
      responses: { '200': { description: 返回投递状态、失败码和重试信息。 } }
  /notifications/deliveries:retry:
    post:
      tags: [Notification]
      summary: 重试失败的站内信投递
      operationId: retryNotificationDeliveries
      security: [ { cookieAuth: [] } ]
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { '200': { description: 返回本次重试结果。 } }
  /notifications/inbox:
    get:
      tags: [Notification]
      summary: 查询当前用户站内信
      operationId: listNotificationInbox
      security: [ { cookieAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { name: status, in: query, schema: { type: string, enum: [UNREAD, READ] } } ]
      responses: { '200': { description: 返回当前租户和当前用户的站内信。 } }
  /notifications/inbox/unread-count:
    get:
      tags: [Notification]
      summary: 查询当前用户未读站内信数量
      operationId: getNotificationUnreadCount
      security: [ { cookieAuth: [] } ]
      responses: { '200': { description: 返回 unread_count。 } }
  /notifications/inbox/{delivery_id}:
    parameters: [ { name: delivery_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [Notification]
      summary: 查询当前用户站内信详情
      operationId: getNotificationInboxItem
      security: [ { cookieAuth: [] } ]
      responses: { '200': { description: 返回站内信详情。 }, '404': { description: 站内信不存在或不属于当前用户。 } }
  /notifications/inbox/{delivery_id}:read:
    parameters: [ { name: delivery_id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [Notification]
      summary: 标记一条站内信为已读
      operationId: markNotificationRead
      security: [ { cookieAuth: [] } ]
      responses: { '200': { description: 已标记为已读。 } }
  /notifications/inbox:read-all:
    post:
      tags: [Notification]
      summary: 批量标记当前用户站内信为已读
      operationId: markAllNotificationsRead
      security: [ { cookieAuth: [] } ]
      responses: { '200': { description: 返回本次更新数量。 } }

  /observability/logs:
    get:
      tags: [Observability]
      summary: 查询统一运行日志
      operationId: listRuntimeLogs
      security: [ { cookieAuth: [] } ]
      parameters: [ { name: service, in: query, schema: { type: string } }, { name: level, in: query, schema: { type: string } }, { name: trace_id, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } } ]
      responses: { '200': { description: 返回当前进程有界存储中的运行日志样本。 } }
  /observability/traces:
    get:
      tags: [Observability]
      summary: 查询 HTTP Trace 样本
      operationId: listRuntimeTraces
      security: [ { cookieAuth: [] } ]
      parameters: [ { name: service, in: query, schema: { type: string } }, { name: trace_id, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } } ]
      responses: { '200': { description: 返回当前进程采集的 Trace 样本。 } }
  /observability/metrics:
    get:
      tags: [Observability]
      summary: 查询运行 Metric 样本
      operationId: listRuntimeMetrics
      security: [ { cookieAuth: [] } ]
      parameters: [ { name: metric_name, in: query, schema: { type: string } }, { name: service, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } } ]
      responses: { '200': { description: 返回当前进程采集的 Metric 样本。 } }
  /observability/alert-rules/{rule_id}:execute:
    parameters: [ { name: rule_id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [Observability]
      summary: 立即执行告警规则
      description: 告警触发和恢复遵循抑制、重复通知控制，并仅联动站内信。
      operationId: executeObservabilityAlertRule
      security: [ { cookieAuth: [] } ]
      responses: { '200': { description: 返回本次规则执行结果。 } }

  /audit/ingestion-receipts:
    get:
      tags: [Audit]
      summary: 查询其他系统审计上报接收回执
      operationId: listAuditIngestionReceipts
      security: [ { cookieAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/AuditApplicationFilter' } ]
      responses: { '200': { description: 返回接收、去重及链路关联摘要。 } }
  /audit/dead-letters:
    get:
      tags: [Audit]
      summary: 查询审计上报死信
      operationId: listAuditDeadLetters
      security: [ { cookieAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/AuditApplicationFilter' }, { name: status, in: query, schema: { type: string } } ]
      responses: { '200': { description: 返回失败记录和重放状态。 } }
  /audit/dead-letters/status:
    get:
      tags: [Audit]
      summary: 查询审计死信运营统计
      operationId: getAuditDeadLetterStatus
      security: [ { cookieAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/AuditApplicationFilter' } ]
      responses: { '200': { description: 返回待处理、已重放、已忽略数量和最早待处理时间。 } }
  /audit/dead-letters/{dead_letter_id}:
    parameters: [ { name: dead_letter_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [Audit]
      summary: 查询审计死信详情
      operationId: getAuditDeadLetter
      security: [ { cookieAuth: [] } ]
      responses: { '200': { description: 返回脱敏死信详情。 }, '404': { description: 死信不存在。 } }
  /audit/dead-letters/{dead_letter_id}:replay:
    parameters: [ { name: dead_letter_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/MFAStepUpGrant' } ]
    post:
      tags: [Audit]
      summary: 重放单条审计死信
      operationId: replayAuditDeadLetter
      x-mfa-step-up: required
      security: [ { cookieAuth: [] } ]
      responses: { '200': { description: 返回重放和新接收回执结果。 } }
  /audit/dead-letters:replay:
    post:
      tags: [Audit]
      summary: 批量重放审计死信
      operationId: replayAuditDeadLetters
      x-mfa-step-up: required
      parameters: [ { $ref: '#/components/parameters/MFAStepUpGrant' } ]
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [dead_letter_ids], properties: { dead_letter_ids: { type: array, minItems: 1, maxItems: 100, items: { type: string } } } } } }
      responses: { '200': { description: 返回每条死信的重放结果。 } }
  /audit/retention-tasks:
    get:
      tags: [Audit]
      summary: 查询审计归档和保留期任务
      operationId: listAuditRetentionTasks
      security: [ { cookieAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses: { '200': { description: 返回任务执行进度和失败码。 } }
    post:
      tags: [Audit]
      summary: 创建审计归档或清理任务
      operationId: createAuditRetentionTask
      x-mfa-step-up: required
      parameters: [ { $ref: '#/components/parameters/MFAStepUpGrant' } ]
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [application_id, mode, cutoff_at], properties: { application_id: { type: string }, mode: { type: string, enum: [ARCHIVE, DELETE] }, archive_id: { type: string }, cutoff_at: { type: string, format: date-time } } } } }
      responses: { '201': { description: 任务已进入 MySQL 队列。 } }

  /files:
    post:
      tags: [File and Async Job]
      summary: 上传通用本地文件
      description: 文件内容写入配置的本地目录，数据库仅保存元数据；不使用对象存储或 Redis。
      operationId: uploadLocalFile
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, classification]
              properties:
                file: { type: string, format: binary }
                application_id: { type: string }
                classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED] }
      responses: { '201': { description: 文件已原子落盘并创建元数据。 } }
  /files/{file_id}/content:
    parameters: [ { name: file_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [File and Async Job]
      summary: 经权限校验下载本地文件
      operationId: downloadLocalFile
      security: [ { cookieAuth: [] } ]
      responses:
        '200': { description: 返回文件流。 }
        '403': { description: 当前用户不是文件所有者且没有下载权限。 }
        '404': { description: 文件不存在或物理内容不可安全读取。 }
  /files:cleanup:
    post:
      tags: [File and Async Job]
      summary: 清理未绑定且已过期的本地文件
      operationId: cleanupLocalFiles
      x-mfa-step-up: required
      parameters: [ { $ref: '#/components/parameters/MFAStepUpGrant' } ]
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [before, max_files], properties: { before: { type: string, format: date-time }, max_files: { type: integer, minimum: 1, maximum: 1000 } } } } }
      responses: { '200': { description: 返回扫描、删除和失败数量。 } }
  /async-jobs:
    get:
      tags: [File and Async Job]
      summary: 查询通用异步任务
      operationId: listAsyncJobs
      security: [ { cookieAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { name: status, in: query, schema: { type: string } }, { name: job_type, in: query, schema: { type: string } } ]
      responses: { '200': { description: 返回任务状态、尝试次数和结果文件。 } }
    post:
      tags: [File and Async Job]
      summary: 创建白名单类型的通用异步任务
      operationId: createAsyncJob
      security: [ { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_type, payload]
              properties:
                application_id: { type: string }
                job_type: { type: string, maxLength: 64 }
                aggregate_type: { type: string, maxLength: 64 }
                aggregate_id: { type: string, maxLength: 64 }
                payload: { type: object, additionalProperties: true, description: 禁止密码、令牌、密钥等敏感字段。 }
                priority: { type: integer, minimum: 0, maximum: 100 }
                max_attempts: { type: integer, minimum: 1, maximum: 20 }
                available_at: { type: string, format: date-time }
      responses: { '201': { description: 任务已创建。 } }
  /async-jobs/{job_id}:cancel:
    parameters: [ { name: job_id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [File and Async Job]
      summary: 取消尚未执行或请求取消运行中任务
      operationId: cancelAsyncJob
      security: [ { cookieAuth: [] } ]
      responses: { '200': { description: 返回取消后的任务状态。 } }
  /async-jobs/{job_id}:retry:
    parameters: [ { name: job_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/MFAStepUpGrant' } ]
    post:
      tags: [File and Async Job]
      summary: 重试失败的异步任务
      operationId: retryAsyncJob
      x-mfa-step-up: required
      security: [ { cookieAuth: [] } ]
      responses: { '200': { description: 任务已重新进入待执行状态。 } }
  /async-jobs/{job_id}:rerun:
    parameters: [ { name: job_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/MFAStepUpGrant' } ]
    post:
      tags: [File and Async Job]
      summary: 基于历史任务创建人工重跑任务
      operationId: rerunAsyncJob
      x-mfa-step-up: required
      security: [ { cookieAuth: [] } ]
      responses: { '201': { description: 新任务已创建并保留重跑关联。 } }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bp_session
      description: JWT 会话 Cookie。实际名称由 IAM_SESSION_COOKIE_NAME 配置，默认 bp_session。
    applicationAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 由 /oauth2/token 使用 Client Credentials 签发的接入应用 JWT。接收端校验 Ed25519（EdDSA）签名、issuer、audience、token_use=application 与时间声明，并以数据库当前启用的 OAuth Client、Application、Environment 和 scope 复核令牌绑定；审计上报必须具备 audit.ingest 范围。
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 本 OIDC 发行方在 Authorization Code 或 Refresh Token 授权中签发的终端用户 Access Token。
    clientCredentialsBasic:
      type: http
      scheme: basic
      description: OAuth 令牌端点的 client_secret_basic 客户端认证。
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Keyword: { name: keyword, in: query, schema: { type: string, maxLength: 100 } }
    StatusFilter: { name: 'filter[status]', in: query, schema: { type: string, maxLength: 40 } }
    SecurityRiskStatus: { name: status, in: query, schema: { type: string, enum: [OPEN, RESOLVED] } }
    AuditApplicationFilter: { name: 'filter[application_code]', in: query, schema: { type: string, maxLength: 64 } }
    AuditEnvironmentFilter: { name: 'filter[environment_code]', in: query, schema: { type: string, maxLength: 32 } }
    AuditActionFilter: { name: 'filter[action]', in: query, schema: { type: string, maxLength: 120 } }
    AuditResultFilter: { name: 'filter[result]', in: query, schema: { type: string, enum: [SUCCESS, FAILURE, DENIED] } }
    AuditRiskFilter: { name: 'filter[risk_level]', in: query, schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] } }
    OccurredFrom: { name: 'filter[occurred_from]', in: query, schema: { type: string, format: date-time } }
    OccurredTo: { name: 'filter[occurred_to]', in: query, schema: { type: string, format: date-time } }
    UserId: { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    AccountId: { name: account_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    MembershipId: { name: membership_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    RoleId: { name: role_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    BindingId: { name: binding_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    AuditEventId: { name: event_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    AuditRequestID: { name: X-Request-ID, in: header, required: true, description: 接收请求或 Outbox 投递动作的唯一关联标识；单条事件必须等于请求体 request_id。, schema: { $ref: '#/components/schemas/AuditCorrelationIdentifier' } }
    AuditTraceparent: { name: traceparent, in: header, required: true, description: 55 字符四段小写十六进制 W3C Trace Context 基础格式；拒绝 ff 版本、全零 trace-id、全零 parent-id、额外字段与大写字符。单条事件的 trace_id 必须等于其 32 位 trace-id，批量请求仅表示投递动作链路。, schema: { type: string, minLength: 55, maxLength: 55, pattern: '^(?!ff-)(?![0-9a-f]{2}-0{32}-)(?![0-9a-f]{2}-[0-9a-f]{32}-0{16}-)[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$' } }
    AuditCorrelationID: { name: X-Correlation-ID, in: header, required: true, description: 端到端业务关联标识；单条事件必须等于请求体 correlation_id，批量请求仅表示投递动作关联。, schema: { $ref: '#/components/schemas/AuditCorrelationIdentifier' } }
    JobId: { name: job_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    ConfigNamespaceFilter: { name: 'filter[namespace_id]', in: query, schema: { $ref: '#/components/schemas/ULID' } }
    ConfigItemId: { name: item_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    ReleaseId: { name: release_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    ApplicationCode: { name: application_code, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_-]{1,63}$' } }
    NamespaceCode: { name: namespace_code, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_.-]{1,127}$' } }
    RiskEventId: { name: risk_event_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    DeliveryId: { name: delivery_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    AlertRuleId: { name: rule_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    DictionaryId: { name: dictionary_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    DictionaryItemId: { name: item_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    DictionaryCode: { name: dictionary_code, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' } }
    DictionaryStatus: { name: status, in: query, schema: { type: string, enum: [ACTIVE, DISABLED] } }
    ApplicationId: { name: application_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    EnvironmentId: { name: environment_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    OAuthClientId: { name: oauth_client_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    OAuthClientCredentialId: { name: credential_id, in: path, required: true, schema: { $ref: '#/components/schemas/ULID' } }
    MFAStepUpGrant: { name: X-MFA-Step-Up-Grant, in: header, required: true, description: 当前会话完成高风险操作 MFA 二次验证后返回的一次性授权；仅可用于一次目标操作，最长有效期两分钟。, schema: { type: string, minLength: 32, maxLength: 512 } }
  responses:
    Unauthenticated:
      description: 未登录、会话已过期或应用凭据无效。
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: 当前主体缺少权限或数据范围不允许。
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: 资源不存在，或当前主体无权感知该资源。
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: 唯一约束、状态转换或业务冲突。
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PayloadTooLarge:
      description: HTTP 请求体超过接口允许的最大字节数。
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    VersionConflict:
      description: 乐观锁冲突；前端应刷新数据后重新提交。
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationError:
      description: 请求字段校验失败。
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    AccountLocked:
      description: 账号处于锁定状态。
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    CapabilityNotEnabled:
      description: 前端已预留、后端尚未启用的 P1 能力。
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    User: { description: 用户对象, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
    UserList: { description: 用户分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/UserListEnvelope' } } } }
    Account: { description: 账号对象, content: { application/json: { schema: { $ref: '#/components/schemas/AccountEnvelope' } } } }
    AccountList: { description: 账号分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/AccountListEnvelope' } } } }
    PasswordReset: { description: 管理员重置密码结果；temporary_password 仅在当前响应中出现一次，管理员须立即复制并线下交付。, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetEnvelope' } } } }
    OrgUnit: { description: 组织单元对象, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitEnvelope' } } } }
    OrgUnitList: { description: 组织单元列表, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitListEnvelope' } } } }
    Position: { description: 岗位对象, content: { application/json: { schema: { $ref: '#/components/schemas/PositionEnvelope' } } } }
    PositionList: { description: 岗位列表, content: { application/json: { schema: { $ref: '#/components/schemas/PositionListEnvelope' } } } }
    Membership: { description: 任职对象, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipEnvelope' } } } }
    MembershipList: { description: 任职分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipListEnvelope' } } } }
    Resource: { description: 资源对象, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } }
    ResourceList: { description: 资源分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceListEnvelope' } } } }
    Permission: { description: 权限对象, content: { application/json: { schema: { $ref: '#/components/schemas/PermissionEnvelope' } } } }
    PermissionList: { description: 权限分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/PermissionListEnvelope' } } } }
    Role: { description: 角色对象, content: { application/json: { schema: { $ref: '#/components/schemas/RoleEnvelope' } } } }
    RoleList: { description: 角色分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/RoleListEnvelope' } } } }
    RoleBinding: { description: 角色绑定对象, content: { application/json: { schema: { $ref: '#/components/schemas/RoleBindingEnvelope' } } } }
    RoleBindingList: { description: 角色绑定分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/RoleBindingListEnvelope' } } } }
    AuditEvent: { description: 审计事件视图, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventEnvelope' } } } }
    AuditEventList: { description: 审计事件分页视图, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventListEnvelope' } } } }
    AuditExportJob: { description: 审计导出任务, content: { application/json: { schema: { $ref: '#/components/schemas/AuditExportJobEnvelope' } } } }
    ConfigNamespace: { description: 命名空间对象, content: { application/json: { schema: { $ref: '#/components/schemas/ConfigNamespaceEnvelope' } } } }
    ConfigNamespaceList: { description: 命名空间分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/ConfigNamespaceListEnvelope' } } } }
    ConfigItem: { description: 配置条目对象, content: { application/json: { schema: { $ref: '#/components/schemas/ConfigItemEnvelope' } } } }
    ConfigItemList: { description: 配置条目分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/ConfigItemListEnvelope' } } } }
    ConfigRelease: { description: 配置发布任务, content: { application/json: { schema: { $ref: '#/components/schemas/ConfigReleaseEnvelope' } } } }
    LoginPolicy: { description: 登录安全策略, content: { application/json: { schema: { $ref: '#/components/schemas/LoginPolicyEnvelope' } } } }
    LockedAccount: { description: 锁定账号或管理员解锁结果, content: { application/json: { schema: { $ref: '#/components/schemas/LockedAccountEnvelope' } } } }
    LockedAccountList: { description: 当前锁定账号分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/LockedAccountListEnvelope' } } } }
    P1Settings: { description: P1 设置对象, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObjectEnvelope' } } } }
    PlatformSettings: { description: 平台基础设置, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformSettingsEnvelope' } } } }
    NotificationSettings: { description: 站内信通知偏好设置（email_enabled 仅为历史兼容字段）, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettingsEnvelope' } } } }
    RiskEvent: { description: 风险事件对象, content: { application/json: { schema: { $ref: '#/components/schemas/RiskEventEnvelope' } } } }
    RiskEventList: { description: 风险事件列表, content: { application/json: { schema: { $ref: '#/components/schemas/RiskEventListEnvelope' } } } }
    AuditDelivery: { description: 审计接收记录, content: { application/json: { schema: { $ref: '#/components/schemas/AuditDeliveryEnvelope' } } } }
    AuditDeliveryList: { description: 审计接收记录列表, content: { application/json: { schema: { $ref: '#/components/schemas/AuditDeliveryListEnvelope' } } } }
    ObservableServiceList: { description: 服务元数据列表, content: { application/json: { schema: { $ref: '#/components/schemas/ObservableServiceListEnvelope' } } } }
    AlertRule: { description: 告警规则对象, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRuleEnvelope' } } } }
    AlertRuleList: { description: 告警规则列表, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRuleListEnvelope' } } } }
    Dictionary: { description: 业务字典对象, content: { application/json: { schema: { $ref: '#/components/schemas/DictionaryEnvelope' } } } }
    DictionaryList: { description: 业务字典分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/DictionaryListEnvelope' } } } }
    DictionaryItem: { description: 业务字典项对象, content: { application/json: { schema: { $ref: '#/components/schemas/DictionaryItemEnvelope' } } } }
    DictionaryItemList: { description: 业务字典项分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/DictionaryItemListEnvelope' } } } }
    Application: { description: 接入应用对象, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationEnvelope' } } } }
    ApplicationList: { description: 接入应用分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationListEnvelope' } } } }
    ApplicationEnvironment: { description: 应用环境对象, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationEnvironmentEnvelope' } } } }
    ApplicationEnvironmentList: { description: 应用环境分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationEnvironmentListEnvelope' } } } }
    OAuthClient: { description: OAuth 客户端对象，不包含密钥明文或散列, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthClientEnvelope' } } } }
    OAuthClientList: { description: OAuth 客户端列表，不包含密钥明文或散列, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthClientListEnvelope' } } } }
  schemas:
    ULID: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', examples: ['01J123456789ABCDEFGHJKMNPQ'] }
    Timestamp: { type: string, format: date-time, description: UTC RFC 3339 时间戳。 }
    Version: { type: integer, minimum: 1, description: 聚合根乐观锁版本号。 }
    StrongPassword:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
      description: 至少 12 个且不超过 128 个 Unicode 字符；必须同时包含大写字母、小写字母、数字和符号，且不得包含空白字符。
    Envelope:
      type: object
      required: [code, message, request_id, data]
      properties:
        code: { type: string, const: OK }
        message: { type: string, examples: ['操作成功'] }
        request_id: { $ref: '#/components/schemas/ULID' }
        data: {}
    EmptyEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties: { data: { type: object, additionalProperties: false } }
    ErrorEnvelope:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          examples: [AUTH_UNAUTHENTICATED, AUTH_FORBIDDEN, IAM_VERSION_CONFLICT, PLATFORM_CAPABILITY_NOT_ENABLED]
        message: { type: string }
        request_id: { $ref: '#/components/schemas/ULID' }
        details: { type: object, additionalProperties: true }
    PageData:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: {} }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    Application:
      type: object
      required: [application_id, code, name, application_type, status, version, created_at, updated_at]
      properties:
        application_id: { $ref: '#/components/schemas/ULID' }
        code: { type: string, maxLength: 64, pattern: '^[a-z][a-z0-9._-]*$' }
        name: { type: string, maxLength: 128 }
        application_type: { type: string, enum: [spa, web, backend, mobile, third_party] }
        owner_org_id: { $ref: '#/components/schemas/ULID', nullable: true }
        owner_user_id: { $ref: '#/components/schemas/ULID', nullable: true }
        homepage_url: { type: string, format: uri, nullable: true }
        description: { type: string, maxLength: 1000, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, SUSPENDED, RETIRED] }
        version: { $ref: '#/components/schemas/Version' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ApplicationCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name, application_type, status]
      properties:
        code: { type: string, maxLength: 64, pattern: '^[a-z][a-z0-9._-]*$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        application_type: { type: string, enum: [spa, web, backend, mobile, third_party] }
        owner_org_id: { $ref: '#/components/schemas/ULID', nullable: true }
        owner_user_id: { $ref: '#/components/schemas/ULID', nullable: true }
        homepage_url: { type: string, format: uri, nullable: true }
        description: { type: string, maxLength: 1000, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, SUSPENDED, RETIRED] }
    ApplicationUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, application_type, status, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        application_type: { type: string, enum: [spa, web, backend, mobile, third_party] }
        owner_org_id: { $ref: '#/components/schemas/ULID', nullable: true }
        owner_user_id: { $ref: '#/components/schemas/ULID', nullable: true }
        homepage_url: { type: string, format: uri, nullable: true }
        description: { type: string, maxLength: 1000, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, SUSPENDED, RETIRED] }
        version: { $ref: '#/components/schemas/Version' }
    ApplicationEnvironment:
      type: object
      required: [environment_id, application_id, environment, status, version, created_at, updated_at]
      properties:
        environment_id: { $ref: '#/components/schemas/ULID' }
        application_id: { $ref: '#/components/schemas/ULID' }
        environment: { type: string, enum: [dev, test, staging, prod] }
        base_url: { type: string, format: uri, nullable: true }
        issuer_alias: { type: string, maxLength: 128, nullable: true }
        metadata: { type: object, additionalProperties: true, nullable: true }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { $ref: '#/components/schemas/Version' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ApplicationEnvironmentCreateRequest:
      type: object
      additionalProperties: false
      required: [environment, status]
      properties:
        environment: { type: string, enum: [dev, test, staging, prod] }
        base_url: { type: string, format: uri, nullable: true }
        issuer_alias: { type: string, maxLength: 128, nullable: true }
        metadata: { type: object, additionalProperties: true, nullable: true }
        status: { type: string, enum: [ACTIVE, DISABLED] }
    ApplicationEnvironmentUpdateRequest:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        base_url: { type: string, format: uri, nullable: true }
        issuer_alias: { type: string, maxLength: 128, nullable: true }
        metadata: { type: object, additionalProperties: true, nullable: true }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { $ref: '#/components/schemas/Version' }
    OAuthClientCredential:
      type: object
      required: [credential_id, fingerprint, valid_from, status]
      properties:
        credential_id: { $ref: '#/components/schemas/ULID' }
        fingerprint: { type: string, description: 密钥 SHA-256 指纹，仅用于辨识，不可用于认证。 }
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_until: { $ref: '#/components/schemas/Timestamp', nullable: true }
        revoked_at: { $ref: '#/components/schemas/Timestamp', nullable: true }
        status: { type: string }
    OAuthClient:
      type: object
      required: [oauth_client_id, application_id, environment_id, client_id, client_name, client_type, token_auth_method, access_token_ttl_seconds, refresh_token_ttl_seconds, require_pkce, status, version, grant_types, scopes, redirect_uris, credentials, created_at, updated_at]
      properties:
        oauth_client_id: { $ref: '#/components/schemas/ULID' }
        application_id: { $ref: '#/components/schemas/ULID' }
        environment_id: { $ref: '#/components/schemas/ULID' }
        client_id: { type: string, maxLength: 128 }
        client_name: { type: string, maxLength: 128 }
        client_type: { type: string, enum: [public, confidential, service] }
        token_auth_method: { type: string, enum: [none, client_secret_basic, private_key_jwt] }
        access_token_ttl_seconds: { type: integer, minimum: 60, maximum: 86400 }
        refresh_token_ttl_seconds: { type: integer, minimum: 0, maximum: 2592000 }
        require_pkce: { type: boolean }
        status: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        grant_types: { type: array, items: { type: string, enum: [authorization_code, client_credentials, refresh_token] } }
        scopes: { type: array, items: { type: string, pattern: '^[A-Za-z0-9:._-]{1,128}$' } }
        redirect_uris: { type: array, items: { type: string, format: uri } }
        credentials: { type: array, items: { $ref: '#/components/schemas/OAuthClientCredential' } }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    OAuthClientCreateRequest:
      type: object
      additionalProperties: false
      required: [application_id, environment_id, client_id, client_name, client_type, token_auth_method, access_token_ttl_seconds, refresh_token_ttl_seconds, grant_types, scopes]
      properties:
        application_id: { $ref: '#/components/schemas/ULID' }
        environment_id: { $ref: '#/components/schemas/ULID' }
        client_id: { type: string, minLength: 1, maxLength: 128 }
        client_name: { type: string, minLength: 1, maxLength: 128 }
        client_type: { type: string, enum: [public, confidential, service] }
        token_auth_method: { type: string, enum: [none, client_secret_basic, private_key_jwt] }
        access_token_ttl_seconds: { type: integer, minimum: 60, maximum: 86400 }
        refresh_token_ttl_seconds: { type: integer, minimum: 0, maximum: 2592000 }
        require_pkce: { type: boolean, default: false }
        grant_types: { type: array, minItems: 1, items: { type: string, enum: [authorization_code, client_credentials, refresh_token] } }
        scopes: { type: array, items: { type: string, pattern: '^[A-Za-z0-9:._-]{1,128}$' } }
        redirect_uris: { type: array, items: { type: string, format: uri } }
        secret_valid_until: { $ref: '#/components/schemas/Timestamp', nullable: true, description: 仅 client_secret_basic 可设置，且不得超过创建时起 365 天。 }
    OAuthClientScopesUpdateRequest:
      type: object
      additionalProperties: false
      required: [scopes, version]
      properties:
        scopes: { type: array, items: { type: string, pattern: '^[A-Za-z0-9:._-]{1,128}$' } }
        version: { $ref: '#/components/schemas/Version' }
    OAuthClientRedirectURIsUpdateRequest:
      type: object
      additionalProperties: false
      required: [redirect_uris, version]
      properties:
        redirect_uris: { type: array, items: { type: string, format: uri } }
        version: { $ref: '#/components/schemas/Version' }
    OAuthClientDisableRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { $ref: '#/components/schemas/Version' }
    OAuthClientCredentialCreateRequest:
      type: object
      additionalProperties: false
      properties:
        valid_until: { $ref: '#/components/schemas/Timestamp', nullable: true, description: 省略时不设置过期时间；指定时必须在未来且不超过当前时刻后 365 天。 }
    OAuthClientCredentialRotateRequest:
      type: object
      additionalProperties: false
      properties:
        overlap_seconds: { type: integer, minimum: 0, maximum: 2592000, default: 0 }
        valid_until: { $ref: '#/components/schemas/Timestamp', nullable: true, description: 指定时必须在未来且不超过当前时刻后 365 天。 }
    ApplicationEnvelope: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Application' } } } ] }
    ApplicationListEnvelope: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/ApplicationPage' } } } ] }
    ApplicationEnvironmentEnvelope: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/ApplicationEnvironment' } } } ] }
    ApplicationEnvironmentListEnvelope: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/ApplicationEnvironmentPage' } } } ] }
    OAuthClientEnvelope: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/OAuthClient' } } } ] }
    OAuthClientListEnvelope: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/OAuthClient' } } } } ] }
    OAuthClientCreateResult:
      type: object
      required: [oauth_client]
      properties:
        oauth_client: { $ref: '#/components/schemas/OAuthClient' }
        client_secret: { type: string, description: 仅创建时显示一次；仅限受控离线保存，平台不再提供查询。 }
    OAuthClientCreateEnvelope: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/OAuthClientCreateResult' } } } ] }
    OAuthClientCredentialSecretResult:
      type: object
      required: [credential, client_secret]
      properties:
        credential: { $ref: '#/components/schemas/OAuthClientCredential' }
        client_secret: { type: string, description: 仅创建或轮换时显示一次；仅限受控离线保存，平台不再提供查询。 }
    OAuthClientCredentialSecretEnvelope: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/OAuthClientCredentialSecretResult' } } } ] }
    ApplicationPage: { allOf: [ { $ref: '#/components/schemas/PageData' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Application' } } } } ] }
    ApplicationEnvironmentPage: { allOf: [ { $ref: '#/components/schemas/PageData' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ApplicationEnvironment' } } } } ] }
    BootstrapFirstSuperAdminRequest:
      type: object
      additionalProperties: false
      required: [display_name, account_name, password]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        account_name: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    BootstrapReference:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/ULID' }
        name: { type: string, maxLength: 128 }
        code: { type: string, maxLength: 64 }
    BootstrapFirstSuperAdminResult:
      type: object
      required: [bootstrap_id, tenant, user, account, role, initialized_at]
      properties:
        bootstrap_id: { $ref: '#/components/schemas/ULID' }
        tenant: { $ref: '#/components/schemas/BootstrapReference' }
        user: { $ref: '#/components/schemas/BootstrapReference' }
        account: { $ref: '#/components/schemas/BootstrapReference' }
        role: { $ref: '#/components/schemas/BootstrapReference' }
        initialized_at: { $ref: '#/components/schemas/Timestamp' }
    BootstrapFirstSuperAdminEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/BootstrapFirstSuperAdminResult' } }

    DingTalkQRSessionCreateRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, provider_code, return_to]
      properties:
        tenant_id:
          $ref: '#/components/schemas/ULID'
          description: 匿名登录阶段仅用于定位租户内的提供商；不得作为已认证请求的租户上下文。
        provider_code: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        return_to:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^/(?!/).*'
          description: 登录完成后的本平台相对路径；服务端还必须拒绝反斜杠、控制字符、协议解析后为外部地址的值。
    DingTalkQRSDKConfig:
      type: object
      additionalProperties: false
      required: [client_id, redirect_uri, response_type, scope, state]
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 512
          description: 钉钉 SuiteKey（公开 SDK 配置，不是 SuiteSecret/客户端密钥；AppKey/AppSecret 仅为兼容性术语）。
        redirect_uri:
          type: string
          format: uri
          maxLength: 2048
          description: 后端登记且服务端校验的 HTTPS 钉钉回调地址；前端回调时必须与此值精确校验。
        response_type:
          type: string
          enum: [code]
          description: 固定授权结果类型；钉钉授权结果不是平台 JWT。
        scope:
          type: string
          minLength: 1
          maxLength: 2048
          description: 服务端按钉钉提供商配置生成的 SDK 授权范围。前端不得追加、删减或持久化。
        state:
          type: string
          minLength: 32
          maxLength: 512
          x-sensitive: true
          description: 仅返回发起本次会话的浏览器，用于官方 SDK 与回调关联；数据库不保存原文，只保存 SHA-256 摘要。
        prompt:
          type: string
          maxLength: 256
          description: 可选的钉钉 SDK 展示提示；不存在时前端不得自行补造。
    DingTalkQRSession:
      type: object
      additionalProperties: false
      required: [session_id, expires_at, render_mode, sdk_config]
      properties:
        session_id: { $ref: '#/components/schemas/ULID' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        render_mode:
          type: string
          enum: [dingtalk_frame]
          description: 固定使用官方 DTFrameLogin SDK 的内嵌二维码呈现方式。
        sdk_config: { $ref: '#/components/schemas/DingTalkQRSDKConfig' }
    DingTalkQRSessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/DingTalkQRSession' } }
    IdentityProviderCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/OIDCIdentityProviderCreateRequest'
        - $ref: '#/components/schemas/DingTalkQRIdentityProviderCreateRequest'
      discriminator:
        propertyName: type
        mapping:
          OIDC: '#/components/schemas/OIDCIdentityProviderCreateRequest'
          DINGTALK_QR: '#/components/schemas/DingTalkQRIdentityProviderCreateRequest'
    OIDCIdentityProviderCreateRequest:
      type: object
      additionalProperties: false
      required: [code, type, issuer, client_id, client_secret, callback_uri, authorization_scopes, display_name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        type: { type: string, const: OIDC }
        issuer: { type: string, format: uri, maxLength: 2048 }
        client_id: { type: string, minLength: 1, maxLength: 255 }
        client_secret: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: 仅允许写入；服务端应用层加密后保存，永不回显。 }
        callback_uri: { type: string, format: uri, maxLength: 2048, description: 生产环境必须为 HTTPS，且应已在上游 OIDC 提供商登记。 }
        authorization_scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
          description: 必须包含 openid。
        display_name: { type: string, minLength: 1, maxLength: 128 }
    DingTalkQRIdentityProviderCreateRequest:
      type: object
      additionalProperties: false
      required: [code, type, client_id, client_secret, callback_uri, authorization_scopes, display_name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        type: { type: string, const: DINGTALK_QR }
        issuer: { type: string, enum: [''], description: DINGTALK_QR 不使用 OIDC issuer；如提供该字段，必须为空字符串。 }
        client_id: { type: string, minLength: 1, maxLength: 512, description: 仅 DINGTALK_QR。第三方企业应用（ISV）内嵌二维码场景填写钉钉 SuiteKey；app_key 是兼容性术语，不是当前 HTTP JSON 字段。 }
        client_secret: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: 仅 DINGTALK_QR。填写钉钉 SuiteSecret/客户端密钥；app_secret 是兼容性术语，不是当前 HTTP JSON 字段。仅允许写入，服务端应用层加密保存，永不回显或写入审计详情。 }
        callback_uri: { type: string, format: uri, maxLength: 2048, description: 必须为已在钉钉开放平台登记的 HTTPS 回调地址。 }
        authorization_scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
          description: 钉钉企业应用已获准的最小权限集合；管理校验不要求 OIDC 的 openid，钉钉提供商不按 OIDC 配置处理。
        display_name: { type: string, minLength: 1, maxLength: 128 }
    IdentityProviderUpdateRequest:
      type: object
      additionalProperties: false
      required: [display_name, status, version]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        callback_uri: { type: string, format: uri, maxLength: 2048, nullable: true }
        authorization_scopes:
          type: array
          minItems: 1
          uniqueItems: true
          nullable: true
          items: { type: string, minLength: 1, maxLength: 128 }
        client_id: { type: string, minLength: 1, maxLength: 512, nullable: true, description: OIDC 的客户端标识；DINGTALK_QR 中为钉钉 SuiteKey。app_key 仅为兼容性术语，不是 HTTP JSON 字段。 }
        client_secret: { type: string, minLength: 1, maxLength: 4096, nullable: true, writeOnly: true, description: OIDC Client Secret；DINGTALK_QR 中为钉钉 SuiteSecret/客户端密钥。提交时轮换，绝不回显；app_secret 仅为兼容性术语，不是 HTTP JSON 字段。 }
        version: { $ref: '#/components/schemas/Version' }
    IdentityProvider:
      type: object
      additionalProperties: false
      required: [provider_id, code, type, issuer, client_id, callback_uri, authorization_scopes, client_secret_configured, client_secret_updated_at, display_name, status, version, created_at, updated_at]
      properties:
        provider_id: { $ref: '#/components/schemas/ULID' }
        code: { type: string, maxLength: 64 }
        type: { type: string, enum: [OIDC, DINGTALK_QR] }
        issuer: { type: string, maxLength: 2048, description: OIDC 发行方；DINGTALK_QR 返回空字符串。 }
        client_id: { type: string, maxLength: 512, description: OIDC 客户端标识；DINGTALK_QR 中为钉钉 SuiteKey。 }
        callback_uri: { type: string, format: uri, maxLength: 2048 }
        authorization_scopes: { type: array, items: { type: string }, description: 已保存的最小授权范围/权限配置。 }
        client_secret_configured: { type: boolean, description: 仅表示 Client Secret 是否已配置；DINGTALK_QR 中即 SuiteSecret/客户端密钥是否已配置，不返回秘密本身。 }
        client_secret_updated_at: { allOf: [ { $ref: '#/components/schemas/Timestamp' } ], nullable: true, description: 最近一次成功写入 Client Secret 的时间；未配置时为 null。 }
        display_name: { type: string, maxLength: 128 }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { $ref: '#/components/schemas/Version' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    IdentityProviderEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/IdentityProvider' } }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [account, password, login_type]
      description: application_id、environment_id、login_target_code 必须同时提供或同时省略；服务端只按该编码元组解析预登记的 HTTPS 登录目标，不接受目标 URL。
      properties:
        account: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
        login_type: { type: string, const: password }
        application_id: { type: string, minLength: 26, maxLength: 26 }
        environment_id: { type: string, minLength: 26, maxLength: 26 }
        login_target_code: { type: string, minLength: 1, maxLength: 64 }
    Session:
      type: object
      required: [expires_at, redirect_url]
      properties:
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        redirect_url: { type: string, examples: ['/'] }
    LoginEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/Session' } }
    SessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/Session' } }
    MFALoginRequired:
      type: object
      required: [mfa_required, pre_authentication_credential, expires_at, max_attempts, redirect_url]
      properties:
        mfa_required: { type: boolean, const: true }
        pre_authentication_credential: { type: string, minLength: 32, maxLength: 512, writeOnly: true, description: 一次性密码登录预认证凭据，不得持久化。 }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        redirect_url: { type: string, description: 登录接口已从目标注册表解析的受控跳转地址；目标不可用时为 /。 }
        max_attempts: { type: integer, minimum: 1 }
    MFALoginRequiredEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/MFALoginRequired' } }
    MFALoginVerificationRequest:
      type: object
      additionalProperties: false
      required: [pre_authentication_credential, code]
      properties:
        pre_authentication_credential: { type: string, minLength: 32, maxLength: 512, writeOnly: true }
        code: { type: string, minLength: 6, maxLength: 64, writeOnly: true, description: TOTP 动态验证码或恢复码。 }
    MFALoginVerification:
      type: object
      required: [expires_at, redirect_url, verification_method]
      properties:
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        redirect_url: { type: string, examples: ['/'] }
        verification_method: { type: string, enum: [TOTP, RECOVERY_CODE] }
    MFALoginVerificationEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/MFALoginVerification' } }
    MFAStepUpChallengeRequest:
      type: object
      additionalProperties: false
      required: [factor_id]
      properties:
        factor_id: { $ref: '#/components/schemas/ULID' }
    MFAStepUpChallenge:
      type: object
      required: [challenge_id, challenge, expires_at, max_attempts]
      properties:
        challenge_id: { $ref: '#/components/schemas/ULID' }
        challenge: { type: string, minLength: 32, maxLength: 512, writeOnly: true }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        max_attempts: { type: integer, minimum: 1 }
    MFAStepUpChallengeEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/MFAStepUpChallenge' } }
    MFAStepUpVerificationRequest:
      type: object
      additionalProperties: false
      required: [challenge, code]
      properties:
        challenge: { type: string, minLength: 32, maxLength: 512, writeOnly: true }
        code: { type: string, minLength: 6, maxLength: 64, writeOnly: true }
    MFAStepUpVerification:
      type: object
      required: [grant, expires_at, verification_method]
      properties:
        grant: { type: string, minLength: 32, maxLength: 512, writeOnly: true, description: 仅用于当前会话下一次高风险操作的单次授权。 }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        verification_method: { type: string, enum: [TOTP, RECOVERY_CODE] }
    MFAStepUpVerificationEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/MFAStepUpVerification' } }
    Principal:
      type: object
      required: [tenant, user, account, roles, permission_codes]
      properties:
        tenant: { $ref: '#/components/schemas/ReferenceName' }
        user: { $ref: '#/components/schemas/ReferenceName' }
        account: { $ref: '#/components/schemas/ReferenceName' }
        roles: { type: array, items: { $ref: '#/components/schemas/ReferenceName' } }
        permission_codes: { type: array, items: { type: string }, uniqueItems: true }
    PrincipalEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/Principal' } }
    ReferenceName:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/ULID' }
        name: { type: string }
        code: { type: string }
    User:
      type: object
      required: [user_id, display_name, status, version, created_at, updated_at]
      properties:
        user_id: { $ref: '#/components/schemas/ULID' }
        display_name: { type: string, maxLength: 100 }
        employee_no: { type: string, maxLength: 64 }
        email: { type: string, format: email }
        mobile_masked: { type: string, description: 已脱敏手机号。 }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { $ref: '#/components/schemas/Version' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        employee_no: { type: string, maxLength: 64 }
        email: { type: string, format: email }
        mobile: { type: string, maxLength: 32, writeOnly: true }
        status: { type: string, enum: [ACTIVE, DISABLED], default: ACTIVE }
    UserUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/UserCreateRequest'
        - type: object
          required: [version]
          properties: { version: { $ref: '#/components/schemas/Version' } }
    Account:
      type: object
      required: [account_id, user_id, account_name, status, version, created_at, updated_at]
      properties:
        account_id: { $ref: '#/components/schemas/ULID' }
        user_id: { $ref: '#/components/schemas/ULID' }
        account_name: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED, LOCKED] }
        last_login_at: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AccountUpdateRequest:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { $ref: '#/components/schemas/Version' }
    LocalAccountCreateRequest:
      type: object
      additionalProperties: false
      required: [user_id, account_name, initial_password]
      properties:
        user_id: { $ref: '#/components/schemas/ULID' }
        account_name: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        initial_password: { $ref: '#/components/schemas/StrongPassword' }
    PasswordInitializeRequest:
      type: object
      additionalProperties: false
      required: [password, version]
      properties:
        password: { $ref: '#/components/schemas/StrongPassword' }
        version: { $ref: '#/components/schemas/Version' }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { $ref: '#/components/schemas/Version' }
    PasswordResetResult:
      type: object
      additionalProperties: false
      required: [account_id, temporary_password]
      properties:
        account_id: { $ref: '#/components/schemas/ULID' }
        temporary_password:
          type: string
          minLength: 12
          maxLength: 128
          description: 仅在管理员重置成功的当前响应中返回；管理员须立即复制并通过线下安全渠道交付，不得在浏览器持久化存储、日志或审计中保存。
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
        new_password: { $ref: '#/components/schemas/StrongPassword' }
    OrgUnit:
      type: object
      required: [org_unit_id, code, name, status, version]
      properties:
        org_unit_id: { $ref: '#/components/schemas/ULID' }
        parent_id: { $ref: '#/components/schemas/ULID' }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 100 }
        sort_order: { type: integer, default: 0 }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { $ref: '#/components/schemas/Version' }
    OrgUnitCreateRequest:
      type: object
      required: [code, name]
      properties:
        parent_id: { $ref: '#/components/schemas/ULID' }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 100 }
        sort_order: { type: integer, default: 0 }
    Position:
      type: object
      required: [position_id, code, name, status, version]
      properties:
        position_id: { $ref: '#/components/schemas/ULID' }
        org_unit_id: { $ref: '#/components/schemas/ULID' }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 100 }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { $ref: '#/components/schemas/Version' }
    PositionCreateRequest:
      type: object
      required: [code, name]
      properties:
        org_unit_id: { $ref: '#/components/schemas/ULID' }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 100 }
    Membership:
      type: object
      required: [membership_id, user, org_unit, membership_type, status, version]
      properties:
        membership_id: { $ref: '#/components/schemas/ULID' }
        user: { $ref: '#/components/schemas/ReferenceName' }
        org_unit: { $ref: '#/components/schemas/ReferenceName' }
        position: { $ref: '#/components/schemas/ReferenceName' }
        membership_type: { type: string, enum: [PRIMARY, SECONDARY] }
        effective_from: { type: string, format: date }
        effective_to: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { $ref: '#/components/schemas/Version' }
    MembershipCreateRequest:
      type: object
      required: [user_id, org_unit_id, membership_type]
      properties:
        user_id: { $ref: '#/components/schemas/ULID' }
        org_unit_id: { $ref: '#/components/schemas/ULID' }
        position_id: { $ref: '#/components/schemas/ULID' }
        membership_type: { type: string, enum: [PRIMARY, SECONDARY] }
        effective_from: { type: string, format: date }
        effective_to: { type: string, format: date }
    MembershipUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/MembershipCreateRequest'
        - type: object
          required: [status, version]
          properties:
            status: { type: string, enum: [ACTIVE, DISABLED] }
            version: { $ref: '#/components/schemas/Version' }
    Resource:
      type: object
      required: [resource_id, code, name, resource_type, version]
      properties:
        resource_id: { $ref: '#/components/schemas/ULID' }
        application_code: { type: string }
        code: { type: string, maxLength: 128 }
        name: { type: string, maxLength: 100 }
        resource_type: { type: string, enum: [MENU, PAGE, API, DATA] }
        version: { $ref: '#/components/schemas/Version' }
    ResourceCreateRequest:
      type: object
      required: [application_code, code, name, resource_type]
      properties:
        application_code: { type: string }
        code: { type: string, maxLength: 128 }
        name: { type: string, maxLength: 100 }
        resource_type: { type: string, enum: [MENU, PAGE, API, DATA] }
    Permission:
      type: object
      required: [permission_id, code, name, resource, version]
      properties:
        permission_id: { $ref: '#/components/schemas/ULID' }
        code: { type: string, examples: ['platform:user:read'] }
        name: { type: string }
        resource: { $ref: '#/components/schemas/ReferenceName' }
        action: { type: string }
        version: { $ref: '#/components/schemas/Version' }
    PermissionCreateRequest:
      type: object
      required: [resource_id, code, name, action]
      properties:
        resource_id: { $ref: '#/components/schemas/ULID' }
        code: { type: string, maxLength: 160 }
        name: { type: string, maxLength: 100 }
        action: { type: string, maxLength: 64 }
    Role:
      type: object
      required: [role_id, code, name, status, permissions, version]
      properties:
        role_id: { $ref: '#/components/schemas/ULID' }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        permissions: { type: array, items: { $ref: '#/components/schemas/ReferenceName' } }
        version: { $ref: '#/components/schemas/Version' }
    RoleCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        permission_ids: { type: array, items: { $ref: '#/components/schemas/ULID' }, uniqueItems: true }
    RoleUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/RoleCreateRequest'
        - type: object
          required: [status, version]
          properties:
            status: { type: string, enum: [ACTIVE, DISABLED] }
            version: { $ref: '#/components/schemas/Version' }
    RoleBinding:
      type: object
      required: [binding_id, role, subject_type, subject, scope_type, status, version]
      properties:
        binding_id: { $ref: '#/components/schemas/ULID' }
        role: { $ref: '#/components/schemas/ReferenceName' }
        subject_type: { type: string, enum: [USER, ACCOUNT, ORG_UNIT, POSITION] }
        subject: { $ref: '#/components/schemas/ReferenceName' }
        scope_type: { type: string, enum: [TENANT, ORG_UNIT, RESOURCE] }
        scope_id: { $ref: '#/components/schemas/ULID' }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
    RoleBindingCreateRequest:
      type: object
      required: [role_id, subject_type, subject_id, scope_type]
      properties:
        role_id: { $ref: '#/components/schemas/ULID' }
        subject_type: { type: string, enum: [USER, ACCOUNT, ORG_UNIT, POSITION] }
        subject_id: { $ref: '#/components/schemas/ULID' }
        scope_type: { type: string, enum: [TENANT, ORG_UNIT, RESOURCE] }
        scope_id: { $ref: '#/components/schemas/ULID' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    RoleBindingUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/RoleBindingCreateRequest'
        - type: object
          required: [status, version]
          properties:
            status: { type: string, enum: [ACTIVE, DISABLED] }
            version: { $ref: '#/components/schemas/Version' }
    AuthorizationCheckRequest:
      type: object
      additionalProperties: false
      required: [permission_code]
      properties:
        permission_code: { type: string, examples: [contract.read] }
        resource_type: { type: string }
        resource_id: { type: string }
        context: { type: object, additionalProperties: true, description: 业务鉴权上下文，不得包含密码或敏感原文。 }
    AuthorizationBatchCheckRequest:
      type: object
      required: [requests]
      properties:
        requests: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/AuthorizationCheckRequest' } }
    AuthorizationDecision:
      type: object
      required: [allowed, permission_code, policy_version]
      properties:
        allowed: { type: boolean }
        permission_code: { type: string }
        reason_code: { type: string, examples: [ALLOW_ROLE_BINDING, DENY_NO_PERMISSION] }
        policy_version: { type: integer, minimum: 1 }
    AuditCorrelationIdentifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      description: 不透明关联标识；不得包含 URL、用户个人信息、密码、令牌、Cookie、密钥或其他凭据。
    AuditTraceID:
      type: string
      pattern: '^(?!0{32}$)[0-9a-f]{32}$'
      description: 从 W3C traceparent 第二段取得的 32 位非全零小写十六进制 trace-id。
    AuditSafeMetadata:
      type: object
      additionalProperties:
        oneOf:
          - { type: string, maxLength: 512 }
          - { type: number }
          - { type: integer }
          - { type: boolean }
          - { type: 'null' }
      maxProperties: 40
      propertyNames:
        allOf:
          - { type: string, minLength: 1, maxLength: 64 }
          - not: { pattern: '(?i)(password|passwd|secret|token|cookie|authorization|credential|private[_-]?key|access[_-]?key|refresh[_-]?token|session[_-]?token)' }
      description: 仅允许一层、已最小化的标量摘要。键名或值不得包含密码、认证头、Cookie、access/refresh token、客户端密钥、私钥、凭据或完整个人信息；禁止嵌套对象、原始请求/响应、堆栈和二进制内容。
    AuditEventInput:
      type: object
      description: 外部接入请求体。严格拒绝未声明字段；不得包含 tenant_id 或 client_id，client_id 仅由已验证的应用令牌主体在服务端注入内部审计模型。
      additionalProperties: false
      required: [event_id, occurred_at, application_code, environment_code, actor_type, action, resource_type, request_id, trace_id, correlation_id, result]
      properties:
        event_id: { $ref: '#/components/schemas/ULID', description: 子系统生成的稳定事件标识；同一应用内不可复用。 }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        application_code: { type: string, pattern: '^[a-z][a-z0-9_-]{1,63}$', description: 必须与应用 Bearer Token 的 application_code 精确一致。 }
        environment_code: { type: string, pattern: '^[a-z][a-z0-9_-]{1,31}$', description: 必须与应用 Bearer Token 的 environment_code 精确一致。 }
        actor_type: { type: string, enum: [USER, ACCOUNT, SERVICE, SYSTEM] }
        actor_id: { type: string, maxLength: 128, description: 平台用户/账号/服务的稳定标识；SYSTEM 可省略。 }
        actor_name: { type: string, maxLength: 200, description: 已脱敏展示名；不得填写身份证号、手机号、邮箱或其他完整个人信息。 }
        session_id: { type: string, maxLength: 128, description: 仅可填不可逆的平台会话标识；不得填写 Cookie、JWT 或原始会话凭据。 }
        action: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9:._-]{1,128}$' }
        resource_type: { type: string, maxLength: 64 }
        resource_id: { type: string, maxLength: 128 }
        resource_name: { type: string, maxLength: 200 }
        business_id: { type: string, maxLength: 128 }
        request_id: { $ref: '#/components/schemas/AuditCorrelationIdentifier', description: 原始业务请求标识；单条上报必须与 X-Request-ID 一致。 }
        trace_id: { $ref: '#/components/schemas/AuditTraceID', description: 原始业务 Trace 标识；单条上报必须等于 traceparent 的 trace-id。 }
        correlation_id: { $ref: '#/components/schemas/AuditCorrelationIdentifier', description: 跨系统业务关联标识；单条上报必须与 X-Correlation-ID 一致。 }
        result: { type: string, enum: [SUCCESS, FAILURE, DENIED] }
        reason_code: { type: string, maxLength: 128 }
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        classification: { type: string, maxLength: 64 }
        summary: { type: string, maxLength: 1000, description: 最小化业务摘要；不得包含敏感凭据、完整个人信息或原始请求/响应。 }
        change_summary: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/FieldChange' } }
        metadata: { $ref: '#/components/schemas/AuditSafeMetadata' }
    AuditEventBatchInput:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/AuditEventInput' } }
    FieldChange:
      type: object
      additionalProperties: false
      required: [field, operation]
      properties:
        field: { type: string, minLength: 1, maxLength: 128, not: { pattern: '(?i)(password|passwd|secret|token|cookie|authorization|credential|private[_-]?key|access[_-]?key|refresh[_-]?token)' } }
        label: { type: string, maxLength: 128 }
        operation: { type: string, enum: [CREATE, UPDATE, DELETE] }
        before: { type: string, maxLength: 512, description: 已按字段策略脱敏的旧值；禁止放入任何凭据或完整个人信息。 }
        after: { type: string, maxLength: 512, description: 已按字段策略脱敏的新值；禁止放入任何凭据或完整个人信息。 }
        masked: { type: boolean, default: false }
    AuditEventView:
      type: object
      description: 面向控制台的审计 DTO；刻意不包含主体原始标识、request_id、trace_id、correlation_id。
      required: [event_id, occurred_at, application_code, action, result]
      properties:
        event_id: { $ref: '#/components/schemas/ULID' }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        operator_display_name: { type: string, description: 已按访问策略过滤的操作人展示名。 }
        action_type: { type: string }
        application_code: { type: string }
        application_name: { type: string }
        environment_code: { type: string }
        action: { type: string }
        result: { type: string, enum: [SUCCESS, FAILURE, DENIED] }
        resource_type: { type: string }
        resource_id: { type: string }
        resource_name: { type: string }
        method: { type: string }
        path: { type: string }
        client_ip: { type: string, description: 按审计策略处理后的客户端地址。 }
        status_code: { type: integer }
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        detail: { type: string }
        summary: { type: string }
        change_summary: { type: array, items: { $ref: '#/components/schemas/FieldChange' } }
    AuditReceipt:
      type: object
      description: 单条事件的接收结果。批量请求的内部 audit_ingestion_receipt 投递回执不通过此模型返回。
      required: [event_id, status]
      properties:
        event_id: { $ref: '#/components/schemas/ULID' }
        status: { type: string, enum: [ACCEPTED, DUPLICATE] }
    OAuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string, description: 短期 Bearer JWT；Client Credentials 与 OIDC 终端用户令牌使用不同签发策略。 }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, minimum: 1, description: Access Token 剩余有效期（秒）。 }
        scope: { type: string, description: 空格分隔的实际签发范围。 }
        refresh_token: { type: string, description: authorization_code 或 refresh_token 成功时返回；仅显示一次，服务端仅保存 SHA-256 摘要。 }
        id_token: { type: string, description: OpenID Connect Authorization Code 或 Refresh Token 成功时返回的 ID Token。 }
    OAuthErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [invalid_request, invalid_grant, invalid_token, unsupported_grant_type, invalid_client, unauthorized_client, invalid_scope, server_error] }
    OIDCDiscoveryDocument:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, jwks_uri, response_types_supported, subject_types_supported, id_token_signing_alg_values_supported]
      properties:
        issuer: { type: string, format: uri }
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        revocation_endpoint: { type: string, format: uri }
        userinfo_endpoint: { type: string, format: uri }
        end_session_endpoint: { type: string, format: uri }
        jwks_uri: { type: string, format: uri }
        response_types_supported: { type: array, items: { type: string } }
        grant_types_supported: { type: array, items: { type: string } }
        subject_types_supported: { type: array, items: { type: string } }
        scopes_supported: { type: array, items: { type: string } }
        token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
        code_challenge_methods_supported: { type: array, items: { type: string } }
        id_token_signing_alg_values_supported: { type: array, items: { type: string } }
    OIDCJWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/OIDCJWK' }
    OIDCJWK:
      type: object
      required: [kty, use, alg, kid, crv, x]
      properties:
        kty: { type: string, enum: [OKP] }
        use: { type: string, enum: [sig] }
        alg: { type: string, enum: [EdDSA] }
        kid: { type: string }
        crv: { type: string, enum: [Ed25519] }
        x: { type: string, description: Base64URL 编码的 Ed25519 公钥。 }
    OIDCUserInfo:
      type: object
      required: [sub]
      properties:
        sub: { type: string, description: 平台用户 ULID。 }
        name: { type: string, description: 仅 profile scope 时可能返回。 }
        preferred_username: { type: string, description: 仅 profile scope 时可能返回。 }
        email: { type: string, format: email, description: 仅 email scope 时可能返回。 }
    AuditExportJobCreateRequest:
      type: object
      description: P0 固定生成 CSV；请求体直接使用审计列表已公开的筛选字段。
      properties:
        application_code: { type: string, maxLength: 64 }
        environment_code: { type: string, maxLength: 32 }
        action: { type: string, maxLength: 120 }
        result: { type: string, enum: [SUCCESS, FAILURE, DENIED] }
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        keyword: { type: string, maxLength: 100 }
        occurred_from: { $ref: '#/components/schemas/Timestamp' }
        occurred_to: { $ref: '#/components/schemas/Timestamp' }
    AuditExportJob:
      type: object
      required: [job_id, status, created_at]
      properties:
        job_id: { $ref: '#/components/schemas/ULID' }
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED] }
        download_url: { type: string, description: SUCCEEDED 时提供同租户、同权限的下载 API 相对路径。 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        completed_at: { $ref: '#/components/schemas/Timestamp' }
    ConfigNamespace:
      type: object
      required: [namespace_id, code, name, version]
      properties:
        namespace_id: { $ref: '#/components/schemas/ULID' }
        application: { $ref: '#/components/schemas/ReferenceName' }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        version: { $ref: '#/components/schemas/Version' }
    ConfigNamespaceCreateRequest:
      type: object
      required: [application_code, code, name]
      properties:
        application_code: { type: string }
        code: { type: string, maxLength: 128 }
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
    ConfigItem:
      type: object
      required: [item_id, namespace, key, value_type, value, version]
      properties:
        item_id: { $ref: '#/components/schemas/ULID' }
        namespace: { $ref: '#/components/schemas/ReferenceName' }
        key: { type: string }
        value_type: { type: string, enum: [STRING, NUMBER, BOOLEAN, JSON] }
        value: {}
        secret: { type: boolean, default: false }
        version: { $ref: '#/components/schemas/Version' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ConfigItemCreateRequest:
      type: object
      required: [namespace_id, key, value_type, value]
      properties:
        namespace_id: { $ref: '#/components/schemas/ULID' }
        key: { type: string, maxLength: 128 }
        value_type: { type: string, enum: [STRING, NUMBER, BOOLEAN, JSON] }
        value: {}
        secret: { type: boolean, default: false }
    ConfigItemUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ConfigItemCreateRequest'
        - type: object
          required: [version]
          properties: { version: { $ref: '#/components/schemas/Version' } }
    ConfigReleaseCreateRequest:
      type: object
      required: [namespace_id, item_versions]
      properties:
        namespace_id: { $ref: '#/components/schemas/ULID' }
        item_versions:
          type: array
          minItems: 1
          items:
            type: object
            required: [item_id, version]
            properties:
              item_id: { $ref: '#/components/schemas/ULID' }
              version: { $ref: '#/components/schemas/Version' }
        comment: { type: string, maxLength: 500 }
    ConfigRelease:
      type: object
      required: [release_id, namespace, version_no, status, created_at]
      properties:
        release_id: { $ref: '#/components/schemas/ULID' }
        namespace: { $ref: '#/components/schemas/ReferenceName' }
        version_no: { type: integer, minimum: 1 }
        status: { type: string, enum: [PENDING, PUBLISHED, FAILED, ROLLED_BACK] }
        comment: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        published_at: { $ref: '#/components/schemas/Timestamp' }
    PublishedConfig:
      type: object
      required: [application_code, namespace_code, release_version, values]
      properties:
        application_code: { type: string }
        namespace_code: { type: string }
