      properties:
        account_id: { $ref: '#/components/schemas/ULID' }
        account_name: { type: string }
        user_id: { $ref: '#/components/schemas/ULID' }
        user_name: { type: string }
        locked_until:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_failed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
