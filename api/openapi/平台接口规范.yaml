        lockout_duration_seconds: { type: integer, minimum: 60, maximum: 86400 }
        failure_reset_window_seconds: { type: integer, minimum: 60, maximum: 86400 }
        version: { $ref: '#/components/schemas/Version' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    LoginPolicyUpdateRequest:
      type: object
      required: [max_failed_attempts, lockout_duration_seconds, failure_reset_window_seconds, version]
      properties:
        max_failed_attempts: { type: integer, minimum: 1, maximum: 20 }
        lockout_duration_seconds: { type: integer, minimum: 60, maximum: 86400 }
        failure_reset_window_seconds: { type: integer, minimum: 60, maximum: 86400 }
        version: { $ref: '#/components/schemas/Version' }
    LockedAccount:
