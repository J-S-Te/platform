<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 机构合同管理系统</title>
<style>
  :root { --primary:#2563EB; --primary-dark:#1D4ED8; --primary-light:#60A5FA; --accent:#059669; --accent-bg:#ECFDF5; --bg:#F8FAFC; --card-border:#E2E8F0; --text:#0F172A; --text-secondary:#475569; --text-muted:#64748B; --text-placeholder:#94A3B8; --radius-sm:6px; --radius:8px; --radius-md:12px; --radius-lg:16px; --shadow-sm:0 1px 3px rgba(15,23,42,.08); --shadow-lg:0 18px 40px rgba(15,23,42,.16); }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); }
  h1,h2,h3,p { margin:0; }
  .badge,.tag { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:999px; font-size:12px; background:#F1F5F9; color:#475569; }
  .badge.info { background:#EFF6FF; color:#2563EB; } .badge.success { background:#ECFDF5; color:#059669; } .badge.purple { background:#F5F3FF; color:#7C3AED; } .badge.warning { background:#FFFBEB; color:#D97706; } .badge.danger { background:#FEF2F2; color:#DC2626; }
  .input { width:100%; height:42px; border:1px solid #CBD5E1; border-radius:var(--radius); padding:0 12px; outline:none; }
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:42px; border-radius:var(--radius); text-decoration:none; font-weight:600; }
  .btn-primary { background:var(--primary); color:#fff; } .btn-block { width:100%; } .btn-lg { min-height:46px; }
  .link { color:var(--primary); cursor:pointer; } .text-sm { font-size:13px; } .text-muted { color:var(--text-muted); } .mb-16 { margin-bottom:16px; }
</style>
<style>
  body { background: #0F172A; overflow: hidden; }
  .login-wrap { display: flex; min-height: 100vh; }
  /* 左侧品牌区 */
  .login-brand {
    flex: 1;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(59,130,246,.35), transparent 55%),
      radial-gradient(900px 600px at 90% 110%, rgba(139,92,246,.28), transparent 55%),
      linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
    color: #fff;
    padding: 60px 64px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative;
  }
  .login-brand .lb-logo { display: flex; align-items: center; gap: 12px; }
  .login-brand .lb-logo .lg {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 22px;
  }
  .login-brand h1 { font-size: 38px; line-height: 1.35; font-weight: 700; letter-spacing: 1px; }
  .login-brand h1 span { color: var(--primary-light); }
  .login-brand .lb-sub { color: #94A3B8; font-size: 15px; margin-top: 18px; max-width: 420px; line-height: 1.8; }
  .lb-feats { display: flex; gap: 28px; margin-top: 34px; }
  .lb-feat { color: #CBD5E1; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .lb-feat .fi { width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; color: var(--primary-light); }
  .login-brand .copy { color: #475569; font-size: 12px; }

  /* 右侧表单区 */
  .login-form-side { width: 480px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 40px; }
  .login-card { width: 100%; max-width: 340px; }
  .login-card h2 { font-size: 24px; font-weight: 700; }
  .login-card .lc-sub { color: var(--text-muted); font-size: 13px; margin-top: 6px; margin-bottom: 26px; }

  .login-tabs { display: flex; background: var(--bg); border-radius: var(--radius); padding: 4px; margin-bottom: 24px; }
  .login-tab { flex: 1; text-align: center; padding: 9px; border-radius: var(--radius-sm); font-size: 13px; color: var(--text-muted); cursor: pointer; font-weight: 500; }
  .login-tab.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-sm); }

  .field-group { margin-bottom: 18px; }
  .input-icon { position: relative; }
  .input-icon svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--text-placeholder); }
  .input-icon .input { padding-left: 38px; }
  .input-icon .eye { left: auto; right: 12px; cursor: pointer; }

  .form-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; font-size: 13px; }
  .checkbox { display: flex; align-items: center; gap: 7px; color: var(--text-secondary); cursor: pointer; }
  .checkbox input { width: 15px; height: 15px; accent-color: var(--primary); }

  .token-tip { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--accent); background: var(--accent-bg); padding: 8px 12px; border-radius: var(--radius); margin-top: 20px; }
  .token-tip .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  .reg-line { text-align: center; margin-top: 22px; font-size: 13px; color: var(--text-muted); }

  /* 钉钉扫码 */
  .qr-panel { display: none; text-align: center; }
  .qr-panel.show { display: block; }
  .qr-box { width: 190px; height: 190px; margin: 8px auto 16px; border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 12px; position: relative; }
  .qr-box img { width: 100%; height: 100%; }
  .qr-status { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .qr-status .badge { margin-left: 4px; }
  .qr-refresh { font-size: 13px; color: var(--primary); cursor: pointer; }
  .pwd-panel.hide { display: none; }
</style>
</head>
<body>
<div class="login-wrap">
  <!-- 品牌区 -->
  <div class="login-brand">
    <div class="lb-logo">
      <div class="lg">合</div>
      <div style="font-size:17px;font-weight:600;">机构合同管理系统</div>
    </div>
    <div>
      <h1>让每一份合同<br><span>全程可控、清晰高效</span></h1>
      <p class="lb-sub">从合同起草、多级审批到签署台账与到期提醒，覆盖合同全生命周期管理，助力企业规范化、数字化经营。</p>
      <div class="lb-feats">
        <div class="lb-feat"><span class="fi">✓</span> 三级审批工作流</div>
        <div class="lb-feat"><span class="fi">✓</span> 模板自动生成</div>
        <div class="lb-feat"><span class="fi">✓</span> 全链路审计</div>
      </div>
    </div>
    <div class="copy">© 2026 机构合同管理系统 · 基于 Vue 3 + Element Plus</div>
  </div>

  <!-- 表单区 -->
  <div class="login-form-side">
    <div class="login-card">
      <h2>欢迎回来 👋</h2>
      <p class="lc-sub">请登录您的账号以继续使用系统</p>

      <div class="login-tabs">
        <div class="login-tab active" data-tab="pwd" onclick="switchLoginTab('pwd')">密码登录</div>
        <div class="login-tab" data-tab="qr" onclick="switchLoginTab('qr')">钉钉扫码</div>
      </div>

      <!-- 密码登录 -->
      <div class="pwd-panel" id="pwdPanel">
        <div class="field-group">
          <label class="form-label">用户名</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <input class="input" placeholder="请输入用户名" value="zhangwei">
          </div>
        </div>
        <div class="field-group">
          <label class="form-label">密码</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <input class="input" type="password" placeholder="请输入密码" value="123456" id="pwdInput">
            <svg class="eye" viewBox="0 0 24 24" fill="currentColor" onclick="togglePwd()"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
          </div>
        </div>
        <div class="form-row">
          <label class="checkbox"><input type="checkbox" checked> 记住我</label>
          <span class="link">忘记密码？</span>
        </div>
        <a class="btn btn-primary btn-lg btn-block" href="#" onclick="return false">登 录</a>
        <div class="token-tip"><span class="badge-dot"></span> Token 状态：有效 · 30 分钟后过期</div>
        <div class="reg-line">还没有账号？<span class="link">立即注册</span></div>
      </div>

      <!-- 钉钉扫码 -->
      <div class="qr-panel" id="qrPanel">
        <div class="qr-box">
          <img alt="钉钉登录二维码" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160'><rect width='160' height='160' fill='white'/><g fill='%230F172A'><rect x='8' y='8' width='40' height='40'/><rect x='16' y='16' width='24' height='24' fill='white'/><rect x='22' y='22' width='12' height='12'/><rect x='112' y='8' width='40' height='40'/><rect x='120' y='16' width='24' height='24' fill='white'/><rect x='126' y='22' width='12' height='12'/><rect x='8' y='112' width='40' height='40'/><rect x='16' y='120' width='24' height='24' fill='white'/><rect x='22' y='126' width='12' height='12'/><rect x='60' y='16' width='8' height='8'/><rect x='76' y='8' width='8' height='16'/><rect x='92' y='16' width='8' height='8'/><rect x='60' y='40' width='16' height='8'/><rect x='88' y='36' width='8' height='12'/><rect x='60' y='60' width='8' height='8'/><rect x='76' y='60' width='12' height='8'/><rect x='96' y='60' width='8' height='8'/><rect x='112' y='60' width='8' height='16'/><rect x='132' y='64' width='12' height='8'/><rect x='60' y='80' width='12' height='8'/><rect x='84' y='84' width='8' height='8'/><rect x='104' y='80' width='8' height='12'/><rect x='124' y='84' width='16' height='8'/><rect x='60' y='104' width='8' height='12'/><rect x='80' y='104' width='12' height='8'/><rect x='100' y='108' width='8' height='8'/><rect x='120' y='104' width='8' height='16'/><rect x='140' y='108' width='8' height='8'/><rect x='68' y='124' width='16' height='8'/><rect x='92' y='128' width='8' height='12'/><rect x='112' y='132' width='12' height='8'/><rect x='132' y='128' width='8' height='16'/></g></svg>">
        </div>
        <div class="qr-status">扫码状态：<span class="badge warning"><span class="badge-dot"></span>待扫码</span></div>
        <p class="text-sm text-muted mb-16">请使用 <strong>钉钉 App</strong> 扫描上方二维码，在手机端确认登录</p>
        <div class="qr-refresh" onclick="return false">🔄 二维码 5 分钟内有效，点击刷新</div>
      </div>
    </div>
  </div>
</div>

<script>
  function switchLoginTab(tab) {
    document.querySelectorAll('.login-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.getElementById('pwdPanel').classList.toggle('hide', tab !== 'pwd');
    document.getElementById('qrPanel').classList.toggle('show', tab === 'qr');
  }
  function togglePwd() {
    const i = document.getElementById('pwdInput');
    i.type = i.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
