name: ${COMPOSE_PROJECT_NAME:-basic-platform-local}

# 本地/测试服务器只有显式开启 PUBLIC_HTTPS_ENABLED 时才加载本文件。
services:
  keycloak:
    environment:
      KC_HOSTNAME: ${PUBLIC_SSO_ORIGIN:?PUBLIC_SSO_ORIGIN must be derived}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded

  api:
    environment:
      APP_PUBLIC_BASE_URL: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}
      AUTH_SESSION_COOKIE_SECURE: "true"
      AUTH_OAUTH_CLIENT_ALLOW_INSECURE_HTTP_REDIRECT_URIS: "false"
      OIDC_ISSUER: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_SSO_ORIGIN:?PUBLIC_SSO_ORIGIN must be derived}
      KEYCLOAK_REQUIRE_HTTPS: "true"

  worker:
    environment:
      APP_PUBLIC_BASE_URL: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}
      AUTH_SESSION_COOKIE_SECURE: "true"
      OIDC_ISSUER: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_SSO_ORIGIN:?PUBLIC_SSO_ORIGIN must be derived}
      KEYCLOAK_REQUIRE_HTTPS: "true"

  contract-api:
    environment:
      OIDC_ISSUER: ${PUBLIC_KEYCLOAK_ISSUER:?PUBLIC_KEYCLOAK_ISSUER must be derived}
      OIDC_BACKCHANNEL_BASE_URL: http://keycloak:8080
      OIDC_REDIRECT_URI: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/contract_management/auth/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/contract_management/logged-out
      OIDC_SESSION_COOKIE_SECURE: "true"
      APP_PUBLIC_URL: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/contract_management/

  customer-api:
    environment:
      APP_PUBLIC_ORIGIN: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}
      OIDC_ISSUER: ${PUBLIC_KEYCLOAK_ISSUER:?PUBLIC_KEYCLOAK_ISSUER must be derived}
      OIDC_BACKCHANNEL_BASE_URL: http://keycloak:8080
      OIDC_REDIRECT_URI: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/customer-opportunity/auth/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/customer-opportunity/
      OIDC_SESSION_COOKIE_SECURE: "true"
      OIDC_ALLOW_INSECURE_HTTP_SESSION: "false"

  portal-api:
    environment:
      PORTAL_PUBLIC_ORIGIN: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}
      PORTAL_PUBLIC_URL: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/customer-portal
      PORTAL_OIDC_ISSUER: ${PUBLIC_KEYCLOAK_ISSUER:?PUBLIC_KEYCLOAK_ISSUER must be derived}
      PORTAL_OIDC_BACKCHANNEL_BASE_URL: http://keycloak:8080
      PORTAL_OIDC_REDIRECT_URI: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/customer-portal/auth/callback
      PORTAL_SESSION_COOKIE_SECURE: "true"
      PORTAL_ALLOW_INSECURE_HTTP_SESSION: "false"

  project-api:
    environment:
      OIDC_ISSUER: ${PUBLIC_KEYCLOAK_ISSUER:?PUBLIC_KEYCLOAK_ISSUER must be derived}
      OIDC_BACKCHANNEL_BASE_URL: http://keycloak:8080
      OIDC_REDIRECT_URI: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/project_management/auth/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/project_management/logged-out
      OIDC_SESSION_COOKIE_SECURE: "true"

  settlement-api:
    environment:
      SETTLEMENT_PUBLIC_ORIGIN: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}
      SETTLEMENT_ALLOW_INSECURE_HTTP_ORIGIN: "false"
      OIDC_ISSUER: ${PUBLIC_KEYCLOAK_ISSUER:?PUBLIC_KEYCLOAK_ISSUER must be derived}
      OIDC_BACKCHANNEL_BASE_URL: http://keycloak:8080
      OIDC_REDIRECT_URI: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/settlement/auth/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/settlement/
      OIDC_SESSION_COOKIE_SECURE: "true"

  dashboard-api:
    environment:
      APP_PUBLIC_ORIGIN: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}
      APP_PUBLIC_URL: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/data_analysis/
      COOKIE_SECURE: "true"
      OIDC_ISSUER: ${PUBLIC_KEYCLOAK_ISSUER:?PUBLIC_KEYCLOAK_ISSUER must be derived}
      OIDC_BACKCHANNEL_BASE_URL: http://keycloak:8080
      OIDC_REDIRECT_URI: ${PUBLIC_PLATFORM_ORIGIN:?PUBLIC_PLATFORM_ORIGIN must be derived}/data_analysis/auth/callback

  frontend:
    environment:
      PUBLIC_HTTPS_ENABLED: "true"
      PUBLIC_PLATFORM_HOST: ${PUBLIC_PLATFORM_HOST:?PUBLIC_PLATFORM_HOST must be set}
      PUBLIC_SSO_HOST: ${PUBLIC_SSO_HOST:?PUBLIC_SSO_HOST must be set}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ${PUBLIC_TLS_CERTIFICATE_RESOLVED:?platform certificate must be validated}:/run/tls/platform.crt:ro
      - ${PUBLIC_TLS_PRIVATE_KEY_RESOLVED:?platform private key must be validated}:/run/tls/platform.key:ro
      - ${SSO_TLS_CERTIFICATE_RESOLVED:?SSO certificate must be validated}:/run/tls/sso.crt:ro
      - ${SSO_TLS_PRIVATE_KEY_RESOLVED:?SSO private key must be validated}:/run/tls/sso.key:ro
