name: platform-ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      logout-mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: platform_test_extpdf_idle
        ports:
          - "127.0.0.1::3306"
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # docs/openapi/ 的归档契约此前没有任何 CI 覆盖：改动后没人知道文件还能不能解析。
      # 这里只做**语法级**校验（YAML 可解析 + 归档数量非空）；spec 与 handler 的语义
      # 一致性属于另立项，塞进本 job 会立刻红，因此刻意不做（见 docs/README.md 的索引说明）。
      # 使用 ruby+YAML 而非 PyYAML：本 job 已通过
      # deploy/production/tests/test-compose-orchestration-consistency.py 依赖 ruby -ryaml，
      # 是已经验证过的 runner 依赖；不额外引入未在本仓库验证过的 python 包。
      - name: Validate OpenAPI archive YAML syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          specs=0
          for spec in docs/openapi/*.yaml; do
            # 只做语法解析（Psych.parse_file）：不做 alias 解析，因此既不依赖 Psych 的
            # aliases 关键字（Ruby 2.6 不支持、3.1+ 默认禁用），也不会因锚点/别名误判。
            ruby -ryaml -e 'Psych.parse_file(ARGV[0])' "$spec"
            echo "openapi syntax ok: $spec"
            specs=$((specs + 1))
          done
          test "$specs" -ge 1 || { echo "docs/openapi 下没有归档契约" >&2; exit 1; }
          echo "validated $specs OpenAPI specs (syntax only)"
      # 本地模板与生产模板的键集漂移：两侧面向不同环境，键集本来不等，此前没有任何门禁，
      # 新增变量只能到部署时以“容器起不来 / 静默用默认值”暴露。脚本内置分组白名单，
      # 白名单外的差异直接失败；纯标准库实现，不接触 Docker/MySQL/网络。
      - name: Verify local/production env template drift
        run: timeout 120 python3 -B scripts/check-env-template-drift.py
      - run: go test ./...
      - name: Verify account logout transaction on isolated MySQL
        env:
          PLATFORM_IDENTITY_TEST_DSN: root@tcp(127.0.0.1:${{ job.services.logout-mysql.ports[3306] }})/platform_test_extpdf_idle?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
        run: |
          set -euo pipefail
          docker exec '${{ job.services.logout-mysql.id }}' mysql -uroot -e \
            "SET GLOBAL collation_server='utf8mb4_unicode_ci'; SET GLOBAL default_collation_for_utf8mb4='utf8mb4_general_ci'; ALTER DATABASE platform_test_extpdf_idle CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          go test ./internal/platform/identity/infrastructure -run '^TestAccountLogoutEnqueuesBackchannelOnMySQL$' -count=1 -v
      - name: Verify OIDC idle policy on isolated MySQL
        env:
          PLATFORM_OIDC_IDLE_TEST_DSN: root@tcp(127.0.0.1:${{ job.services.logout-mysql.ports[3306] }})/platform_oidc_test_idle?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
        run: |
          set -euo pipefail
          docker exec '${{ job.services.logout-mysql.id }}' mysql -uroot -e \
            "CREATE DATABASE platform_oidc_test_idle CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          go test ./internal/platform/oidc/infrastructure -run '^TestResolveSessionSubject(Idle|CentralIdle)PolicyMySQL$' -count=1 -v
      - name: Verify Agent credential ownership under isolated root execution
        shell: bash
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/runtime-license-owner.test" ./internal/platform/applicationregistry/infrastructure
          sudo -n -- "$RUNNER_TEMP/runtime-license-owner.test" -test.run '^Test(RuntimeLicenseCredentials|AccessProofs)UseRuntimeDirectoryOwner$' -test.v
      - run: go vet ./...
      - name: Validate production deployment scripts
        working-directory: .
        shell: bash
        run: |
          set -Eeuo pipefail
          for asset in \
            deploy/production/bin/deploy-service.sh \
            deploy/production/bin/deploy-customer-opportunity.sh \
            deploy/production/subsystem-templates/contract.env.example \
            deploy/production/subsystem-templates/customer.env.example \
            deploy/production/subsystem-templates/portal.env.example \
            deploy/production/subsystem-templates/project.env.example \
            deploy/production/subsystem-templates/data-analysis.env.example; do
            test -f "$asset" || { echo "missing production deployment asset: $asset" >&2; exit 1; }
          done
          if find deploy/production/subsystems.d -maxdepth 1 -type f \( -name '*-dev.yaml' -o -name '*-dev.yml' \) -print -quit | grep -q .; then
            echo "production deployment assets must not contain dev subsystem profiles" >&2
            exit 1
          fi
          bash -n deploy/production/bin/*.sh
          sh scripts/test-docker-entrypoint-key-init.sh
          # platform/scripts 的本地开发/运维脚本此前不在 CI 覆盖内：只做语法检查并跑
          # 纯标准库 + PATH 桩的回归；不接触真实 Docker/MySQL/网络，也不影响离线资产。
          bash -n scripts/*.sh scripts/lib/*.sh
          python3 -B scripts/test_native_deploy_helpers.py
          python3 -B scripts/test_ops_linux_safety.py
          python3 -B scripts/test_portal_gateway_render.py
          python3 -B scripts/test_sync_catalog.py
          python3 -B scripts/test_unlock_locked_account.py
          python3 -B scripts/test_subsystem_lifecycle.py
          python3 -B scripts/test_subsystem_connect_origin.py
          # 本地开发/运维入口（local-status / docker-local / 系统编排）的回归：全部用
          # 临时工作区与 PATH 桩，不接触真实 Docker/MySQL/网络，也不读写运行状态文件。
          # 每个用例都加 timeout，避免个别场景在 runner 上长时间挂起卡住 test job。
          # test_local_project_background.py 依赖 monorepo 同级目录 project_management/
          # compose.yaml，独立 checkout 的 CI 没有该文件，暂不纳入本 job。
          timeout 120 python3 -B scripts/test_local_status.py
          timeout 120 python3 -B scripts/test_local_control_dependencies.py
          timeout 120 python3 -B scripts/test_local_license_preflight.py
          timeout 120 python3 -B scripts/test_local_startup_guard.py
          timeout 120 python3 -B scripts/test_local_operations_arguments.py
          timeout 120 python3 -B scripts/test_local_provisioner_build.py
          timeout 120 python3 -B scripts/test_project_background_state.py
          timeout 120 python3 -B scripts/test_recover_contract_runtime.py
          timeout 120 python3 -B scripts/test_recover_local_license_pins.py
          timeout 120 python3 -B scripts/test_refresh_approvals.py
          python3 deploy/production/tests/test-compose-blocks.py
          python3 -B deploy/production/tests/test-compose-one-shot-parity.py
          python3 -B deploy/production/tests/test-compose-orchestration-consistency.py
          # 接线漂移（清单键未写入模板、client_id 字面量推导不出、数析只读 DSN 缺失）
          # 只在联调阶段以 401/空数据暴露，因此在同一个 job 里与一致性门禁一起跑。
          python3 -B deploy/production/tests/test_integration_wiring.py
          # 观测面与只读 DSN 默认值的静态门禁：README 的“已采集/未采集”清单、
          # prometheus.yml 抓取 job 与 compose 服务名三方对齐；`*_READ_DSN`
          # 默认值必须为空，避免凭据入库与部署方漏配时静默错连。全部只读文件、不发请求。
          python3 -B deploy/production/tests/test_metrics_endpoint_registry.py
          python3 -B deploy/production/tests/test_readonly_dsn_defaults.py
          # D4/D5 的文档与边界门禁：Temporal 共享边界（compose/backup/compose-scope/README
          # 对齐）与许可运行态判读口径（status 端点为唯一判据，readyz 不作判据）。全部只读文件。
          python3 -B deploy/production/tests/test_temporal_shared_boundary.py
          python3 -B deploy/production/tests/test_deploy_service_backup_names.py
          bash deploy/production/tests/test_truncate_container_logs.sh
          bash deploy/production/tests/test_prune_images.sh
          bash deploy/production/tests/test-deploy-backup-access.sh
          python3 -B deploy/production/tests/test_license_status_reading.py
          # 运行配置门禁：runtime/*.env 重复键（provisioner 报 validate runtime environment
          # group）与编排里 PROJECT_RUN_WORKER_WITH_API 非 false（生产校验拒绝）的回归。
          python3 deploy/production/tests/test-runtime-env-hygiene.py
          python3 deploy/production/tests/test-ci-assets-sync.py
          python3 deploy/production/tests/test-deploy-service-preflight.py
          python3 -B deploy/production/tests/test-contract-runtime-rollout.py
          python3 -B deploy/production/tests/test-portal-migration-maintenance.py
          python3 -B deploy/production/tests/test-deploy-service-env-set.py
          python3 -B deploy/production/tests/test-portal-proxy-deployment.py
          # 监控挂载定向补齐：历史活动编排只挂 2 个规则文件 + 缺凭据目录时，
          # prometheus 静默 fail-open（规则少一半）且 platform-api job 永远缺凭据。
          python3 -B deploy/production/tests/test-prometheus-mounts-install.py
          python3 -B deploy/production/tests/test-release-backup-policy.py
          python3 deploy/production/tests/test-runtime-dsn-dotenv.py
          python3 -B deploy/production/tests/test-upgrade-config-preservation.py
          python3 deploy/production/tests/test-customer-deploy-result.py
          python3 deploy/production/tests/test-platform-coordinated-upgrade.py
          python3 -B deploy/production/tests/test-audit-hash-key-init.py
          python3 -B deploy/production/tests/test-delivery-asset-completeness.py
          python3 deploy/production/tests/test-managed-deployment-defaults.py
          python3 deploy/production/tests/test-frontend-network.py
          python3 deploy/production/tests/test-public-proxy-prefetch.py
          python3 deploy/production/tests/test-offline-image-identities.py
          python3 -B deploy/production/tests/test-offline-platform-selection.py
          python3 -B deploy/production/tests/test-delivery-inspect.py
          python3 -B deploy/production/tests/test-deployment-session.py
          python3 deploy/production/bin/test-deployment-plan.py
          python3 deploy/production/tests/test-deployment-compatibility.py
          bash deploy/production/bin/test-recovery-status.sh
          bash deploy/production/bin/test-first-failure.sh
          sudo bash deploy/production/bin/test-offline-configure.sh
          bash deploy/production/bin/test-release-reliability.sh
          bash deploy/production/tests/test-assets-install.sh
          python3 -B deploy/production/tests/test-delivery-files.py
          python3 -B deploy/production/tests/test-delivery-runtime.py
          python3 deploy/production/bin/test-subsystem-runtime.py
          python3 deploy/production/bin/test-subsystem-completion.py
          python3 deploy/production/bin/test-presale-release-transaction.py
          bash deploy/production/bin/test-compose-scope.sh
          bash deploy/production/bin/test-start-enabled.sh
          bash deploy/production/bin/test-subsystem-state-machine.sh
          bash deploy/production/bin/test-offline-import.sh
          bash deploy/production/bin/test-verify-readiness.sh
          bash deploy/production/tests/test-key-init.sh
          bash deploy/production/tests/test_prune_backups.sh
          bash deploy/production/tests/test-backup-retention.sh
          test -x deploy/production/bin/deploy-service.sh
          test -x deploy/production/bin/deploy-customer-opportunity.sh
          # 每次切换不可变镜像都必须重建业务容器，并核对容器最终使用的 digest，
          # 防止 release.env 已更新但旧容器仍在提供旧代码。
          grep -q -- '--force-recreate' deploy/production/bin/deploy-service.sh
          grep -q -- 'verify_service_image' deploy/production/bin/deploy-service.sh
          grep -q -- '--force-recreate' deploy/production/bin/deploy-customer-opportunity.sh
          grep -q -- 'verify_service_image' deploy/production/bin/deploy-customer-opportunity.sh
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' deploy/production; then
            echo "unresolved merge conflict marker found in production deployment assets" >&2
            exit 1
          fi
      # license-core 在三处（consumer 快照、权威源、vendor）各有一份副本，重复副本的
      # 漂移此前只能靠人工比对发现；这里把副本门禁与其自测一起纳入 CI。
      - name: Verify license-core mirror stays in sync
        run: sh scripts/license-core-sync.sh --check
      - name: Verify license-core sync guard
        run: sh scripts/license-core-sync-test.sh

  # 迁移 SQL 全量验证（此前是最大盲区）。现状事实：migrations/ 有 140 个 SQL，
  # migrations/*_test.go 依赖 9 个不同的 *_TEST_DSN，但 test job 的 MySQL 8.0 service
  # 只给 PLATFORM_IDENTITY_TEST_DSN / PLATFORM_OIDC_IDLE_TEST_DSN 供值，且全文件没有
  # 任何步骤跑 `go test ./migrations/...`——于是主力用例
  # migrations/mysql_integration_test.go:17-21 缺 DSN 即 t.Skip，覆盖率为零。
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      migration-mysql:
        # 刻意用 mysql:8.4 而不是 test job 的 8.0，并且**不改** test job 的 8.0 service：
        # 生产与验收口径是 8.4，8.0→8.4 之间确有 DDL/参数差异（8.4 已移除
        # default-authentication-plugin），必须由独立 job 覆盖，不能把 8.0 的语义改掉。
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - "127.0.0.1::3306"
        # options 会被原样追加到 `docker create`，只能是 Docker 自己的参数；
        # --character-set-server/--collation-server 是 mysqld 参数，写在这里会让
        # 容器初始化直接失败（真实 GA 已复现 exit 125）。8.4 默认就是 utf8mb4，
        # 各测试库的字符集/排序规则在下面的 CREATE DATABASE 里显式指定。
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # 每个 DSN 一个独立库：这些用例的契约不同，共用一个库会互相踩。
      #   platform_migration_test  跑完整迁移链并要求“第二次运行为空”（可重试性）
      #   platform_operations_test 要求库为空（拒绝非空库，防止误连业务库）
      #   platform_refresh_test    用例硬编码库名，只认 127.0.0.1 + 该库名
      #   platform_audit_dedup_test 用例自己 DROP/CREATE 该库，故不能与其它用例共用
      - name: Create disposable migration databases
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec '${{ job.services.migration-mysql.id }}' mysql -uroot -e "
            CREATE DATABASE platform_migration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE platform_operations_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE platform_refresh_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE platform_audit_dedup_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      # 仍然有 5 个 DSN 刻意不给值（用例继续 t.Skip），因为本地在 MySQL 8.4 上实测为
      # **用例自身过期**导致的失败，属于既有缺陷，不在本次 CI 接线范围内：
      #   PLATFORM_BOOTSTRAP_TEST_DSN
      #     TestBootstrapAfterFullMigrationChainOnMySQL 跳过 000103 后继续喂 000104，
      #     internal/migration/migration.go:103-110 的连续性校验直接报
      #     “expected 000103, found 000104”。
      #   PLATFORM_PORTAL_ACCESS_MIGRATION_TEST_DSN / PLATFORM_LEGACY_CONTRACT_MIGRATION_TEST_DSN
      #     同因：用例把待验证的修复迁移从中间抽掉（000112 / 000111），
      #     其后继版本让连续性校验失败。
      #   AUDIT_APPEND_ONLY_TEST_DSN / AUDIT_CHAIN_TEST_DSN
      #     用例内联 DDL 建的 audit_event_dedup 缺 environment_id 列，
      #     而仓储 internal/platform/audit/infrastructure/gorm_repository.go:264 已按
      #     environment_id 查询 → “Unknown column 'environment_id' in 'where clause'”。
      # 修复方式是用例跟上最新 schema/迁移清单；在修好之前给值只会让本 job 永久红。
      - name: Verify migration SQL on isolated MySQL 8.4
        shell: bash
        env:
          PLATFORM_MIGRATION_TEST_DSN: root@tcp(127.0.0.1:${{ job.services.migration-mysql.ports[3306] }})/platform_migration_test?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
          PLATFORM_OPERATIONS_TEST_DSN: root@tcp(127.0.0.1:${{ job.services.migration-mysql.ports[3306] }})/platform_operations_test?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
          MYSQL_REFRESH_TEST_DSN: root@tcp(127.0.0.1:${{ job.services.migration-mysql.ports[3306] }})/platform_refresh_test?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
          AUDIT_DEDUP_TEST_DSN: root@tcp(127.0.0.1:${{ job.services.migration-mysql.ports[3306] }})/platform_audit_dedup_test?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/migrations-test.log"
          go test ./migrations/... -count=1 -timeout 20m -v 2>&1 | tee "$log"
          # 反向断言：DSN 没生效时用例只会 t.Skip，CI 依旧全绿——这正是本 job 要防的失败模式，
          # 所以必须确认拿到 DSN 的用例真的 PASS 过，而不是“没红就算过”。
          for test in \
            TestMigrations95To99OnMySQL \
            TestOperationalModulesOnIsolatedMySQL \
            TestMySQLManagedRefreshRepairBoundaries \
            TestAuditEventDedupEnvironmentMySQL; do
            grep -q -- "--- PASS: $test " "$log" \
              || { echo "migration test did not run (skipped?): $test" >&2; exit 1; }
          done

  # 数据竞争检测。test job 已经跑过 `go test ./...`，把 -race 叠在同一个 job 里等于把
  # 整套用例再跑一遍（耗时翻倍且互相拖慢），所以独立成 job 且只覆盖 ./internal/...。
  # 不挂 MySQL service：DSN 未配置时数据库用例仍是 t.Skip，竞态检测的价值在纯逻辑路径，
  # 真实 SQL 由上面的 migrations job 覆盖。
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 非阻断观察期：-race 在 4vCPU/16GB runner 上耗时 6–12min 且更易受环境影响；先以非阻断方式收集真实失败率，稳定后再改为阻断。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run ./internal/... under the race detector
        run: go test -race -count=1 -timeout 30m ./internal/...

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # 迁移 SQL 全量验证阻断发布：任一红都不应继续构建/部署镜像，否则会出现
    # “测试红但镜像已推到生产”的窗口。race 处于观察期，不阻断发布。
    needs: [test, migrations]
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.result.outputs.image_ref }}
      file_gateway_image_ref: ${{ steps.result.outputs.file_gateway_image_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        shell: bash
        env:
          ACR_PUSH_REGISTRY: ${{ vars.ACR_PUSH_REGISTRY }}
          ACR_PULL_REGISTRY: ${{ vars.ACR_PULL_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run: |
          set -Eeuo pipefail
          : "${ACR_PUSH_REGISTRY:?missing ACR_PUSH_REGISTRY}"
          : "${ACR_PULL_REGISTRY:?missing ACR_PULL_REGISTRY}"
          : "${ACR_NAMESPACE:?missing ACR_NAMESPACE}"
          : "${ACR_REPOSITORY:?missing ACR_REPOSITORY}"
          echo "image=${ACR_PUSH_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "deploy_image=${ACR_PULL_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_PUSH_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - id: file_gateway_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: file-gateway-runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.image }}:file-gateway-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=file-gateway
          cache-to: type=gha,mode=max,scope=file-gateway
          provenance: true
          sbom: true
      - id: result
        shell: bash
        run: |
          echo "image_ref=${{ steps.vars.outputs.deploy_image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "file_gateway_image_ref=${{ steps.vars.outputs.deploy_image }}@${{ steps.file_gateway_build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    # main 分支构建镜像成功后必须部署；部署凭据缺失时应直接失败，不能静默跳过。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect backend image changes
        # 后端或服务编排变化必须执行完整平台发布，应用 API/Worker/Agent 的配置。
        # 纯清单、文档与部署脚本变化仍可同步资产后成对重载控制面，复用当前镜像。
        id: detect
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          platform_release_paths='^\.github/workflows/ci-cd\.yml$'
          platform_release_paths+='|^deploy/production/docker-compose\.yml$'
          platform_release_paths+='|^deploy/production/bin/platform-mysql-command\.py$'
          platform_release_paths+='|^deploy/production/bin/deploy-service\.sh$'
          backend_paths='^(cmd|internal|migrations|scripts)/'
          backend_paths+='|^(Dockerfile|go\.mod|go\.sum|docker-entrypoint\.sh)$'
          if grep -Eq "$platform_release_paths" <<<"$changed" \
            || { grep -E "$backend_paths" <<<"$changed" \
                 | grep -vE '_test\.go$' >/dev/null; }; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync production deployment assets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          FILE_GATEWAY_IMAGE_REF: ${{ needs.image.outputs.file_gateway_image_ref }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
          BACKEND_CHANGED: ${{ steps.detect.outputs.backend_changed }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/unified-identity-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          # 使用与离线交付相同的校验、事务安装及重载门禁，保留服务器的模块选择。
          asset_work_dir="$(mktemp -d)"
          trap 'rm -rf -- "$asset_work_dir"' EXIT
          tar -C deploy/production -czf "$asset_work_dir/deployment-assets.tar.gz" \
            bin subsystems.d subsystem-templates mysql-init nginx monitoring tests \
            docker-compose.yml .env.example .release.env.example .gitignore \
            ACCEPTANCE_CHECKLIST.md README.md OFFLINE_DEPLOYMENT.md OFFLINE_RUNBOOK.md \
            DEPLOYMENT_COMPATIBILITY.md deployment-compatibility.json DELIVERY_WORKFLOW.md BACKUP_RECOVERY.md
          (cd "$asset_work_dir" && sha256sum deployment-assets.tar.gz > deployment-assets.tar.gz.sha256)
          cp deploy/production/bin/install-assets.sh "$asset_work_dir/install-assets.sh"
          cp deploy/production/bin/provisioner-config-refresh.sh "$asset_work_dir/provisioner-config-refresh.sh"
          cp deploy/production/bin/frontend-network.py "$asset_work_dir/frontend-network.py"
          printf -v install_command 'deploy_path=%q; gateway_image=%q; platform_image=%q; backend_changed=%q; set -Eeuo pipefail; [[ "$gateway_image" =~ @sha256:[a-f0-9]{64}$ ]] || exit 1; work_dir=$(mktemp -d); trap '\''rm -rf -- "$work_dir"'\'' EXIT; tar -xzf - -C "$work_dir"; source "$work_dir/provisioner-config-refresh.sh"; deploy_dir="$deploy_path"; prepare_ci_deploy_root; if [[ "$backend_changed" != true ]] && { test -e "$deploy_path/runtime/.control-plane-reload-required" || test -L "$deploy_path/runtime/.control-plane-reload-required"; }; then (cd "$deploy_path" && FILE_GATEWAY_IMAGE="$gateway_image" ./bin/deploy.sh reload-control-plane); fi; if [[ "$backend_changed" == true ]]; then [[ "$platform_image" =~ ^[^[:space:]]+@sha256:[a-f0-9]{64}$ ]] || exit 1; export ASSETS_PLATFORM_UPGRADE_IMAGE="$platform_image"; fi; bash "$work_dir/install-assets.sh" "$work_dir/deployment-assets.tar.gz" "$deploy_path"' "$DEPLOY_PATH" "$FILE_GATEWAY_IMAGE_REF" "$IMAGE_REF" "$BACKEND_CHANGED"
          tar -C "$asset_work_dir" -czf - deployment-assets.tar.gz deployment-assets.tar.gz.sha256 install-assets.sh provisioner-config-refresh.sh frontend-network.py | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -c $(printf '%q' "$install_command")"
      - name: Check deployment compatibility
        if: steps.detect.outputs.backend_changed == 'true' && vars.ENFORCE_DEPLOY_COMPATIBILITY == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/unified-identity-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command 'cd %q && ./bin/deploy.sh plan --action upgrade --component platform --compatibility-only --format human' "$DEPLOY_PATH"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"

      - name: Apply test-server placeholder database credentials switch
        # 当前部署环境为测试服务器（environment: test）。每次部署都会把占位凭据
        # 开关写入服务器 .env 并重建 Agent，让测试接入不再被数据库密码阻塞。
        # 生产部署必须把 vars.SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS
        # 设为 false（或移除本步骤），该开关不会修改已有 MySQL 账号密码。
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SWITCH_VALUE: ${{ vars.SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS || 'true' }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/unified-identity-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command 'cd %q && if grep -q "^SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS=" .env; then sed -i "s/^SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS=.*/SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS=%q/" .env; else echo "SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS=%q" >> .env; fi && chmod 600 .env && echo "placeholder switch applied"' "$DEPLOY_PATH" "$SWITCH_VALUE" "$SWITCH_VALUE"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"

      - name: Reload paired subsystem control plane
        if: steps.detect.outputs.backend_changed != 'true'
        # 纯资产使用已有镜像重载；平台镜像发布先迁移，再升级并验证新 API/Agent。
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          FILE_GATEWAY_IMAGE_REF: ${{ needs.image.outputs.file_gateway_image_ref }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/unified-identity-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          # 通过 stdin 将完整脚本交给远端 bash，避免把 heredoc/单引号/反斜杠
          # 拼进 ssh 命令参数后被本地 shell、ssh 和远端 shell 多次解析。
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd $(printf '%q' "$DEPLOY_PATH") && bash -s -- $(printf '%q' "$FILE_GATEWAY_IMAGE_REF")" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          # 旧版 release.env 可能尚未包含独立文件网关镜像。
          # 已验证的候选镜像仅用于解析 Compose 并执行控制面成对重载。
          # deploy-service 执行迁移前，保持 PLATFORM_IMAGE 不变。
          [[ "${1:-}" =~ @sha256:[a-f0-9]{64}$ ]] || { echo 'invalid File Gateway candidate digest' >&2; exit 1; }
          export FILE_GATEWAY_IMAGE="$1"
          ./bin/deploy.sh reload-control-plane
          REMOTE_SCRIPT

      - name: Migrate and deploy immutable platform image
        if: steps.detect.outputs.backend_changed == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
          FILE_GATEWAY_IMAGE_REF: ${{ needs.image.outputs.file_gateway_image_ref }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/unified-identity-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command 'cd %q && DEPLOY_PLATFORM_CONTROL_PLANE_UPGRADE=true ./bin/deploy-service.sh platform %q %q' "$DEPLOY_PATH" "$IMAGE_REF" "$FILE_GATEWAY_IMAGE_REF"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
