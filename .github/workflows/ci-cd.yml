name: platform-ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Validate production deployment scripts
        working-directory: .
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/production/bin/*.sh
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' deploy/production; then
            echo "unresolved merge conflict marker found in production deployment assets" >&2
            exit 1
          fi

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.result.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        shell: bash
        env:
          ACR_PUSH_REGISTRY: ${{ vars.ACR_PUSH_REGISTRY }}
          ACR_PULL_REGISTRY: ${{ vars.ACR_PULL_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run: |
          set -Eeuo pipefail
          : "${ACR_PUSH_REGISTRY:?missing ACR_PUSH_REGISTRY}"
          : "${ACR_PULL_REGISTRY:?missing ACR_PULL_REGISTRY}"
          : "${ACR_NAMESPACE:?missing ACR_NAMESPACE}"
          : "${ACR_REPOSITORY:?missing ACR_REPOSITORY}"
          echo "image=${ACR_PUSH_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "deploy_image=${ACR_PULL_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_PUSH_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - id: result
        shell: bash
        run: echo "image_ref=${{ steps.vars.outputs.deploy_image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    # main 分支构建镜像成功后必须部署；部署凭据缺失时应直接失败，不能静默跳过。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Sync production deployment assets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/basic-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          tar -C deploy/production -czf /tmp/production-deploy.tgz .
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'cat > /tmp/production-deploy.tgz' < /tmp/production-deploy.tgz
          printf -v install_command 'install -d -m 750 %q && install -d -m 700 %q/runtime && exec 9>%q/runtime/.deploy.lock && flock -w 900 9 && tar -xzf /tmp/production-deploy.tgz -C %q && chmod 750 %q/bin/deploy-service.sh && if test ! -f %q/runtime/contract.env; then install -m 600 %q/contract.env.example %q/runtime/contract.env; fi && if test -f %q/.env; then configured_path=$(awk -F= '\''$1 == "SUBSYSTEM_PRODUCTION_HOST_DEPLOY_ROOT" {print substr($0, index($0,"=")+1); exit}'\'' %q/.env); test -z "$configured_path" || test "$configured_path" = %q || { echo "SUBSYSTEM_PRODUCTION_HOST_DEPLOY_ROOT 与 DEPLOY_PATH 不一致" >&2; exit 1; }; fi && rm -f /tmp/production-deploy.tgz' "$DEPLOY_PATH" "$DEPLOY_PATH" "$DEPLOY_PATH" "$DEPLOY_PATH" "$DEPLOY_PATH" "$DEPLOY_PATH" "$DEPLOY_PATH" "$DEPLOY_PATH" "$DEPLOY_PATH" "$DEPLOY_PATH" "$DEPLOY_PATH"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$install_command"
      - name: Migrate and deploy immutable platform image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/basic-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command 'cd %q && ./bin/deploy-service.sh platform %q' "$DEPLOY_PATH" "$IMAGE_REF"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
