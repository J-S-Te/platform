name: platform-ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Validate production deployment scripts
        working-directory: .
        shell: bash
        run: |
          set -Eeuo pipefail
          for asset in \
            deploy/production/bin/deploy-service.sh \
            deploy/production/bin/deploy-customer-opportunity.sh \
            deploy/production/subsystem-templates/contract.env.example \
            deploy/production/subsystem-templates/customer.env.example \
            deploy/production/subsystem-templates/portal.env.example \
            deploy/production/subsystem-templates/project.env.example; do
            test -f "$asset" || { echo "missing production deployment asset: $asset" >&2; exit 1; }
          done
          if find deploy/production/subsystems.d -maxdepth 1 -type f \( -name '*-dev.yaml' -o -name '*-dev.yml' \) -print -quit | grep -q .; then
            echo "production deployment assets must not contain dev subsystem profiles" >&2
            exit 1
          fi
          bash -n deploy/production/bin/*.sh
          test -x deploy/production/bin/deploy-service.sh
          test -x deploy/production/bin/deploy-customer-opportunity.sh
          # 每次切换不可变镜像都必须重建业务容器，并核对容器最终使用的 digest，
          # 防止 release.env 已更新但旧容器仍在提供旧代码。
          grep -q -- '--force-recreate' deploy/production/bin/deploy-service.sh
          grep -q -- 'verify_service_image' deploy/production/bin/deploy-service.sh
          grep -q -- '--force-recreate' deploy/production/bin/deploy-customer-opportunity.sh
          grep -q -- 'verify_service_image' deploy/production/bin/deploy-customer-opportunity.sh
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' deploy/production; then
            echo "unresolved merge conflict marker found in production deployment assets" >&2
            exit 1
          fi

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.result.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        shell: bash
        env:
          ACR_PUSH_REGISTRY: ${{ vars.ACR_PUSH_REGISTRY }}
          ACR_PULL_REGISTRY: ${{ vars.ACR_PULL_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run: |
          set -Eeuo pipefail
          : "${ACR_PUSH_REGISTRY:?missing ACR_PUSH_REGISTRY}"
          : "${ACR_PULL_REGISTRY:?missing ACR_PULL_REGISTRY}"
          : "${ACR_NAMESPACE:?missing ACR_NAMESPACE}"
          : "${ACR_REPOSITORY:?missing ACR_REPOSITORY}"
          echo "image=${ACR_PUSH_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "deploy_image=${ACR_PULL_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_PUSH_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - id: result
        shell: bash
        run: echo "image_ref=${{ steps.vars.outputs.deploy_image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    # main 分支构建镜像成功后必须部署；部署凭据缺失时应直接失败，不能静默跳过。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect backend image changes
        # 只有会改变平台镜像内容的文件（backend 非测试源码、Dockerfile、go 模块、
        # CI 工作流）变化才需要部署新镜像并重启 platform-api；纯清单/文档/部署脚本
        # 变更只同步资产并重启 Agent 重载清单，避免每次 push 都打断门户与接入操作。
        id: detect
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          if grep -E '^\.github/workflows/ci-cd\.yml$' <<<"$changed" >/dev/null             || { grep -E '^(cmd|internal|migrations)/|^(Dockerfile|go\.mod|go\.sum|docker-entrypoint\.sh)$|^scripts/sync-contract-catalog\.sh$' <<<"$changed" | grep -vE '_test\.go$' | grep -q .; }; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync production deployment assets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/basic-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          tar -C deploy/production -czf /tmp/production-deploy.tgz .
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'cat > /tmp/production-deploy.tgz' < /tmp/production-deploy.tgz
          printf -v install_command 'deploy_path=%q; install -d -m 750 "$deploy_path" && install -d -m 700 "$deploy_path/runtime" && exec 9>"$deploy_path/runtime/.deploy.lock" && flock -w 900 9 && tar -xzf /tmp/production-deploy.tgz -C "$deploy_path" && if test -d "$deploy_path/subsystems.d"; then find "$deploy_path/subsystems.d" -maxdepth 1 -type f \( -name "*-dev.yaml" -o -name "*-dev.yml" \) -delete; fi && chmod 750 "$deploy_path/bin/deploy-service.sh" "$deploy_path/bin/deploy-customer-opportunity.sh" && if test ! -f "$deploy_path/runtime/contract.env"; then install -m 600 "$deploy_path/subsystem-templates/contract.env.example" "$deploy_path/runtime/contract.env"; fi && if test ! -f "$deploy_path/runtime/customer.env"; then install -m 600 "$deploy_path/subsystem-templates/customer.env.example" "$deploy_path/runtime/customer.env"; fi && if test ! -f "$deploy_path/runtime/portal.env"; then install -m 600 "$deploy_path/subsystem-templates/portal.env.example" "$deploy_path/runtime/portal.env"; fi && if test ! -f "$deploy_path/runtime/project.env"; then install -m 600 "$deploy_path/subsystem-templates/project.env.example" "$deploy_path/runtime/project.env"; fi && if test -f "$deploy_path/.env"; then configured_path=$(awk -F= '\''$1 == "SUBSYSTEM_PRODUCTION_HOST_DEPLOY_ROOT" {print substr($0, index($0,"=")+1); exit}'\'' "$deploy_path/.env"); test -z "$configured_path" || test "$configured_path" = "$deploy_path" || { echo "SUBSYSTEM_PRODUCTION_HOST_DEPLOY_ROOT 与 DEPLOY_PATH 不一致" >&2; exit 1; }; fi && rm -f /tmp/production-deploy.tgz' "$DEPLOY_PATH"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$install_command"
      - name: Apply test-server placeholder database credentials switch
        # 当前部署环境为测试服务器（environment: test）。每次部署都会把占位凭据
        # 开关写入服务器 .env 并重建 Agent，让测试接入不再被数据库密码阻塞。
        # 生产部署必须把 vars.SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS
        # 设为 false（或移除本步骤），该开关不会修改已有 MySQL 账号密码。
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SWITCH_VALUE: ${{ vars.SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS || 'true' }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/basic-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command 'cd %q && if grep -q "^SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS=" .env; then sed -i "s/^SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS=.*/SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS=%q/" .env; else echo "SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS=%q" >> .env; fi && chmod 600 .env && echo "placeholder switch applied"' "$DEPLOY_PATH" "$SWITCH_VALUE" "$SWITCH_VALUE"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"

      - name: Restart agent to reload manifests
        # 纯清单/配置变更时只重建 Agent 重载 subsystems.d，不触碰 platform-api，
        # 避免接入和门户访问被部署打断。后端镜像变更时由 deploy-service.sh 一并重建。
        if: steps.detect.outputs.backend_changed != 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/basic-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          # 通过 stdin 将完整脚本交给远端 bash，避免把 heredoc/单引号/反斜杠
          # 拼进 ssh 命令参数后被本地 shell、ssh 和远端 shell 多次解析。
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd $(printf '%q' "$DEPLOY_PATH") && bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          compose=(docker compose --env-file .env --env-file .release.env -f compose.yaml)
          # 资产同步类提交不一定会更新 .release.env。此时复用当前健康 Agent 的
          # 不可变镜像，避免 Compose 把 PLATFORM_IMAGE 展开为空并阻断清单重载。
          subsystem_id="$("${compose[@]}" ps -q subsystem-provisioner || true)"
          [[ -n "$subsystem_id" ]] || {
            echo "[ci] 未找到现有 subsystem-provisioner，且本次不是平台镜像发布，无法安全重建 Agent" >&2
            exit 1
          }
          current_platform_image="$(docker inspect "$subsystem_id" --format '{{.Config.Image}}' 2>/dev/null || true)"
          [[ "$current_platform_image" =~ @sha256:[a-f0-9]{64}$ ]] || {
            echo "[ci] 当前 subsystem-provisioner 未使用可验证的不可变平台镜像：$current_platform_image" >&2
            exit 1
          }
          if ! PLATFORM_IMAGE="$current_platform_image" "${compose[@]}" up -d --force-recreate --wait --wait-timeout 60 --no-deps subsystem-provisioner; then
            echo "[ci] subsystem-provisioner start failed" >&2
            "${compose[@]}" ps subsystem-provisioner || true
            subsystem_id="$("${compose[@]}" ps -q subsystem-provisioner || true)"
            if [[ -n "$subsystem_id" ]]; then
              docker inspect "$subsystem_id" --format '{{json .State}}' || true
            fi
            "${compose[@]}" logs --no-color --tail 200 subsystem-provisioner || true
            exit 1
          fi
          REMOTE_SCRIPT

      - name: Migrate and deploy immutable platform image
        if: steps.detect.outputs.backend_changed == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/basic-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command 'cd %q && ./bin/deploy-service.sh platform %q' "$DEPLOY_PATH" "$IMAGE_REF"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
