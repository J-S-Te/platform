name: platform-ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - name: Verify Agent credential ownership under isolated root execution
        shell: bash
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/runtime-license-owner.test" ./internal/platform/applicationregistry/infrastructure
          sudo -n -- "$RUNNER_TEMP/runtime-license-owner.test" -test.run '^Test(RuntimeLicenseCredentials|AccessProofs)UseRuntimeDirectoryOwner$' -test.v
      - run: go vet ./...
      - name: Validate production deployment scripts
        working-directory: .
        shell: bash
        run: |
          set -Eeuo pipefail
          for asset in \
            deploy/production/bin/deploy-service.sh \
            deploy/production/bin/deploy-customer-opportunity.sh \
            deploy/production/subsystem-templates/contract.env.example \
            deploy/production/subsystem-templates/customer.env.example \
            deploy/production/subsystem-templates/portal.env.example \
            deploy/production/subsystem-templates/project.env.example \
            deploy/production/subsystem-templates/data-analysis.env.example; do
            test -f "$asset" || { echo "missing production deployment asset: $asset" >&2; exit 1; }
          done
          if find deploy/production/subsystems.d -maxdepth 1 -type f \( -name '*-dev.yaml' -o -name '*-dev.yml' \) -print -quit | grep -q .; then
            echo "production deployment assets must not contain dev subsystem profiles" >&2
            exit 1
          fi
          bash -n deploy/production/bin/*.sh
          sh scripts/test-docker-entrypoint-key-init.sh
          python3 deploy/production/tests/test-compose-blocks.py
          python3 deploy/production/tests/test-ci-assets-sync.py
          python3 deploy/production/tests/test-deploy-service-preflight.py
          python3 deploy/production/tests/test-customer-deploy-result.py
          python3 deploy/production/tests/test-platform-coordinated-upgrade.py
          python3 -B deploy/production/tests/test-audit-hash-key-init.py
          python3 deploy/production/tests/test-managed-deployment-defaults.py
          python3 deploy/production/tests/test-frontend-network.py
          python3 deploy/production/tests/test-public-proxy-prefetch.py
          python3 deploy/production/tests/test-offline-image-identities.py
          python3 -B deploy/production/tests/test-offline-platform-selection.py
          python3 -B deploy/production/tests/test-delivery-inspect.py
          python3 -B deploy/production/tests/test-deployment-session.py
          python3 deploy/production/bin/test-deployment-plan.py
          python3 deploy/production/tests/test-deployment-compatibility.py
          bash deploy/production/bin/test-recovery-status.sh
          bash deploy/production/bin/test-first-failure.sh
          sudo bash deploy/production/bin/test-offline-configure.sh
          bash deploy/production/bin/test-release-reliability.sh
          bash deploy/production/tests/test-assets-install.sh
          python3 -B deploy/production/tests/test-delivery-files.py
          python3 -B deploy/production/tests/test-delivery-runtime.py
          python3 deploy/production/bin/test-subsystem-runtime.py
          python3 deploy/production/bin/test-subsystem-completion.py
          python3 deploy/production/bin/test-presale-release-transaction.py
          bash deploy/production/bin/test-compose-scope.sh
          bash deploy/production/bin/test-start-enabled.sh
          bash deploy/production/bin/test-subsystem-state-machine.sh
          bash deploy/production/bin/test-offline-import.sh
          bash deploy/production/bin/test-verify-readiness.sh
          bash deploy/production/tests/test-key-init.sh
          test -x deploy/production/bin/deploy-service.sh
          test -x deploy/production/bin/deploy-customer-opportunity.sh
          # 每次切换不可变镜像都必须重建业务容器，并核对容器最终使用的 digest，
          # 防止 release.env 已更新但旧容器仍在提供旧代码。
          grep -q -- '--force-recreate' deploy/production/bin/deploy-service.sh
          grep -q -- 'verify_service_image' deploy/production/bin/deploy-service.sh
          grep -q -- '--force-recreate' deploy/production/bin/deploy-customer-opportunity.sh
          grep -q -- 'verify_service_image' deploy/production/bin/deploy-customer-opportunity.sh
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' deploy/production; then
            echo "unresolved merge conflict marker found in production deployment assets" >&2
            exit 1
          fi

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.result.outputs.image_ref }}
      file_gateway_image_ref: ${{ steps.result.outputs.file_gateway_image_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        shell: bash
        env:
          ACR_PUSH_REGISTRY: ${{ vars.ACR_PUSH_REGISTRY }}
          ACR_PULL_REGISTRY: ${{ vars.ACR_PULL_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run: |
          set -Eeuo pipefail
          : "${ACR_PUSH_REGISTRY:?missing ACR_PUSH_REGISTRY}"
          : "${ACR_PULL_REGISTRY:?missing ACR_PULL_REGISTRY}"
          : "${ACR_NAMESPACE:?missing ACR_NAMESPACE}"
          : "${ACR_REPOSITORY:?missing ACR_REPOSITORY}"
          echo "image=${ACR_PUSH_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "deploy_image=${ACR_PULL_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_PUSH_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - id: file_gateway_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: file-gateway-runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.image }}:file-gateway-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=file-gateway
          cache-to: type=gha,mode=max,scope=file-gateway
          provenance: true
          sbom: true
      - id: result
        shell: bash
        run: |
          echo "image_ref=${{ steps.vars.outputs.deploy_image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "file_gateway_image_ref=${{ steps.vars.outputs.deploy_image }}@${{ steps.file_gateway_build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    # main 分支构建镜像成功后必须部署；部署凭据缺失时应直接失败，不能静默跳过。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect backend image changes
        # 后端或服务编排变化必须执行完整平台发布，应用 API/Worker/Agent 的配置。
        # 纯清单、文档与部署脚本变化仍可同步资产后成对重载控制面，复用当前镜像。
        id: detect
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          platform_release_paths='^\.github/workflows/ci-cd\.yml$'
          platform_release_paths+='|^deploy/production/docker-compose\.yml$'
          platform_release_paths+='|^deploy/production/bin/platform-mysql-command\.py$'
          platform_release_paths+='|^deploy/production/bin/deploy-service\.sh$'
          backend_paths='^(cmd|internal|migrations|scripts)/'
          backend_paths+='|^(Dockerfile|go\.mod|go\.sum|docker-entrypoint\.sh)$'
          if grep -Eq "$platform_release_paths" <<<"$changed" \
            || { grep -E "$backend_paths" <<<"$changed" \
                 | grep -vE '_test\.go$' >/dev/null; }; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync production deployment assets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          FILE_GATEWAY_IMAGE_REF: ${{ needs.image.outputs.file_gateway_image_ref }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
          BACKEND_CHANGED: ${{ steps.detect.outputs.backend_changed }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/unified-identity-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          # 使用与离线交付相同的校验、事务安装及重载门禁，保留服务器的模块选择。
          asset_work_dir="$(mktemp -d)"
          trap 'rm -rf -- "$asset_work_dir"' EXIT
          tar -C deploy/production -czf "$asset_work_dir/deployment-assets.tar.gz" \
            bin subsystems.d subsystem-templates mysql-init nginx monitoring tests \
            docker-compose.yml .env.example .release.env.example .gitignore \
            ACCEPTANCE_CHECKLIST.md README.md OFFLINE_DEPLOYMENT.md OFFLINE_RUNBOOK.md \
            DEPLOYMENT_COMPATIBILITY.md deployment-compatibility.json DELIVERY_WORKFLOW.md BACKUP_RECOVERY.md
          (cd "$asset_work_dir" && sha256sum deployment-assets.tar.gz > deployment-assets.tar.gz.sha256)
          cp deploy/production/bin/install-assets.sh "$asset_work_dir/install-assets.sh"
          cp deploy/production/bin/provisioner-config-refresh.sh "$asset_work_dir/provisioner-config-refresh.sh"
          cp deploy/production/bin/frontend-network.py "$asset_work_dir/frontend-network.py"
          printf -v install_command 'deploy_path=%q; gateway_image=%q; platform_image=%q; backend_changed=%q; set -Eeuo pipefail; [[ "$gateway_image" =~ @sha256:[a-f0-9]{64}$ ]] || exit 1; work_dir=$(mktemp -d); trap '\''rm -rf -- "$work_dir"'\'' EXIT; tar -xzf - -C "$work_dir"; source "$work_dir/provisioner-config-refresh.sh"; deploy_dir="$deploy_path"; prepare_ci_deploy_root; if [[ "$backend_changed" != true ]] && { test -e "$deploy_path/runtime/.control-plane-reload-required" || test -L "$deploy_path/runtime/.control-plane-reload-required"; }; then (cd "$deploy_path" && FILE_GATEWAY_IMAGE="$gateway_image" ./bin/deploy.sh reload-control-plane); fi; if [[ "$backend_changed" == true ]]; then [[ "$platform_image" =~ ^[^[:space:]]+@sha256:[a-f0-9]{64}$ ]] || exit 1; export ASSETS_PLATFORM_UPGRADE_IMAGE="$platform_image"; fi; bash "$work_dir/install-assets.sh" "$work_dir/deployment-assets.tar.gz" "$deploy_path"' "$DEPLOY_PATH" "$FILE_GATEWAY_IMAGE_REF" "$IMAGE_REF" "$BACKEND_CHANGED"
          tar -C "$asset_work_dir" -czf - deployment-assets.tar.gz deployment-assets.tar.gz.sha256 install-assets.sh provisioner-config-refresh.sh frontend-network.py | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -c $(printf '%q' "$install_command")"
      - name: Check deployment compatibility
        if: steps.detect.outputs.backend_changed == 'true' && vars.ENFORCE_DEPLOY_COMPATIBILITY == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/unified-identity-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command 'cd %q && ./bin/deploy.sh plan --action upgrade --component platform --compatibility-only --format human' "$DEPLOY_PATH"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"

      - name: Apply test-server placeholder database credentials switch
        # 当前部署环境为测试服务器（environment: test）。每次部署都会把占位凭据
        # 开关写入服务器 .env 并重建 Agent，让测试接入不再被数据库密码阻塞。
        # 生产部署必须把 vars.SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS
        # 设为 false（或移除本步骤），该开关不会修改已有 MySQL 账号密码。
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SWITCH_VALUE: ${{ vars.SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS || 'true' }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/unified-identity-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command 'cd %q && if grep -q "^SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS=" .env; then sed -i "s/^SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS=.*/SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS=%q/" .env; else echo "SUBSYSTEM_PRODUCTION_ALLOW_PLACEHOLDER_DATABASE_CREDENTIALS=%q" >> .env; fi && chmod 600 .env && echo "placeholder switch applied"' "$DEPLOY_PATH" "$SWITCH_VALUE" "$SWITCH_VALUE"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"

      - name: Reload paired subsystem control plane
        if: steps.detect.outputs.backend_changed != 'true'
        # 纯资产使用已有镜像重载；平台镜像发布先迁移，再升级并验证新 API/Agent。
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          FILE_GATEWAY_IMAGE_REF: ${{ needs.image.outputs.file_gateway_image_ref }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/unified-identity-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          # 通过 stdin 将完整脚本交给远端 bash，避免把 heredoc/单引号/反斜杠
          # 拼进 ssh 命令参数后被本地 shell、ssh 和远端 shell 多次解析。
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd $(printf '%q' "$DEPLOY_PATH") && bash -s -- $(printf '%q' "$FILE_GATEWAY_IMAGE_REF")" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          # 旧版 release.env 可能尚未包含独立文件网关镜像。
          # 已验证的候选镜像仅用于解析 Compose 并执行控制面成对重载。
          # deploy-service 执行迁移前，保持 PLATFORM_IMAGE 不变。
          [[ "${1:-}" =~ @sha256:[a-f0-9]{64}$ ]] || { echo 'invalid File Gateway candidate digest' >&2; exit 1; }
          export FILE_GATEWAY_IMAGE="$1"
          ./bin/deploy.sh reload-control-plane
          REMOTE_SCRIPT

      - name: Migrate and deploy immutable platform image
        if: steps.detect.outputs.backend_changed == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
          FILE_GATEWAY_IMAGE_REF: ${{ needs.image.outputs.file_gateway_image_ref }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/unified-identity-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command 'cd %q && DEPLOY_PLATFORM_CONTROL_PLANE_UPGRADE=true ./bin/deploy-service.sh platform %q %q' "$DEPLOY_PATH" "$IMAGE_REF" "$FILE_GATEWAY_IMAGE_REF"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
